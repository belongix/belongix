<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belongix — Career Profile</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><a class="logo" href="index.html">Belong<b>ix</b></a><nav class="nav"><a href="dashboard.html">Workspace</a><a href="resume-builder.html">Resume Builder</a><a class="active" href="career-profile.html">Profile</a><a href="settings.html">Settings</a></nav></header><div class="container"><div class="pagehead"><div><h1>Career profile</h1><p>Your verified source of truth for every resume.</p></div><button class="btn primary" onclick="save()">Save profile</button></div><div class="grid two"><section class="card"><h2>Personal</h2><div class="field"><label>Full name</label><input id="name"></div><div class="row"><div class="field"><label>Email</label><input id="email" disabled></div><div class="field"><label>Phone</label><input id="phone"></div></div><div class="field"><label>Professional headline</label><input id="headline" placeholder="Senior Java Developer"></div><div class="field"><label>Professional summary</label><textarea id="summary" placeholder="Write a concise overview of your experience."></textarea></div></section><section class="card"><h2>Experience</h2><div id="experience"></div><button class="btn" onclick="addExperience()">+ Add experience</button></section><section class="card"><h2>Education</h2><div id="education"></div><button class="btn" onclick="addEducation()">+ Add education</button></section><section class="card"><h2>Skills</h2><div class="field"><label>Technical skills</label><input id="skills" placeholder="Java, Spring Boot, SQL"></div><div class="field"><label>Tools & technologies</label><input id="tools" placeholder="Git, Docker, AWS"></div><p class="muted">Keep this factual. Belongix AI can improve wording, but it will not invent skills.</p></section></div></div><script>
let session,profile={};let exps=[],edus=[];
function item(kind){return kind==='exp'?`<div class="card" style="margin-bottom:10px"><div class="row"><div class="field"><label>Job title</label><input class="ex-title"></div><div class="field"><label>Company</label><input class="ex-company"></div></div><div class="row"><div class="field"><label>Dates</label><input class="ex-dates"></div><div class="field"><label>Location</label><input class="ex-location"></div></div><div class="field"><label>Achievements</label><textarea class="ex-bullets" placeholder="One achievement per line"></textarea></div></div>`:`<div class="card" style="margin-bottom:10px"><div class="row"><div class="field"><label>Degree</label><input class="ed-degree"></div><div class="field"><label>Institution</label><input class="ed-school"></div></div><div class="field"><label>Dates</label><input class="ed-dates"></div></div>`}
function addExperience(){document.getElementById('experience').insertAdjacentHTML('beforeend',item('exp'))}function addEducation(){document.getElementById('education').insertAdjacentHTML('beforeend',item('edu'))}
async function load(){session=await BX.requireAuth();if(!session)return;document.getElementById('email').value=session.user.email||'';if(!BX.sb)return;let r=await BX.sb.from('career_profiles').select('*').eq('user_id',session.user.id).maybeSingle();profile=r.data||{};document.getElementById('name').value=profile.full_name||'';document.getElementById('phone').value=profile.phone||'';document.getElementById('headline').value=profile.headline||'';document.getElementById('summary').value=profile.summary||'';document.getElementById('skills').value=(profile.skills||[]).join(', ');document.getElementById('tools').value=(profile.tools||[]).join(', ');if(profile.experience?.length)profile.experience.forEach(()=>addExperience());if(profile.education?.length)profile.education.forEach(()=>addEducation());let xs=[...document.querySelectorAll('.card .ex-title')];(profile.experience||[]).forEach((x,i)=>{xs[i].value=x.title||'';document.querySelectorAll('.ex-company')[i].value=x.company||'';document.querySelectorAll('.ex-dates')[i].value=x.dates||'';document.querySelectorAll('.ex-location')[i].value=x.location||'';document.querySelectorAll('.ex-bullets')[i].value=(x.bullets||[]).join('\\n')})}
async function save(){if(!session)return;let experience=[...document.querySelectorAll('.ex-title')].map((_,i)=>({title:document.querySelectorAll('.ex-title')[i].value,company:document.querySelectorAll('.ex-company')[i].value,dates:document.querySelectorAll('.ex-dates')[i].value,location:document.querySelectorAll('.ex-location')[i].value,bullets:document.querySelectorAll('.ex-bullets')[i].value.split('\\n').map(x=>x.trim()).filter(Boolean)}));let education=[...document.querySelectorAll('.ed-degree')].map((_,i)=>({degree:document.querySelectorAll('.ed-degree')[i].value,school:document.querySelectorAll('.ed-school')[i].value,dates:document.querySelectorAll('.ed-dates')[i].value}));let row={user_id:session.user.id,full_name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),headline:document.getElementById('headline').value.trim(),summary:document.getElementById('summary').value.trim(),skills:document.getElementById('skills').value.split(',').map(x=>x.trim()).filter(Boolean),tools:document.getElementById('tools').value.split(',').map(x=>x.trim()).filter(Boolean),experience,education};let r=await BX.sb.from('career_profiles').upsert(row,{onConflict:'user_id'});BX.toast(r.error?r.error.message:'Profile saved');}load();
</script></body></html>
