<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Belongix</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="belongix-auth.js"></script></head><body><header class="topbar"><div class="shell" data-app-nav></div></header><main class="page"><div class="shell"><div class="panel"><div class="eyebrow">Profile</div><h1 style="font-size:38px;letter-spacing:-1.5px;margin:8px 0">Your resume profile</h1><p>Keep your core professional details ready to reuse across resumes.</p><div id="status" class="notice">Checking your account…</div></div><div class="panel"><form id="profile-form" class="form"><div class="grid2"><div><div class="label">Full name</div><input id="full_name" class="input" required></div><div><div class="label">Target role</div><input id="target_role" class="input" placeholder="e.g. Java Developer"></div></div><div class="grid2"><div><div class="label">Email</div><input id="email" class="input" disabled></div><div><div class="label">Phone</div><input id="phone" class="input"></div></div><div><div class="label">Professional summary</div><textarea id="summary" class="textarea"></textarea></div><div><div class="label">Skills</div><textarea id="skills" class="textarea" placeholder="Java, Spring Boot, SQL, REST APIs"></textarea></div><button class="btn primary" type="submit">Save profile</button></form></div></div></main><script src="app.js"></script><script>const sb=window.belongixSupabase;let user;async function init(){user=await belongixAuth.requireUser();if(!user)return;document.getElementById('email').value=user.email||'';let r=await sb.from('career_profiles').select('*').eq('user_id',user.id).maybeSingle();if(r.error){document.getElementById('status').textContent='Profile table is not ready. Run the included SQL migration first.';return}if(r.data){for(const k of ['full_name','target_role','phone','summary','skills'])document.getElementById(k).value=r.data[k]||''}document.getElementById('status').textContent='Signed in as '+(user.email||'your account');}document.getElementById('profile-form').onsubmit=async e=>{e.preventDefault();if(!user)return;const data={user_id:user.id,full_name:full_name.value,target_role:target_role.value,phone:phone.value,summary:summary.value,skills:skills.value,updated_at:new Date().toISOString()};const r=await sb.from('career_profiles').upsert(data,{onConflict:'user_id'});document.getElementById('status').textContent=r.error?'Could not save: '+r.error.message:'Profile saved ✓'};init();</script></body></html>
