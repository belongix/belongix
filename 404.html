<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page Not Found — Belongix</title>
<link rel="icon" href="icons/icon-32.png"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{--brand:#2D1B69;--brand2:#4C2FAA;--accent:#FF5C35;--accent2:#FF8A50;--ink:#0D0D1A;--muted:#5A5A7A;--border:#E4E4F0;--ff:'Sora',sans-serif;--fb:'DM Sans',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);color:var(--ink);background:linear-gradient(135deg,#08011F,#130836,#1A0A4A);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden;}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.orb1{width:400px;height:400px;background:rgba(76,47,170,.25);top:-100px;left:-100px}
.orb2{width:300px;height:300px;background:rgba(255,92,53,.15);bottom:-80px;right:-80px}
.card{position:relative;z-index:2;max-width:520px}
.code{font-family:var(--ff);font-size:clamp(80px,18vw,140px);font-weight:900;background:linear-gradient(135deg,#7C3AED,#4C2FAA,#FF5C35);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:4px;letter-spacing:-6px}
.emoji{font-size:52px;margin-bottom:16px;display:block}
h1{font-family:var(--ff);font-size:clamp(22px,4vw,32px);font-weight:900;color:#fff;margin-bottom:10px;letter-spacing:-.5px}
p{font-size:15.5px;color:rgba(255,255,255,.55);margin-bottom:32px;line-height:1.6;max-width:400px;margin-left:auto;margin-right:auto}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-primary{padding:13px 28px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:var(--ff);font-size:14.5px;font-weight:800;text-decoration:none;box-shadow:0 6px 20px rgba(255,92,53,.4);transition:.2s;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,92,53,.5)}
.btn-secondary{padding:13px 24px;border-radius:12px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);font-family:var(--fb);font-size:14px;font-weight:600;text-decoration:none;transition:.2s;}
.btn-secondary:hover{background:rgba(255,255,255,.14);color:#fff}
.suggestions{margin-top:44px;padding-top:28px;border-top:1px solid rgba(255,255,255,.1)}
.suggestions p{font-size:13px;color:rgba(255,255,255,.35);margin-bottom:14px}
.sugg-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sugg-link{padding:7px 16px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);font-size:13px;text-decoration:none;transition:.15s;}
.sugg-link:hover{background:rgba(255,255,255,.12);color:#fff}
</style>
</head>
<body>
<div class="grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <div class="code">404</div>
  <span class="emoji">🔍</span>
  <h1>Page not found</h1>
  <p>Looks like this page took a different career path. The URL might be wrong, or this page may have moved.</p>
  <div class="btns">
    <a href="index.html" class="btn-primary">Go to Homepage</a>
    <a href="courses.html" class="btn-secondary">Browse Courses</a>
  </div>
  <div class="suggestions">
    <p>Looking for something specific?</p>
    <div class="sugg-links">
      <a href="courses.html" class="sugg-link">📚 All Courses</a>
      <a href="dashboard.html" class="sugg-link">📊 Dashboard</a>
      <a href="about.html" class="sugg-link">ℹ️ About Us</a>
      <a href="contact.html" class="sugg-link">✉️ Contact</a>
    </div>
  </div>
</div>
</body>
</html>
