<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — Belongix</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="top"><a class="brand" href="dashboard.html">Belong<span>ix</span></a><nav class="topnav"><a href="dashboard.html">Dashboard</a><a href="career-profile.html">Profile</a><a href="resume-builder.html">Resume</a><a href="applications.html">Applications</a></nav><div class="topright"><button class="btn" onclick="BX.signOut()">Sign out</button></div></header><main class="main"><div class="pagehead"><div><h1>Settings</h1><p>Account, notifications, usage and data controls.</p></div></div><div class="grid grid2"><div class="card"><h2>Account</h2><div id="email" class="muted"></div><hr style="border:0;border-top:1px solid #eee;margin:15px 0"><button class="btn" onclick="BX.toast('Password reset email requested')">Reset password</button></div><div class="card"><h2>Notifications</h2><label><input type="checkbox" checked> Application reminders</label><br><label><input type="checkbox" checked> Interview reminders</label><br><label><input type="checkbox" checked> Career recommendations</label></div><div class="card"><h2>Plan & usage</h2><div class="list"><div class="listitem"><span>Plan</span><b>Free</b></div><div class="listitem"><span>AI usage</span><b>Tracked server-side</b></div><div class="listitem"><span>Billing</span><b>Provider webhook required</b></div></div></div><div class="card"><h2>Data</h2><button class="btn" onclick="downloadData()">Export my data</button><button class="btn danger" style="margin-left:8px" onclick="deleteData()">Clear local workspace</button></div></div></main><script>BX.session().then(s=>{if(s)document.getElementById('email').textContent=s.user.email});function downloadData(){let data={profile:BX.local('profile'),resume:BX.local('resume'),applications:BX.local('applications'),jobs:BX.local('jobs')};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='belongix-data.json';a.click()}function deleteData(){if(confirm('Clear local workspace data?')){Object.keys(localStorage).filter(k=>k.startsWith('bx_')).forEach(k=>localStorage.removeItem(k));location.reload()}}</script></body></html>
