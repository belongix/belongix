<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belongix — Settings</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body>
<header class="topbar">
  <a class="logo" href="index.html">Belong<b>ix</b></a>
  <nav class="nav"><a href="dashboard.html">Workspace</a><a href="resume-builder.html">Resume Builder</a><a href="career-profile.html">Profile</a><a class="active" href="settings.html">Settings</a></nav>
</header>
<div class="container">
  <div class="pagehead"><div><span class="eyebrow">Account</span><h1>Settings</h1><p>Manage your Belongix account.</p></div></div>
  <div class="grid two gap">
    <div class="card">
      <h2>Account</h2>
      <div class="field" style="margin-top:16px"><label>Email</label><input id="email" disabled></div>
      <button class="btn" onclick="BX.signOut()">Sign out</button>
    </div>
    <div class="card">
      <h2>Privacy</h2>
      <p class="muted">Your resume data is stored for your account and used to provide the resume-building service.</p>
      <button class="btn danger" onclick="BX.toast('Account deletion should be handled through the secure server workflow.')">Delete account</button>
    </div>
  </div>
</div>
<script>(async()=>{let s=await BX.requireAuth();if(s)document.getElementById('email').value=s.user.email||''})()</script>
</body></html>
