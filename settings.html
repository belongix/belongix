<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Settings — Belongix</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-shell.js"></script>
<style>
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border);font-size:13px}
.toggle-row:first-child{border-top:none}
.danger-panel{border-color:#FCA5A5}
.btn-danger-solid{background:var(--error);color:#fff;border:none}
</style>
</head>
<body>
<script>
var SB_URL='https://efhcfuaxgbzuqlmhlsxc.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _user=null;

window.addEventListener('load',async function(){
  var s=await sb.auth.getSession();
  if(!s.data||!s.data.session){window.location.href='career-profile.html';return;}
  _user=s.data.session.user;

  renderAppShell('settings', ''
    +'<h1 style="margin-bottom:20px">Settings</h1>'
    +'<div class="card" style="margin-bottom:16px;max-width:480px"><div class="card-title">Account</div>'
    +'<div class="field"><label>Email</label><input id="s-email" disabled/></div>'
    +'<div class="field"><label>New password</label><input type="password" id="s-new-password" placeholder="Leave blank to keep current password"/></div>'
    +'<button class="btn btn-primary" onclick="updatePassword()">Update Password</button></div>'

    +'<div class="card" style="margin-bottom:16px;max-width:480px"><div class="card-title">Notification Preferences</div>'
    +'<div class="toggle-row"><span>Application reminders</span><input type="checkbox" id="n-app-reminders" checked style="width:auto"/></div>'
    +'<div class="toggle-row"><span>Interview reminders</span><input type="checkbox" id="n-interview-reminders" checked style="width:auto"/></div>'
    +'<div class="toggle-row"><span>Career recommendations</span><input type="checkbox" id="n-recommendations" checked style="width:auto"/></div>'
    +'<button class="btn btn-secondary" style="margin-top:14px" onclick="saveNotificationPrefs()">Save Preferences</button>'
    +'<p style="font-size:11.5px;color:var(--text-secondary);margin-top:10px">Stored preference only — this build has no automated email delivery yet, so nothing will actually be sent based on these toggles until that system exists.</p></div>'

    +'<div class="card" style="margin-bottom:16px;max-width:480px"><div class="card-title">Your Data</div>'
    +'<p style="font-size:12.5px;color:var(--text-secondary);margin-bottom:12px">Download a real export of your actual stored data — career profile, resumes, applications, analyzed jobs.</p>'
    +'<button class="btn btn-secondary" onclick="exportData()">⬇ Export My Data (JSON)</button></div>'

    +'<div class="card danger-panel" style="max-width:480px"><div class="card-title" style="color:var(--error)">Danger Zone</div>'
    +'<p style="font-size:12.5px;color:var(--text-secondary);margin-bottom:12px">Permanently delete your account and all associated data — career profile, resumes, applications, analyzed jobs, AI history. This cannot be undone.</p>'
    +'<button class="btn btn-danger-solid" onclick="confirmDelete()">Delete My Account</button></div>'
  , _user.email);

  document.getElementById('s-email').value=_user.email;
  try{
    var r=await sb.from('user_settings').select('*').eq('user_id',_user.id).maybeSingle();
    if(r.data){
      document.getElementById('n-app-reminders').checked=r.data.notify_application_updates!==false;
      document.getElementById('n-interview-reminders').checked=r.data.notify_interview_reminders!==false;
      document.getElementById('n-recommendations').checked=r.data.notify_career_recommendations!==false;
    }
  }catch(e){console.error('Could not load settings:',e);}
});

async function updatePassword(){
  var pw=document.getElementById('s-new-password').value;
  if(!pw||pw.length<8){showToast('Password must be at least 8 characters');return;}
  try{
    var r=await sb.auth.updateUser({password:pw});
    if(r.error)throw r.error;
    document.getElementById('s-new-password').value='';
    showToast('Password updated ✓');
  }catch(e){console.error(e);showToast('⚠️ '+e.message);}
}

async function saveNotificationPrefs(){
  var prefs={user_id:_user.id,
    notify_application_updates:document.getElementById('n-app-reminders').checked,
    notify_interview_reminders:document.getElementById('n-interview-reminders').checked,
    notify_career_recommendations:document.getElementById('n-recommendations').checked};
  try{
    var r=await sb.from('user_settings').upsert(prefs,{onConflict:'user_id'});
    if(r.error)throw r.error;
    showToast('Preferences saved ✓');
  }catch(e){console.error(e);showToast('⚠️ Could not save preferences');}
}

async function exportData(){
  try{
    var profile=await sb.from('career_profiles').select('*').eq('user_id',_user.id).maybeSingle();
    var workExp=await sb.from('career_work_experience').select('*').eq('user_id',_user.id);
    var education=await sb.from('career_education').select('*').eq('user_id',_user.id);
    var resumes=await sb.from('resumes').select('*').eq('user_id',_user.id);
    var applications=await sb.from('applications').select('*').eq('user_id',_user.id);
    var jobs=await sb.from('job_descriptions').select('*').eq('user_id',_user.id);
    var coverLetters=await sb.from('cover_letters').select('*').eq('user_id',_user.id);

    var exportBundle={
      exported_at:new Date().toISOString(),
      account_email:_user.email,
      career_profile:profile.data,
      work_experience:workExp.data,
      education:education.data,
      resumes:resumes.data,
      applications:applications.data,
      analyzed_jobs:jobs.data,
      cover_letters:coverLetters.data
    };
    var blob=new Blob([JSON.stringify(exportBundle,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='belongix-data-export.json';a.click();
    URL.revokeObjectURL(url);
    showToast('Export downloaded ✓');
  }catch(e){console.error(e);showToast('⚠️ Export failed — check your connection');}
}

async function confirmDelete(){
  var typed=prompt('This permanently deletes your account and all data. Type DELETE to confirm.');
  if(typed!=='DELETE'){if(typed!==null)showToast('Deletion cancelled — you must type DELETE exactly');return;}
  try{
    var session=await sb.auth.getSession();
    var r=await fetch(SB_URL+'/functions/v1/delete-account',{method:'POST',
      headers:{'Authorization':'Bearer '+session.data.session.access_token}});
    if(!r.ok){var d=await r.json().catch(function(){return{};});throw new Error(d.error||'Deletion failed');}
    await sb.auth.signOut();
    alert('Your account has been deleted.');
    window.location.href='index.html';
  }catch(e){
    console.error(e);
    showToast('⚠️ '+e.message);
  }
}
</script>
</body>
</html>
