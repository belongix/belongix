<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — Belongix</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="belongix-auth.js"></script><style>:root{--paper:#f7f6f1;--card:#fff;--ink:#17160f;--muted:#6b685e;--line:#ddd8ca;--accent:#3b5d4e;--serif:'Fraunces',Georgia,serif;--sans:'Inter',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{text-decoration:none;color:inherit}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:32px}.logo{font-family:var(--serif);font-weight:700;font-size:22px}.nav{display:flex;gap:24px}.nav a{font-size:14px;color:var(--muted)}.nav a.active{color:var(--ink);font-weight:700}.right{margin-left:auto}.wrap{max-width:820px;margin:auto;padding:70px 24px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:12px}.wrap h1{font-family:var(--serif);font-size:52px;margin:0}.sub{color:var(--muted);margin:8px 0 32px}.card{background:#fff;border:1px solid var(--line);padding:26px;margin-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:20px}.label{font-weight:700}.small{font-size:13px;color:var(--muted);margin-top:4px}.btn{border:1px solid var(--ink);background:transparent;border-radius:4px;padding:10px 15px;cursor:pointer}.danger{border-color:#9c3d32;color:#9c3d32}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--paper);padding:12px 16px;display:none;border-radius:4px}@media(max-width:700px){.nav{display:none}.topbar{padding:0 16px}.wrap{padding:44px 16px}.wrap h1{font-size:44px}.row{align-items:flex-start;flex-direction:column}}</style></head><body><header class="topbar"><a class="logo" href="index.html">Belongix</a><nav class="nav"><a href="resume-builder.html">Workspace</a><a href="resume-builder.html">Resume Builder</a><a href="career-profile.html">Profile</a><a class="active" href="settings.html">Settings</a></nav><div class="right"><button class="btn" onclick="signOut()">Sign out</button></div></header><main class="wrap"><div class="eyebrow">Account</div><h1>Settings</h1><p class="sub">Manage your Belongix account and session.</p><section class="card"><div class="row"><div><div class="label">Email</div><div class="small" id="email">Loading…</div></div></div></section><section class="card"><div class="row"><div><div class="label">Password</div><div class="small">Send a secure password reset email.</div></div><button class="btn" onclick="resetPassword()">Change password</button></div></section><section class="card"><div class="row"><div><div class="label">Sign out</div><div class="small">End the current Belongix session on this device.</div></div><button class="btn danger" onclick="signOut()">Sign out</button></div></section></main><div class="toast" id="toast"></div><script>async function init(){var u=await BelongixAuth.requireUser();if(u)document.getElementById('email').textContent=u.email||'—'}async function resetPassword(){var u=await BelongixAuth.requireUser();if(!u)return;try{var r=await BelongixAuth.sb.auth.resetPasswordForEmail(u.email,{redirectTo:location.origin+'/settings.html'});if(r.error)throw r.error;show('Password reset email sent.')}catch(e){show(e.message||'Could not send reset email')}}async function signOut(){await BelongixAuth.signOut();location.href='index.html'}function show(x){var t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}window.addEventListener('load',init)</script></body></html>
