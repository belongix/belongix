<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace — Belongix</title><meta name="description" content="Your Belongix resume workspace."><link rel="stylesheet" href="styles.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="belongix-auth.js"></script><script src="app.js" defer></script></head><body><header class="topbar"><div class="shell" data-app-nav></div></header><main class="workspace-page"><div class="shell"><div class="workspace-head"><div><div class="workspace-kicker">Your workspace</div><h1>Build your next great resume.</h1><p>Keep every resume version organized, improve your score, and export when it is ready.</p></div><div class="workspace-actions"><a class="btn ghost" href="career-profile.html">Profile</a><a class="btn primary" href="resume-builder.html">+ New Resume</a></div></div><div class="workspace-stats"><div class="stat-card"><div class="stat-label">Resumes</div><div class="stat-value" id="stat-resumes">—</div></div><div class="stat-card"><div class="stat-label">Best ATS score</div><div class="stat-value" id="stat-score">—</div></div><div class="stat-card"><div class="stat-label">Plan</div><div class="stat-value" id="stat-plan">Free</div></div></div><section><div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 14px"><div><h2 style="font-size:24px;letter-spacing:-.8px;margin:0">Your resumes</h2><p class="muted" style="margin:4px 0 0;font-size:13px">Your saved work, newest first.</p></div></div><div class="resume-grid" id="resume-grid"><div class="empty-state">Loading your resumes…</div></div></section></div></main><script>const sb=window.belongixSupabase;let currentUser=null;function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}async function init(){currentUser=await belongixAuth.requireUser();if(!currentUser)return;document.getElementById('stat-plan').textContent='Free';const grid=document.getElementById('resume-grid');const r=await sb.from('resumes').select('id,title,target_job,template,content,updated_at,is_deleted').eq('user_id',currentUser.id).eq('is_deleted',false).order('updated_at',{ascending:false});if(r.error){grid.innerHTML='<div class="empty-state"><b>We could not load your resumes.</b><br><span style="font-size:13px">Check your Supabase schema and connection, then refresh.</span></div>';return}const rows=r.data||[];document.getElementById('stat-resumes').textContent=rows.length;let best=0;rows.forEach(x=>{const n=Number(x.content?.score||0);if(n>best)best=n});document.getElementById('stat-score').textContent=best?best+'/100':'—';const newCard='<a class="resume-card new" href="resume-builder.html"><div class="resume-icon">+</div><div style="font-weight:800">Create a new resume</div><div class="muted" style="font-size:12px;margin-top:4px">Start from scratch</div></a>';if(!rows.length){grid.innerHTML=newCard+'<div class="empty-state">No saved resumes yet. Create your first one to start building.</div>';return}grid.innerHTML=rows.map(x=>'<article class="resume-card"><div class="resume-icon">▤</div><div class="resume-card-title">'+esc(x.title||'Untitled Resume')+'</div><div class="resume-card-sub">'+esc(x.target_job||'General resume')+'</div><div class="resume-card-meta">Edited '+new Date(x.updated_at).toLocaleDateString()+'</div><div class="resume-card-actions"><a class="btn primary" href="resume-builder.html?resume='+encodeURIComponent(x.id)+'">Edit</a><button class="btn ghost" onclick="removeResume(\''+x.id+'\')">Delete</button></div></article>').join('')+newCard}async function removeResume(id){if(!confirm('Delete this resume?'))return;const r=await sb.from('resumes').update({is_deleted:true}).eq('id',id).eq('user_id',currentUser.id);if(r.error){alert('Could not delete: '+r.error.message);return}location.reload()}init();</script></body></html>
