<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belongix — Workspace</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body>
<header class="topbar">
  <a class="logo" href="index.html">Belong<b>ix</b></a>
  <nav class="nav"><a class="active" href="dashboard.html">Workspace</a><a href="resume-builder.html">Resume Builder</a><a href="career-profile.html">Profile</a><a href="settings.html">Settings</a></nav>
  <div class="actions"><button class="btn ghost" onclick="BX.signOut()">Sign out</button><button class="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
</header>
<div class="drawer"><div class="drawerBackdrop"></div><div class="drawerPanel">
  <button class="drawerClose" aria-label="Close menu">×</button>
  <a class="active" href="dashboard.html">Workspace</a><a href="resume-builder.html">Resume Builder</a><a href="career-profile.html">Profile</a><a href="settings.html">Settings</a>
</div></div>
<div class="shell">
  <aside class="sidebar">
    <div class="sidegroup">Build</div>
    <a class="active" href="dashboard.html">Workspace</a>
    <a href="resume-builder.html">Resume Builder</a>
    <a href="career-profile.html">Career Profile</a>
    <div class="sidegroup">Account</div>
    <a href="settings.html">Settings</a>
  </aside>
  <main class="main">
    <div class="pagehead">
      <div><span class="eyebrow">Workspace</span><h1 id="greeting">Good morning</h1><p>Your next great opportunity starts with a stronger resume.</p></div>
      <button class="btn primary" onclick="createFromDashboard()">+ New Resume</button>
    </div>

    <section class="grid four" id="statRow" style="margin-bottom:6px"></section>

    <section style="margin-top:8px">
      <h2 style="font-size:16px;margin:0 0 12px">Your resumes</h2>
      <div class="grid three" id="resumeCards"></div>
    </section>
  </main>
</div>
<script>
const STORE_KEY='belongix_resumes_v1';
function loadStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY))}catch(e){return null}}
function saveStore(s){localStorage.setItem(STORE_KEY,JSON.stringify(s))}
function timeAgo(ts){let d=Date.now()-ts,m=Math.floor(d/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';let h=Math.floor(m/60);if(h<24)return h+'h ago';let days=Math.floor(h/24);if(days<30)return days+'d ago';return new Date(ts).toLocaleDateString()}
function profileCompletion(){
 try{let p=JSON.parse(localStorage.getItem('belongix_profile_cache')||'{}');
 let fields=[p.full_name,p.headline,p.summary,(p.skills||[]).length,(p.experience||[]).length];
 let filled=fields.filter(Boolean).length;
 return Math.round(filled/fields.length*100);
 }catch(e){return 0}
}
function render(){
 let store=loadStore();
 let resumes=store&&store.resumes?store.resumes:[];
 $('resumeCount').textContent=resumes.length;
 let avgScore=resumes.length?Math.round(resumes.reduce((s,r)=>s+(r.score||0),0)/resumes.length):0;
 $('avgScore').textContent=resumes.length?avgScore:'—';
 $('profileScore').textContent=profileCompletion()+'%';
 if(!resumes.length){
  $('resumeCards').innerHTML=`<div class="empty" style="grid-column:1/-1">
   <h3>Create your first resume</h3>
   <p class="muted">Start from your career profile or a blank template.</p>
   <button class="btn primary" style="margin-top:12px" onclick="createFromDashboard()">+ New Resume</button>
  </div>`;
  return;
 }
 $('resumeCards').innerHTML=resumes.slice().sort((a,b)=>b.updatedAt-a.updatedAt).map(r=>`
  <a class="card hoverable" href="resume-builder.html?r=${encodeURIComponent(r.id)}" style="display:block">
   <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
    <div>
     <div style="font-weight:700;font-size:15px">${BX.esc(r.name||'Untitled Resume')}</div>
     <div class="muted" style="font-size:12px;margin-top:2px">Updated ${timeAgo(r.updatedAt)}</div>
    </div>
    <span class="badge">${r.score!=null?r.score+'/100':'—'}</span>
   </div>
   <div class="muted" style="font-size:12.5px;margin-top:14px;text-transform:capitalize">${BX.esc((r.data&&r.data.template||'classic').replace(/-/g,' '))} template</div>
  </a>`).join('');
}
function $(id){return document.getElementById(id)}
function createFromDashboard(){location.href='resume-builder.html?new=1'}
(async()=>{
 let s=await BX.requireAuth();
 if(!s)return;
 $('greeting').textContent=s.user&&s.user.email?('Good morning, '+s.user.email.split('@')[0]):'Good morning';
 $('statRow').innerHTML=`
  <div class="card"><div class="stat" id="resumeCount">0</div><small>Resumes</small></div>
  <div class="card"><div class="stat" id="avgScore">—</div><small>Average ATS score</small></div>
  <div class="card"><div class="stat" id="profileScore">0%</div><small>Profile complete</small></div>
  <div class="card"><div class="stat">AI</div><small>Writing assistant</small></div>`;
 render();
})();
</script>
</body></html>
