<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard — Belongix</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-shell.js"></script>
</head>
<body>
<script>
var SB_URL='https://efhcfuaxgbzuqlmhlsxc.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _user=null;

window.addEventListener('load',async function(){
  var s=await sb.auth.getSession();
  if(!s.data||!s.data.session){window.location.href='career-profile.html';return;}
  _user=s.data.session.user;

  renderAppShell('dashboard', ''
    +'<div class="topbar"><div><h1 id="greeting">Dashboard</h1><p style="color:var(--text-secondary);font-size:13px;margin-top:2px">Here\'s your career progress.</p></div>'
    +'<a href="#" id="notif-bell" onclick="toggleNotifications(event)" style="position:relative;font-size:18px">🔔<span class="badge badge-error" id="notif-dot" style="hidden;position:absolute;top:-4px;right:-4px;width:8px;height:8px;padding:0;border-radius:50%" ></span></a></div>'

    +'<div class="card" style="background:var(--accent-light);border-color:#C7D2FE;margin-bottom:20px">'
    +'<div style="font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px">Recommended next action</div>'
    +'<div style="font-size:15px;font-weight:500" id="recommend-text">Loading your career health…</div></div>'

    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px" id="metrics-grid">'
    +metricCard('m-profile','Profile Completeness')
    +metricCard('m-ats','Resume Score')
    +metricCard('m-applications','Applications')
    +metricCard('m-interviews','In Interview Stage')
    +'</div>'

    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px">'
    +quickAction('resume-builder.html','📄','Build Resume')
    +quickAction('jobs.html','🔍','Analyze Job')
    +quickAction('applications.html','📋','Track Application')
    +quickAction('interview.html','🎤','Prepare Interview')
    +quickAction('career-coach.html','💬','Ask Career Coach')
    +quickAction('skill-gaps.html','📈','View Skill Gaps')
    +quickAction('career-roadmap.html','🗺','Career Roadmap')
    +quickAction('settings.html','⚙️','Settings')
    +'</div>'

    +'<div class="card" style="margin-bottom:16px"><div class="card-title">Target Role</div><div id="target-role-summary"></div></div>'
    +'<div class="card" style="margin-bottom:16px"><div class="card-title">Recent Applications</div><div id="recent-applications"></div></div>'
    +'<div class="card hidden" id="notif-panel"><div class="card-title">Notifications</div><div id="notif-list"></div></div>'
  , _user.email);

  await loadDashboard();
  await loadNotifications();
});

function metricCard(id,label){
  return '<div class="score-card"><div class="score-card-num" id="'+id+'">—</div><div class="score-card-label">'+label+'</div></div>';
}
function quickAction(href,icon,label){
  return '<a href="'+href+'" class="card" style="text-align:center;padding:16px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--text)"><div style="font-size:20px;margin-bottom:6px">'+icon+'</div>'+label+'</a>';
}

async function loadDashboard(){
  var results = await Promise.all([
    sb.from('career_profiles').select('*').eq('user_id',_user.id).maybeSingle(),
    sb.from('resumes').select('*').eq('user_id',_user.id),
    sb.from('applications').select('*').eq('user_id',_user.id)
  ]);
  var profile=results[0].data,resumes=results[1].data||[],apps=results[2].data||[];

  document.getElementById('greeting').textContent=profile&&profile.full_name?'Good to see you, '+profile.full_name.split(' ')[0]:'Dashboard';

  var completeness=calculateProfileCompleteness(profile,resumes);
  document.getElementById('m-profile').textContent=completeness+'%';

  var bestATS=0;
  resumes.forEach(function(r){var sc=calculateATSForResume(r.content);if(sc>bestATS)bestATS=sc;});
  document.getElementById('m-ats').textContent=resumes.length?bestATS:'—';

  document.getElementById('m-applications').textContent=apps.length;
  var interviewCount=apps.filter(function(a){return ['interview','final_round'].indexOf(a.status)!==-1;}).length;
  document.getElementById('m-interviews').textContent=interviewCount;

  document.getElementById('recommend-text').textContent=generateRecommendation(profile,resumes,apps,bestATS,completeness);

  document.getElementById('target-role-summary').innerHTML=profile&&profile.target_role
    ?'<div style="display:flex;justify-content:space-between;font-size:13px"><span>Target role</span><span style="font-weight:600">'+esc(profile.target_role)+(profile.target_industry?' · '+esc(profile.target_industry):'')+'</span></div>'
    :'<p style="color:var(--text-secondary);font-size:13px">No target role set yet. <a href="career-profile.html">Set one →</a></p>';

  document.getElementById('recent-applications').innerHTML=apps.length
    ?apps.slice(0,5).map(function(a){return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:13px"><span>'+esc(a.company)+' — '+esc(a.role_title)+'</span><span class="badge badge-neutral">'+a.status.replace('_',' ')+'</span></div>';}).join('')
    :'<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">No applications tracked yet</div><div class="empty-state-desc">Track your applications and never lose sight of an opportunity.</div><a href="jobs.html" class="btn btn-primary">Analyze a Job</a></div>';
}

function calculateProfileCompleteness(p,resumes){
  if(!p)return 0;
  var personal=['full_name','phone','city','linkedin_url','professional_summary'].filter(function(f){return p[f];}).length;
  var obj=['target_role','target_industry','career_level'].filter(function(f){return p[f];}).length;
  var score=Math.round(personal/5*40)+Math.round(obj/3*30)+(resumes.length>0?30:0);
  return Math.min(score,100);
}
function calculateATSForResume(content){
  if(!content||!content.sections)return 0;
  var we=(content.sections||[]).find(function(s){return s.type==='work_experience';});
  var allBullets=[];(we&&we.items||[]).forEach(function(w){allBullets=allBullets.concat(w.bullets||[]);});
  var quant=allBullets.filter(function(b){return /\d/.test(b);}).length;
  var quantScore=allBullets.length?Math.round(quant/allBullets.length*40):0;
  var hasSections=['work_experience','education','skills'].filter(function(t){var s=(content.sections||[]).find(function(x){return x.type===t;});return s&&s.visible;}).length;
  return Math.min(100,quantScore+Math.round(hasSections/3*40)+(content.summary?20:0));
}
function generateRecommendation(profile,resumes,apps,bestATS,completeness){
  if(!profile||completeness<40)return 'Your career profile is incomplete — filling it in improves every other feature\'s accuracy. Complete it now.';
  if(!resumes.length)return 'You have a career profile but no resume yet. Build your first resume to unlock ATS analysis and job matching.';
  if(bestATS<60)return 'Your best resume\'s ATS score is '+bestATS+'/100 — add quantifiable achievements to your bullet points to improve it.';
  if(!apps.length)return 'Your resume looks solid. Analyze a job description to see your match score and start tracking applications.';
  var interviewing=apps.filter(function(a){return ['interview','final_round'].indexOf(a.status)!==-1;});
  if(interviewing.length)return 'You have '+interviewing.length+' application(s) in the interview stage — prepare now with AI Interview Prep.';
  return 'You\'re actively applying. Ask the Career Coach why you might not be hearing back, using your real application data.';
}

async function loadNotifications(){
  var r=await sb.from('notifications').select('*').eq('user_id',_user.id).order('created_at',{ascending:false}).limit(20);
  var notifs=r.data||[];
  var unread=notifs.filter(function(n){return !n.read;}).length;
  document.getElementById('notif-dot').style.display=unread===0?'none':'block';
  document.getElementById('notif-list').innerHTML=notifs.length
    ?notifs.map(function(n){return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:13px;'+(n.read?'':'font-weight:600')+'"><span>'+esc(n.title)+'</span><span style="color:var(--text-secondary);font-size:11px">'+new Date(n.created_at).toLocaleDateString()+'</span></div>';}).join('')
    :'<p style="color:var(--text-secondary);font-size:13px">No notifications yet.</p>';
}
function toggleNotifications(e){
  e.preventDefault();
  var panel=document.getElementById('notif-panel');
  panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden')){
    sb.from('notifications').update({read:true}).eq('user_id',_user.id).eq('read',false).then(function(){document.getElementById('notif-dot').style.display='none';});
  }
}
</script>
</body>
</html>
