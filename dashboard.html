<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace — Belongix</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="belongix-auth.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#101322;--muted:#697083;--bg:#f7f8fc;--card:#fff;--line:#e5e8f0;--brand:#5b4bdb;--green:#159b6c;--red:#d83a52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui}.nav{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;gap:30px}.logo{font-size:21px;font-weight:800}.links{display:flex;gap:5px;flex:1}.links a{padding:9px 12px;border-radius:9px;color:#626a7c;font-weight:600;text-decoration:none}.links a.active,.links a:hover{background:#f0efff;color:var(--brand)}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font:600 13px Inter;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:linear-gradient(135deg,var(--brand),#7667f0);color:#fff;border:0}.wrap{max-width:1160px;margin:0 auto;padding:42px 24px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--brand);text-transform:uppercase}.hero h1{font-size:42px;letter-spacing:-1.7px;margin:7px 0}.hero p{color:var(--muted);margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.stat,.resume{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.section h2{font-size:17px;margin:0}.resumes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.resume{min-height:165px}.score{font-size:12px;font-weight:800;color:var(--green)}.resume h3{font-size:15px;margin:8px 0 4px}.resume p{color:var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);grid-column:1/-1;padding:50px;background:#fff;border:1px dashed var(--line);border-radius:15px}@media(max-width:800px){.links{display:none}.cards,.resumes{grid-template-columns:1fr}.hero{display:block}}
</style></head><body><nav class="nav"><a class="logo" href="index.html">Belongix</a><div class="links"><a class="active" href="dashboard.html">Workspace</a><a href="resume-builder.html">Resume Builder</a><a href="career-profile.html">Profile</a><a href="settings.html">Settings</a></div><a class="btn primary" href="resume-builder.html">+ New Resume</a></nav><main class="wrap"><div class="hero"><div><div class="eyebrow">Workspace</div><h1 id="greeting">Good morning</h1><p>Your resume workspace — build, analyze and improve.</p></div></div><div class="cards"><div class="stat"><b id="count">0</b><span>Saved resumes</span></div><div class="stat"><b>ATS</b><span>Live readiness analysis</span></div><div class="stat"><b>AI</b><span>Evidence-first assistance</span></div></div><div class="section"><h2>Your resumes</h2><a class="btn primary" href="resume-builder.html">Create resume</a></div><div class="resumes" id="resumes"><div class="empty">Loading your resumes…</div></div></main><script>(async()=>{const s=await getBelongixSession();if(!s){location.href='index.html';return}const name=s.user.user_metadata?.full_name||s.user.email?.split('@')[0]||'there';document.getElementById('greeting').textContent='Good to see you, '+name;let q=await belongix.from('resumes').select('id,title,target_job,updated_at').eq('user_id',s.user.id).eq('is_deleted',false).order('updated_at',{ascending:false});if(q.error&&/is_deleted/.test(q.error.message||''))q=await belongix.from('resumes').select('id,title,target_job,updated_at').eq('user_id',s.user.id).order('updated_at',{ascending:false});const rows=q.data||[];document.getElementById('count').textContent=rows.length;document.getElementById('resumes').innerHTML=rows.length?rows.map(r=>'<article class="resume"><div class="score">Resume</div><h3>'+esc(r.title||'Untitled Resume')+'</h3><p>'+esc(r.target_job||'General resume')+'</p><p>Updated '+new Date(r.updated_at).toLocaleDateString()+'</p><a class="btn" href="resume-builder.html?resume='+encodeURIComponent(r.id)+'">Edit resume</a></article>').join(''):'<div class="empty">No resumes yet. Create your first resume and start with the live preview.</div>';function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();</script></body></html>
