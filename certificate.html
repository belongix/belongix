<style>
:root{--brand:#2D1B69;--brand2:#4C2FAA;--accent:#FF5C35;--amber:#F59E0B;--green:#10B981;--ink:#0D0D1A;--muted:#5A5A7A;--border:#E4E4F0;--bg:#F7F7FC;--ff:'Sora',sans-serif;--fb:'DM Sans',sans-serif;--fp:'Playfair Display',serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--ink);background:var(--bg);min-height:100vh}

/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 24px;gap:16px;}
.nav-logo{font-family:var(--ff);font-size:18px;font-weight:800;color:var(--ink);text-decoration:none}
.nav-logo span{color:var(--accent)}
.nav-r{margin-left:auto;display:flex;gap:8px}
.btn-dash{padding:8px 18px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:13px;font-weight:700;text-decoration:none;font-family:var(--ff)}
.btn-back{padding:8px 16px;border-radius:9px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;transition:.12s}
.btn-back:hover{border-color:var(--brand);color:var(--brand)}

/* PAGE */
.page{max-width:900px;margin:0 auto;padding:40px 24px 80px}
.page-title{font-family:var(--ff);font-size:22px;font-weight:900;color:var(--ink);margin-bottom:4px}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:32px}

/* CERT WRAPPER */
.cert-wrap{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,.08);margin-bottom:28px}

/* CERT TOP BAR */
.cert-topbar{background:linear-gradient(135deg,var(--brand),var(--brand2));padding:18px 32px;display:flex;align-items:center;gap:12px}
.cert-topbar-logo{font-family:var(--ff);font-size:20px;font-weight:900;color:#fff}
.cert-topbar-logo span{color:var(--accent)}
.cert-topbar-tagline{font-size:12px;color:rgba(255,255,255,.55);margin-left:auto}

/* CERT BODY */
.cert-body{padding:40px 48px;position:relative;overflow:hidden}
.cert-body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(245,158,11,.06),transparent);pointer-events:none}
.cert-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:20px;text-align:center}
.cert-presents{font-size:14px;color:var(--muted);text-align:center;margin-bottom:8px}
.cert-name{font-family:var(--fp);font-size:clamp(28px,4vw,48px);font-weight:900;color:var(--brand);text-align:center;margin-bottom:14px;line-height:1.1}
.cert-completed{font-size:15px;color:var(--muted);text-align:center;margin-bottom:10px}
.cert-course{font-family:var(--ff);font-size:clamp(18px,2.5vw,26px);font-weight:900;color:var(--ink);text-align:center;margin-bottom:24px;line-height:1.3;max-width:600px;margin-left:auto;margin-right:auto}
.cert-divider{width:80px;height:3px;background:linear-gradient(90deg,var(--amber),var(--accent));border-radius:100px;margin:0 auto 24px}

.cert-meta{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin-bottom:32px}
.cert-meta-item{text-align:center}
.cert-meta-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.cert-meta-val{font-family:var(--ff);font-size:14px;font-weight:700;color:var(--ink)}

.cert-badge-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:32px}
.cert-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:100px;font-size:12.5px;font-weight:700}
.badge-verified{background:#DCFCE7;color:#166534;border:1px solid #BBF7D0}
.badge-domain{background:#EDE9FF;color:var(--brand);border:1px solid #DDD6FE}
.badge-level{background:#FEF9C3;color:#92400E;border:1px solid #FDE68A}

.cert-footer{border-top:1px solid var(--border);padding:20px 48px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;background:var(--bg)}
.cert-footer-left{font-size:12px;color:var(--muted);line-height:1.5}
.cert-footer-left strong{color:var(--ink);display:block;margin-bottom:2px}
.cert-id{font-family:'Courier New',monospace;font-size:11px;color:var(--muted);margin-top:4px}
.cert-seal{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--amber),#D97706);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(245,158,11,.35)}
.cert-seal-icon{font-size:22px}
.cert-seal-text{font-family:var(--ff);font-size:8px;font-weight:800;color:#fff;margin-top:1px;letter-spacing:.3px}

/* ACTIONS */
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px}
.btn-download{flex:1;min-width:180px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--amber),#D97706);color:#fff;border:none;font-family:var(--ff);font-size:15px;font-weight:800;cursor:pointer;transition:.2s;text-align:center;box-shadow:0 4px 14px rgba(245,158,11,.35);}
.btn-download:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(245,158,11,.45)}
.btn-share-li{flex:1;min-width:160px;padding:14px;border-radius:12px;background:#0A66C2;color:#fff;border:none;font-family:var(--ff);font-size:15px;font-weight:700;cursor:pointer;transition:.2s;text-align:center;}
.btn-share-li:hover{background:#0958a8;transform:translateY(-1px)}
.btn-share-tw{flex:1;min-width:160px;padding:14px;border-radius:12px;background:#000;color:#fff;border:none;font-family:var(--ff);font-size:15px;font-weight:700;cursor:pointer;transition:.2s;text-align:center;}
.btn-share-tw:hover{background:#1a1a1a;transform:translateY(-1px)}

/* WHAT YOU LEARNED */
.skills-section{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px}
.skills-section h3{font-family:var(--ff);font-size:16px;font-weight:800;color:var(--ink);margin-bottom:14px}
.skill-tags{display:flex;flex-wrap:wrap;gap:8px}
.skill-tag{background:#EDE9FF;color:var(--brand);font-size:13px;font-weight:600;padding:5px 12px;border-radius:8px}

/* NEXT COURSES */
.next-section{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px}
.next-section h3{font-family:var(--ff);font-size:16px;font-weight:800;color:var(--ink);margin-bottom:16px}
.next-list{display:flex;flex-direction:column;gap:10px}
.next-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--border);text-decoration:none;transition:.12s}
.next-item:hover{border-color:var(--brand);background:#F0EEFF}
.next-emoji{font-size:28px}
.next-info{flex:1}
.next-title{font-family:var(--ff);font-size:13.5px;font-weight:700;color:var(--ink)}
.next-meta{font-size:12px;color:var(--muted);margin-top:2px}
.next-arrow{color:var(--muted);font-size:16px}

/* NOT FOUND */
.not-found{text-align:center;padding:80px 24px}
.not-found-emoji{font-size:64px;margin-bottom:16px}
.not-found h2{font-family:var(--ff);font-size:22px;font-weight:800;color:var(--ink);margin-bottom:8px}
.not-found p{font-size:15px;color:var(--muted);margin-bottom:24px}
.btn-explore{display:inline-block;padding:13px 28px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-family:var(--ff);font-size:14.5px;font-weight:700;text-decoration:none}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0D0D1A;color:#fff;padding:11px 22px;border-radius:100px;font-size:13.5px;font-weight:500;z-index:9999;transition:.3s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .cert-body{padding:28px 24px}
  .cert-footer{padding:16px 24px}
  .cert-meta{gap:20px}
  .actions{flex-direction:column}
}
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var SB_URL='https://efhcfuaxgbzuqlmhlsxc.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';
var sb=supabase.createClient(SB_URL,SB_KEY);

var _user=null,_course=null,_certName='';

// Related courses per domain
var RELATED={
  'Full Stack':     [{e:'⚡',t:'JavaScript Essentials',m:'Beginner · 12h',s:'javascript-essentials'},{e:'🔋',t:'React Fundamentals',m:'Beginner · 14h',s:'react-fundamentals'},{e:'🖥',t:'Node.js Complete',m:'Intermediate · 18h',s:'nodejs-complete'}],
  'Python':         [{e:'🐍',t:'Python Intermediate',m:'Intermediate · 14h',s:'python-intermediate'},{e:'🤖',t:'Python for Data Science',m:'Beginner · 12h',s:'python-for-data-science'},{e:'⚡',t:'FastAPI Complete',m:'Intermediate · 10h',s:'fastapi-complete'}],
  'AI / ML':        [{e:'🧠',t:'Deep Learning with PyTorch',m:'Intermediate · 20h',s:'deep-learning-pytorch'},{e:'🤗',t:'Transformers & HuggingFace',m:'Advanced · 16h',s:'transformers-huggingface'},{e:'🔗',t:'LangChain Complete',m:'Intermediate · 12h',s:'langchain-complete'}],
  'Data Science':   [{e:'📊',t:'Pandas & NumPy',m:'Intermediate · 14h',s:'data-wrangling-pandas'},{e:'📈',t:'Data Visualization',m:'Beginner · 10h',s:'data-visualization-complete'},{e:'🤖',t:'Machine Learning Fundamentals',m:'Beginner · 16h',s:'machine-learning-fundamentals'}],
  'Cloud & DevOps': [{e:'☁️',t:'Docker Complete',m:'Beginner · 12h',s:'docker-complete'},{e:'⚙️',t:'Kubernetes Complete',m:'Intermediate · 18h',s:'kubernetes-complete'},{e:'🏗',t:'Terraform Complete',m:'Intermediate · 14h',s:'terraform-complete'}],
  'DSA':            [{e:'🧩',t:'DSA Patterns',m:'Intermediate · 20h',s:'dsa-patterns'},{e:'🌳',t:'Trees & Binary Trees',m:'Intermediate · 16h',s:'trees-binary-complete'},{e:'📐',t:'Dynamic Programming',m:'Advanced · 22h',s:'dynamic-programming-complete'}],
  'Cybersecurity':  [{e:'🔐',t:'Web Application Security',m:'Intermediate · 14h',s:'web-application-security'},{e:'🛡',t:'Network Security',m:'Beginner · 12h',s:'network-security-complete'},{e:'🔑',t:'Cryptography Complete',m:'Intermediate · 16h',s:'cryptography-complete'}],
  'Backend':        [{e:'🐘',t:'PostgreSQL Complete',m:'Intermediate · 16h',s:'postgresql-complete'},{e:'⚡',t:'Redis Complete',m:'Intermediate · 12h',s:'redis-backend'},{e:'🐳',t:'Docker for Developers',m:'Beginner · 10h',s:'docker-for-devs'}],
  'Java':           [{e:'☕',t:'Spring Boot Complete',m:'Intermediate · 20h',s:'spring-boot-complete'},{e:'🔄',t:'Java Multithreading',m:'Advanced · 14h',s:'java-multithreading'},{e:'🧩',t:'Java DSA Interview',m:'Intermediate · 18h',s:'java-core-complete'}],
  'default':        [{e:'🚀',t:'Career Skills',m:'Beginner · 8h',s:'resume-building-tech-india'},{e:'🎯',t:'System Design Beginner',m:'Beginner · 12h',s:'system-design-beginner'},{e:'📊',t:'Dashboard',m:'Track your progress',s:'dashboard.html'}]
};

var _certNumber=null,_certIssuedAt=null,_certRecipient=null;

window.addEventListener('load',async function(){
  try{var s=await sb.auth.getSession();if(s.data&&s.data.session)_user=s.data.session.user;}catch(e){}
  var slug=new URLSearchParams(location.search).get('course');
  if(!slug){showNotFound();return;}
  loadCert(slug);
});

async function loadCert(slug){
  if(!_user){showSignInRequired(slug);return;}

  // KNOWN LIMITATION (same one documented in the certificates migration
  // and the issue-certificate Edge Function): course completion has no
  // server-side source of truth yet — course.html tracks lesson
  // completion in localStorage only, and the frozen course files were
  // not modified to add server-side tracking. This check is honest
  // about that: it's still reading local completion state as the
  // "did they finish it" signal, but everything AFTER that point
  // (the certificate record, its number, its verification) is now
  // real and server-issued, not fabricated in the browser.
  var enrolled=localStorage.getItem('bx_enrolled_'+slug);
  if(!enrolled){showNotEnrolled(slug);return;}

  // Try sessionStorage for course display metadata (title, domain, etc.)
  // — this is just presentation data from the frozen course pages,
  // not anything security-relevant.
  try{var c=sessionStorage.getItem('bx_course_'+slug);if(c){var p=JSON.parse(c);if(p&&p.title)_course=p;}}catch(e){}
  if(!_course)_course={slug:slug,title:formatSlug(slug),domain:'Full Stack',category:'',level:'',hours:0,modules:0,skills:'',cert:'Belongix Certificate',emoji:'📚',bg:'linear-gradient(135deg,#2D1B69,#4C2FAA)',rating:4.8,students:0};

  try{
    var session=await sb.auth.getSession();
    var token=session.data.session.access_token;
    var r=await fetch(SB_URL+'/functions/v1/issue-certificate',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({course_slug:slug,course_title:_course.title})
    });
    var d=await r.json();
    if(r.status===403&&d.eligible===false){
      // Real server-side check, not a bug: course_progress has no
      // completed record for this course yet.
      el('cert-container').innerHTML='<div class="not-found"><div class="not-found-emoji">📋</div><h2>Not quite eligible yet</h2><p>Our records don\'t show this course as completed yet. If you believe this is a mistake, please contact support.</p><a href="course.html?slug='+encodeURIComponent(slug)+'" class="btn-explore">Back to Course →</a></div>';
      return;
    }
    if(!r.ok)throw new Error(d.error||'Could not issue certificate');
    _certNumber=d.certificate_number;_certIssuedAt=d.issued_at;_certRecipient=d.recipient_name;
    renderCert();
  }catch(e){
    console.error('Certificate issuance failed:',e);
    el('cert-container').innerHTML='<div class="not-found"><div class="not-found-emoji">⚠️</div><h2>Could not load your certificate</h2><p>Something went wrong verifying your certificate. Please try again in a moment.</p><a href="course.html?slug='+encodeURIComponent(slug)+'" class="btn-explore">Back to Course →</a></div>';
  }
}

function showSignInRequired(slug){
  el('cert-container').innerHTML=
    '<div class="not-found">'+
    '<div class="not-found-emoji">🔒</div>'+
    '<h2>Sign in to view your certificate</h2>'+
    '<p>Certificates are tied to your Belongix account. Please sign in to continue.</p>'+
    '<a href="index.html" class="btn-explore">Sign In →</a>'+
    '</div>';
}

function formatSlug(s){
  return s.split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');
}

function renderCert(){
  var c=_course;
  var userName=_certRecipient||(_user&&_user.user_metadata&&_user.user_metadata.full_name)||'Belongix Learner';
  var certName=c.cert||('Certified '+c.title+' Developer');
  _certName=certName;
  var date=_certIssuedAt?new Date(_certIssuedAt).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
  var certId=_certNumber||'—'; // real, server-issued certificate number — never fabricated client-side
  var skills=c.skills?c.skills.split(',').map(function(s){return s.trim();}).filter(Boolean):['Technical Skills','Best Practices','Project Building'];
  var related=RELATED[c.domain]||RELATED['default'];

  // Update page title and meta
  document.title=certName+' — Belongix Certificate';
  el('doc-title').textContent=certName+' — Belongix';
  el('og-title').setAttribute('content',userName+' earned: '+certName);
  el('og-desc').setAttribute('content','Verified course completion from Belongix — India\'s career learning platform.');

  el('cert-container').innerHTML=
    '<div class="page-title">Your Certificate</div>'+
    '<div class="page-sub">Congratulations on completing '+escH(c.title)+'! Download or share your certificate.</div>'+

    // CERT
    '<div class="cert-wrap">'+
      '<div class="cert-topbar">'+
        '<div class="cert-topbar-logo">Belong<span>ix</span></div>'+
        '<div class="cert-topbar-tagline">India\'s Career Learning Platform</div>'+
      '</div>'+
      '<div class="cert-body">'+
        '<div class="cert-label">Certificate of Completion</div>'+
        '<div class="cert-presents">This is to certify that</div>'+
        '<div class="cert-name">'+escH(userName)+'</div>'+
        '<div class="cert-completed">has successfully completed the course</div>'+
        '<div class="cert-course">'+escH(c.title)+'</div>'+
        '<div class="cert-divider"></div>'+
        '<div class="cert-meta">'+
          (c.domain?'<div class="cert-meta-item"><div class="cert-meta-label">Domain</div><div class="cert-meta-val">'+escH(c.domain)+'</div></div>':'')+
          (c.level?'<div class="cert-meta-item"><div class="cert-meta-label">Level</div><div class="cert-meta-val">'+escH(c.level)+'</div></div>':'')+
          (c.hours?'<div class="cert-meta-item"><div class="cert-meta-label">Duration</div><div class="cert-meta-val">'+c.hours+' hours</div></div>':'')+
          '<div class="cert-meta-item"><div class="cert-meta-label">Issued</div><div class="cert-meta-val">'+date+'</div></div>'+
        '</div>'+
        '<div class="cert-badge-row">'+
          '<span class="cert-badge badge-verified">✓ Verified by Belongix</span>'+
          (c.domain?'<span class="cert-badge badge-domain">'+escH(c.domain)+'</span>':'')+
          (c.level?'<span class="cert-badge badge-level">'+escH(c.level)+'</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="cert-footer">'+
        '<div class="cert-footer-left">'+
          '<strong>'+escH(certName)+'</strong>'+
          'Issued by Belongix · belongix.in'+
          '<div class="cert-id">ID: '+certId+' · <a href="verify.html?id='+encodeURIComponent(certId)+'" style="color:inherit;text-decoration:underline">Verify →</a></div>'+
        '</div>'+
        '<div class="cert-seal"><div class="cert-seal-icon">🏆</div><div class="cert-seal-text">VERIFIED</div></div>'+
      '</div>'+
    '</div>'+

    // ACTIONS
    '<div class="actions">'+
      '<button class="btn-download" onclick="downloadCert()">⬇ Download Certificate</button>'+
      '<button class="btn-share-li" onclick="shareLinkedIn()">🔗 Share on LinkedIn</button>'+
      '<button class="btn-share-tw" onclick="shareTwitter()">𝕏 Share on X</button>'+
    '</div>'+

    // SKILLS
    (skills.length?
    '<div class="skills-section">'+
      '<h3>Skills you demonstrated</h3>'+
      '<div class="skill-tags">'+skills.map(function(s){return '<span class="skill-tag">'+escH(s)+'</span>';}).join('')+'</div>'+
    '</div>':'')+

    // NEXT COURSES
    '<div class="next-section">'+
      '<h3>What to learn next</h3>'+
      '<div class="next-list">'+related.map(function(r){
        var href=r.s.includes('.html')?r.s:'course.html?slug='+r.s;
        return '<a href="'+href+'" class="next-item">'+
          '<div class="next-emoji">'+r.e+'</div>'+
          '<div class="next-info"><div class="next-title">'+escH(r.t)+'</div><div class="next-meta">'+escH(r.m)+'</div></div>'+
          '<div class="next-arrow">→</div>'+
        '</a>';
      }).join('')+
      '</div>'+
    '</div>';
}

function slug2id(slug){
  var h=0;
  for(var i=0;i<slug.length;i++){h=((h<<5)-h+slug.charCodeAt(i))|0;}
  return Math.abs(h).toString(36).toUpperCase().padStart(8,'0');
}

function showNotFound(){
  el('cert-container').innerHTML=
    '<div class="not-found">'+
    '<div class="not-found-emoji">🎓</div>'+
    '<h2>No certificate found</h2>'+
    '<p>The certificate you\'re looking for doesn\'t exist or hasn\'t been earned yet. Complete a course to earn your verified Belongix certificate.</p>'+
    '<a href="courses.html" class="btn-explore">Browse Courses →</a>'+
    '</div>';
}

function showNotEnrolled(slug){
  el('cert-container').innerHTML=
    '<div class="not-found">'+
    '<div class="not-found-emoji">🔒</div>'+
    '<h2>Certificate not yet earned</h2>'+

}

function el(id){return document.getElementById(id);}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var _tt;
function showToast(msg){var t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},3500);}
</script>
