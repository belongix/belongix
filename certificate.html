<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Verify Certificate | Belongix</title>
<link rel="icon" href="icons/icon-32.png"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8f6ff;min-height:100vh;padding:40px 20px;color:#1a1a2e}
.top-bar{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:0 auto 32px}
.logo{font-size:24px;font-weight:900;text-decoration:none;color:#1a1a2e}
.logo span{color:#FF6B35}
.back-btn{font-size:13px;color:#6C3CE1;text-decoration:none;font-weight:600;padding:8px 16px;border-radius:8px;border:1.5px solid #6C3CE1;transition:.15s}
.back-btn:hover{background:#6C3CE1;color:#fff}
.center{max-width:820px;margin:0 auto}

/* Certificate display */
.cert-wrap{background:#fff;border-radius:24px;box-shadow:0 20px 80px rgba(108,60,225,0.18);max-width:820px;width:100%;overflow:hidden;margin-bottom:24px}
.cert-top-bar{background:linear-gradient(135deg,#6C3CE1,#4F46E5);height:12px}
.cert-body{padding:60px 70px;text-align:center;border:3px solid #e8e0ff;margin:16px;border-radius:16px;position:relative}
.cert-logo-txt{font-size:28px;font-weight:900;color:#1a1a2e;margin-bottom:6px}
.cert-logo-txt span{color:#FF6B35}
.cert-tagline{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#6C3CE1;margin-bottom:40px}
.cert-presents{font-size:14px;color:#888;font-style:italic;margin-bottom:6px}
.cert-name{font-family:Georgia,serif;font-size:38px;color:#1a1a2e;font-weight:bold;margin-bottom:4px;line-height:1.2}
.cert-of{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.cert-course{font-size:22px;color:#6C3CE1;font-weight:bold;margin-bottom:8px;line-height:1.3}
.cert-score{display:inline-block;background:#f3f0ff;color:#6C3CE1;padding:6px 20px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:32px}
.cert-divider{display:flex;align-items:center;gap:16px;margin:0 auto 28px;max-width:400px}
.cert-divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#d4c5ff,transparent)}
.cert-desc{font-family:Georgia,serif;font-size:15px;color:#555;line-height:1.7;font-style:italic;max-width:500px;margin:0 auto 36px}
.cert-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;padding-top:24px;border-top:1px solid #f0eaff;gap:20px}
.cert-sig{text-align:center;flex:1}
.cert-sig-name{font-size:15px;font-weight:bold;color:#1a1a2e}
.cert-sig-role{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.cert-sig-line{width:140px;height:1px;background:#ddd;margin:10px auto 8px}
.cert-id-block{text-align:center;flex:1}
.cert-id{font-size:13px;font-weight:700;color:#6C3CE1;font-family:monospace;letter-spacing:1px}
.cert-id-label,.cert-date-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.cert-date-block{text-align:center;flex:1}
.cert-date{font-size:13px;font-weight:600;color:#1a1a2e}
.cert-seal{position:absolute;top:40px;right:50px;width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#6C3CE1,#4F46E5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 20px rgba(108,60,225,0.4)}
.cert-seal-icon{font-size:24px;margin-bottom:2px}
.cert-seal-text{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-align:center;line-height:1.4}

/* Verification badge */
.verify-badge{display:flex;align-items:center;gap:12px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px;padding:16px 20px;margin-bottom:20px}
.verify-icon{font-size:28px;flex-shrink:0}
.verify-title{font-size:15px;font-weight:700;color:#15803d}
.verify-sub{font-size:13px;color:#166534;margin-top:2px}
.fail-badge{background:#fef2f2;border-color:#fca5a5}
.fail-title{color:#dc2626}
.fail-sub{color:#991b1b}

/* Actions */
.actions{display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:.15s;font-family:inherit}
.btn-primary{background:#6C3CE1;color:#fff}
.btn-primary:hover{background:#5a2ed4}
.btn-linkedin{background:#0077B5;color:#fff}
.btn-outline{background:#f3f0ff;color:#6C3CE1;border:1.5px solid #6C3CE1}

/* Search form */
.search-box{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);margin-bottom:24px}
.search-title{font-size:20px;font-weight:700;margin-bottom:8px}
.search-sub{font-size:14px;color:#888;margin-bottom:20px}
.search-row{display:flex;gap:12px}
.search-input{flex:1;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:.15s}
.search-input:focus{border-color:#6C3CE1;box-shadow:0 0 0 3px rgba(108,60,225,0.1)}
.search-btn{padding:12px 24px;background:#6C3CE1;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.search-btn:hover{background:#5a2ed4}

@media print{
  .top-bar,.actions,.search-box,.verify-badge{display:none}
  body{background:#fff;padding:0}
  .cert-wrap{box-shadow:none;max-width:100%;margin:0}
}
@media(max-width:600px){
  .cert-body{padding:40px 24px}
  .cert-name{font-size:26px}
  .cert-course{font-size:16px}
  .cert-footer{flex-direction:column;gap:16px}
  .cert-seal{top:20px;right:20px;width:64px;height:64px}
  .cert-seal-icon{font-size:18px}
  .search-row{flex-direction:column}
}
</style>
</head>
<body>
<div class="top-bar">
  <a href="courses.html" class="logo">Belong<span>ix</span></a>
  <a href="courses.html" class="back-btn">← All Courses</a>
</div>
<div class="center" id="main">
  <div class="search-box">
    <div class="search-title">🔍 Verify a Certificate</div>
    <div class="search-sub">Enter a Belongix Certificate ID (e.g. BX-2026-ABC123) to verify its authenticity</div>
    <div class="search-row">
      <input type="text" class="search-input" id="cert-input" placeholder="BX-2026-XXXXXX" oninput="this.value=this.value.toUpperCase()">
      <button class="search-btn" onclick="verifyCert()">Verify →</button>
    </div>
  </div>
  <div id="result"></div>
</div>

<script>
var SB_URL = 'https://efhcfuaxgbzuqlmhlsxc.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';

/* On load — check URL params */
window.addEventListener('load', function() {
  var params = new URLSearchParams(window.location.search);
  var certId = params.get('id');
  if (certId) {
    document.getElementById('cert-input').value = certId.toUpperCase();
    verifyCert(certId);
  }
});

async function verifyCert(id) {
  var certId = (id || document.getElementById('cert-input').value || '').trim().toUpperCase();
  if (!certId) { alert('Please enter a Certificate ID'); return; }

  var result = document.getElementById('result');
  result.innerHTML = '<div style="text-align:center;padding:40px;color:#888">Verifying...</div>';

  var cert = null;

  /* 1. Check Supabase */
  try {
    var r = await fetch(SB_URL + '/rest/v1/certificates?cert_id=eq.' + encodeURIComponent(certId) + '&select=*&limit=1', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Accept': 'application/json' }
    });
    if (r.ok) {
      var rows = await r.json();
      if (rows && rows.length) cert = rows[0];
    }
  } catch(e) {}

  /* 2. Check ALL localStorage keys for this cert ID */
  if (!cert) {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key && key.startsWith('bx_cert_')) {
        try {
          var stored = JSON.parse(localStorage.getItem(key) || 'null');
          if (stored && stored.cert_id === certId) { cert = stored; break; }
        } catch(ex) {}
      }
    }
  }

  if (cert) {
    renderCert(cert);
  } else {
    result.innerHTML = renderNotFound(certId);
  }
}

function renderCert(cert) {
  var issueDate = cert.issued_at
    ? new Date(cert.issued_at).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' })
    : new Date().toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
  var userName = cert.user_name || cert.user_email || 'Professional';
  var certTitle = cert.cert_title || cert.course_title || 'Course Completion';
  var certId = cert.cert_id || 'BX-2026-XXXXXX';
  var scoreText = cert.score ? ('Scored ' + cert.score + '%') : 'Passed';

  window._shareUrl = encodeURIComponent('https://www.belongix.in/certificate.html?id=' + certId);
  window._shareText = encodeURIComponent('I earned the ' + certTitle + ' certificate from Belongix! #Belongix #CareerGrowth #India');

  document.getElementById('result').innerHTML =
    '<div class="verify-badge">'
    + '<div class="verify-icon">✅</div>'
    + '<div><div class="verify-title">Certificate Verified — Authentic</div>'
    + '<div class="verify-sub">This is a genuine Belongix certificate issued to ' + esc(userName) + ' on ' + issueDate + '</div></div>'
    + '</div>'
    + '<div class="actions">'
    + '<button class="btn btn-primary" onclick="window.print()">🖨️ Download PDF</button>'
    + '<button class="btn btn-linkedin" onclick="shareLinkedIn()">💼 Share on LinkedIn</button>'
    + '</div>'
    + '<div class="cert-wrap">'
    + '<div class="cert-top-bar"></div>'
    + '<div class="cert-body">'
    + '<div class="cert-seal"><div class="cert-seal-icon">🏆</div><div class="cert-seal-text">BELONGIX<br>VERIFIED</div></div>'
    + '<div class="cert-logo-txt">Belong<span>ix</span></div>'
    + '<div class="cert-tagline">India&#39;s Career Platform</div>'
    + '<div class="cert-presents">This certifies that</div>'
    + '<div class="cert-name">' + esc(userName) + '</div>'
    + '<div class="cert-of">has successfully completed</div>'
    + '<div class="cert-course">' + esc(certTitle) + '</div>'
    + '<div class="cert-score">' + scoreText + '</div>'
    + '<div class="cert-divider"><div class="cert-divider-line"></div><span style="color:#6C3CE1;font-size:18px">✦</span><div class="cert-divider-line"></div></div>'
    + '<div class="cert-desc">Demonstrated comprehensive knowledge and practical skills through rigorous assessment on the Belongix learning platform, built specifically for Indian professionals.</div>'
    + '<div class="cert-footer">'
    + '<div class="cert-sig"><div class="cert-sig-line"></div><div class="cert-sig-name">Team Belongix</div><div class="cert-sig-role">Issuing Authority</div></div>'
    + '<div class="cert-id-block"><div class="cert-id">' + esc(certId) + '</div><div class="cert-id-label">Certificate ID</div></div>'
    + '<div class="cert-date-block"><div class="cert-date">' + issueDate + '</div><div class="cert-date-label">Date of Issue</div></div>'
    + '</div>'
    + '</div>'
    + '</div>';
}

function shareLinkedIn() {
  var url = window._shareUrl || '';
  var text = window._shareText || '';
  window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + url + '&summary=' + text, '_blank');
}

function renderNotFound(certId) {
  return '<div class="verify-badge fail-badge">'
    + '<div class="verify-icon">❌</div>'
    + '<div><div class="verify-title fail-title">Certificate Not Found</div>'
    + '<div class="fail-sub">No certificate found with ID: ' + esc(certId) + '. If you just earned this certificate, try downloading it directly from the course page.</div></div>'
    + '</div>';
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
