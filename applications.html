<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Applications — Belongix</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-shell.js"></script>
<style>
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.status-select{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:100px;border:none;cursor:pointer}
</style>
</head>
<body>
<script>
var SB_URL='https://efhcfuaxgbzuqlmhlsxc.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _user=null,_apps=[],_editingId=null;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function gv(id){var el=document.getElementById(id);return el?el.value:'';}
function setv(id,val){var el=document.getElementById(id);if(el)el.value=val||'';}

window.addEventListener('load',async function(){
  var s=await sb.auth.getSession();
  if(!s.data||!s.data.session){window.location.href='career-profile.html';return;}
  _user=s.data.session.user;

  renderAppShell('applications', ''
    +'<div class="stats-row" id="stats-row"></div>'
    +'<div class="topbar"><h1>Applications</h1><button class="btn btn-primary" onclick="openForm()">+ Add Application</button></div>'
    +'<table><thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Applied</th><th>Interview</th><th></th></tr></thead><tbody id="app-tbody"></tbody></table>'

    +'<div class="modal-bg hidden" id="modal-bg"><div class="modal"><h3 id="modal-title" style="margin-bottom:16px">Add Application</h3>'
    +'<div class="field-row"><div class="field"><label>Company *</label><input id="f-company"/></div><div class="field"><label>Role *</label><input id="f-role_title"/></div></div>'
    +'<div class="field"><label>Status</label><select id="f-status">'
    +['saved','applied','screening','interview','final_round','offer','rejected','withdrawn'].map(function(s){return '<option value="'+s+'">'+s.replace('_',' ')+'</option>';}).join('')
    +'</select></div>'
    +'<div class="field-row"><div class="field"><label>Date applied</label><input type="date" id="f-date_applied"/></div><div class="field"><label>Interview date</label><input type="date" id="f-interview_date"/></div></div>'
    +'<div class="field-row"><div class="field"><label>Salary</label><input id="f-salary"/></div><div class="field"><label>Recruiter</label><input id="f-recruiter_name"/></div></div>'
    +'<div class="field"><label>Notes</label><textarea id="f-notes" rows="3"></textarea></div>'
    +'<div style="display:flex;gap:10px;margin-top:14px"><button class="btn btn-primary" onclick="saveApplication()">Save</button><button class="btn btn-secondary" onclick="closeForm()">Cancel</button></div>'
    +'</div></div>'
  , _user.email);

  await loadApplications();
});

async function loadApplications(){
  var r=await sb.from('applications').select('*').eq('user_id',_user.id).order('updated_at',{ascending:false});
  _apps=r.data||[];
  renderStats();renderTable();
}

function renderStats(){
  var applied=_apps.filter(function(a){return a.status!=='saved';}).length;
  var interviews=_apps.filter(function(a){return ['interview','final_round'].indexOf(a.status)!==-1;}).length;
  var offers=_apps.filter(function(a){return a.status==='offer';}).length;
  document.getElementById('stats-row').innerHTML=
    metric(_apps.length,'Total tracked')+metric(applied,'Applied')+metric(interviews,'Interviews')+metric(offers,'Offers');
}
function metric(num,label){return '<div class="score-card"><div class="score-card-num">'+num+'</div><div class="score-card-label">'+label+'</div></div>';}

function statusBadgeClass(s){
  var map={saved:'badge-neutral',applied:'badge-accent',screening:'badge-warning',interview:'badge-accent',final_round:'badge-accent',offer:'badge-success',rejected:'badge-error',withdrawn:'badge-neutral'};
  return map[s]||'badge-neutral';
}

function renderTable(){
  var tbody=document.getElementById('app-tbody');
  if(!_apps.length){tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">No applications tracked yet</div><div class="empty-state-desc">Track your applications and never lose sight of an opportunity.</div><button class="btn btn-primary" onclick="openForm()">Add Application</button></div></td></tr>';return;}
  tbody.innerHTML=_apps.map(function(a){
    return '<tr><td>'+esc(a.company)+'</td><td>'+esc(a.role_title)+'</td>'
      +'<td><select onchange="updateStatus(\''+a.id+'\',this.value)" class="status-select badge '+statusBadgeClass(a.status)+'">'
      +['saved','applied','screening','interview','final_round','offer','rejected','withdrawn'].map(function(st){
        return '<option value="'+st+'" '+(a.status===st?'selected':'')+'>'+st.replace('_',' ')+'</option>';
      }).join('')+'</select></td>'
      +'<td>'+(a.date_applied||'—')+'</td><td>'+(a.interview_date||'—')+'</td>'
      +'<td><button class="btn btn-ghost btn-sm" onclick="editApplication(\''+a.id+'\')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteApplication(\''+a.id+'\')">Delete</button></td></tr>';
  }).join('');
}

async function updateStatus(id,status){
  try{
    var r=await sb.from('applications').update({status:status}).eq('id',id).eq('user_id',_user.id);
    if(r.error)throw r.error;
    await loadApplications();showToast('Status updated');
  }catch(e){console.error(e);showToast('⚠️ Could not update status');}
}

function openForm(){
  _editingId=null;
  document.getElementById('modal-title').textContent='Add Application';
  ['f-company','f-role_title','f-date_applied','f-interview_date','f-salary','f-recruiter_name','f-notes'].forEach(function(id){setv(id,'');});
  setv('f-status','saved');
  document.getElementById('modal-bg').classList.remove('hidden');
}
function editApplication(id){
  var a=_apps.find(function(x){return x.id===id;});if(!a)return;
  _editingId=id;
  document.getElementById('modal-title').textContent='Edit Application';
  setv('f-company',a.company);setv('f-role_title',a.role_title);setv('f-status',a.status);
  setv('f-date_applied',a.date_applied);setv('f-interview_date',a.interview_date);
  setv('f-salary',a.salary);setv('f-recruiter_name',a.recruiter_name);setv('f-notes',a.notes);
  document.getElementById('modal-bg').classList.remove('hidden');
}
function closeForm(){document.getElementById('modal-bg').classList.add('hidden');}

async function saveApplication(){
  var company=gv('f-company'),role=gv('f-role_title');
  if(!company||!role){showToast('Company and role are required');return;}
  var row={user_id:_user.id,company:company,role_title:role,status:gv('f-status'),
    date_applied:gv('f-date_applied')||null,interview_date:gv('f-interview_date')||null,
    salary:gv('f-salary'),recruiter_name:gv('f-recruiter_name'),notes:gv('f-notes')};
  try{
    var r=_editingId?await sb.from('applications').update(row).eq('id',_editingId).eq('user_id',_user.id)
                     :await sb.from('applications').insert(row);
    if(r.error)throw r.error;
    closeForm();await loadApplications();showToast('Saved ✓');
  }catch(e){console.error(e);showToast('⚠️ Could not save application');}
}
async function deleteApplication(id){
  if(!confirm('Delete this application?'))return;
  try{
    var r=await sb.from('applications').delete().eq('id',id).eq('user_id',_user.id);
    if(r.error)throw r.error;
    await loadApplications();showToast('Deleted');
  }catch(e){console.error(e);showToast('⚠️ Could not delete');}
}
</script>
</body>
</html>
