<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applications — Belongix</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="top"><a class="brand" href="dashboard.html">Belong<span>ix</span></a><nav class="topnav"><a href="dashboard.html">Dashboard</a><a href="resume-builder.html">Resume</a><a href="jobs.html">Jobs</a><a class="active" href="applications.html">Applications</a><a href="interview-prep.html">Interview</a></nav></header><main class="main"><div class="pagehead"><div><h1>Application Tracker</h1><p>Keep every application, version and next action in one place.</p></div><button class="btn primary" onclick="add()">+ Add application</button></div><div class="kpis"><div class="kpi"><div class="stat" id="all">0</div><div class="statlabel">Total</div></div><div class="kpi"><div class="stat" id="active">0</div><div class="statlabel">Active</div></div><div class="kpi"><div class="stat" id="int">0</div><div class="statlabel">Interviews</div></div><div class="kpi"><div class="stat" id="offer">0</div><div class="statlabel">Offers</div></div></div><div class="card" style="margin-top:16px"><div id="list"></div></div></main><div class="toast"></div><script>let a=BX.local('applications')||[];function render(){document.getElementById('all').textContent=a.length;document.getElementById('active').textContent=a.filter(x=>!['Rejected','Withdrawn','Offer'].includes(x.status)).length;document.getElementById('int').textContent=a.filter(x=>x.status==='Interview').length;document.getElementById('offer').textContent=a.filter(x=>x.status==='Offer').length;document.getElementById('list').innerHTML=a.length?a.map((x,i)=>'<div class="listitem"><div><b>'+BX.esc(x.role)+'</b> · '+BX.esc(x.company)+'<br><small class="muted">Applied '+BX.esc(x.date)+' · '+BX.esc(x.next||'No next action')+'</small></div><div style="display:flex;gap:7px;align-items:center"><select onchange="a['+i+'].status=this.value;save()"><option '+(x.status==='Saved'?'selected':'')+'>Saved</option><option '+(x.status==='Applied'?'selected':'')+'>Applied</option><option '+(x.status==='Screening'?'selected':'')+'>Screening</option><option '+(x.status==='Interview'?'selected':'')+'>Interview</option><option '+(x.status==='Offer'?'selected':'')+'>Offer</option><option '+(x.status==='Rejected'?'selected':'')+'>Rejected</option><option '+(x.status==='Withdrawn'?'selected':'')+'>Withdrawn</option></select><button class="btn danger" onclick="a.splice('+i+',1);save()">Delete</button></div></div>').join(''):'<div class="empty">No applications yet. Analyze a job first.</div>'}function save(){BX.local('applications',a);render()}function add(){let role=prompt('Role');if(!role)return;let company=prompt('Company')||'';a.push({id:Date.now(),role,company,status:'Applied',date:new Date().toISOString().slice(0,10),next:'Follow up in 7 days'});save();BX.toast('Application added')}render();</script></body></html>
