<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Roadmap — Belongix</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><a class="brand" href="dashboard.html">Belong<span>ix</span></a><nav class="topnav"><a href="dashboard.html">Dashboard</a><a href="career-profile.html">Profile</a><a href="skills.html">Skills</a><a class="active" href="roadmap.html">Roadmap</a></nav></header><main class="main"><div class="pagehead"><div><h1>Career Roadmap</h1><p>A practical progression based on your target role.</p></div></div><div id="road" class="grid grid3"></div></main><script src="config.js"></script><script src="app.js"></script><script>let p=BX.local('profile')||{},role=p.target_role||'Software Engineer';let stages=['Build strong fundamentals','Demonstrate impact','Target the next level'];let skills=p.skills||[];document.getElementById('road').innerHTML=stages.map((s,i)=>'<div class="card"><span class="badge">Stage '+(i+1)+'</span><h2 style="margin-top:10px">'+BX.esc(i===0?role+' foundation':i===1?'Impact portfolio':'Next-level readiness')+'</h2><p class="muted">'+(i===0?'Strengthen the skills required for '+BX.esc(role)+'.':i===1?'Quantify achievements, build relevant projects and tailor your resume.':'Practice interviews, close high-priority gaps and apply consistently.')+'</p><div class="chips">'+skills.slice(i*2,i*2+3).map(x=>'<span class="chip">'+BX.esc(x)+'</span>').join('')+'</div></div>').join('')</script></body></html>
