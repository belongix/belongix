<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Career Coach — Belongix</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="top"><a class="brand" href="dashboard.html">Belong<span>ix</span></a><nav class="topnav"><a href="dashboard.html">Dashboard</a><a href="resume-builder.html">Resume</a><a href="jobs.html">Jobs</a><a href="applications.html">Applications</a><a class="active" href="career-coach.html">Coach</a></nav></header><main class="main"><div class="pagehead"><div><h1>AI Career Coach</h1><p>Grounded recommendations from your verified career data. AI suggestions never become facts without your approval.</p></div></div><div class="grid grid2"><div class="card"><h2>Your current context</h2><div id="context" class="list"></div></div><div class="card"><h2>Recommendations</h2><div id="rec" class="list"></div></div></div><div class="card" style="margin-top:16px"><h2>Ask your coach</h2><div class="field"><textarea id="q" placeholder="How should I improve my chances for senior Java roles?"></textarea></div><button class="btn primary" onclick="ask()">Ask →</button><div id="answer" style="margin-top:15px" class="muted"></div></div></main><script>let p=BX.local('profile')||{},r=BX.local('resume')||{},apps=BX.local('applications')||[];document.getElementById('context').innerHTML='<div class="listitem"><span>Target role</span><b>'+BX.esc(p.target_role||r.title||'Not set')+'</b></div><div class="listitem"><span>Skills</span><b>'+((p.skills||r.skills||[]).length)+'</b></div><div class="listitem"><span>Applications</span><b>'+apps.length+'</b></div>';let rec=[];if(!p.professional_summary&&!r.summary)rec.push('Add a focused professional summary.');if((p.skills||r.skills||[]).length<5)rec.push('Add your most relevant verified technical skills.');if(!r.exp?.length)rec.push('Add measurable work achievements to your resume.');if(!BX.local('lastJob'))rec.push('Analyze a real target job to unlock keyword and gap recommendations.');document.getElementById('rec').innerHTML=rec.map(x=>'<div class="listitem"><span>'+BX.esc(x)+'</span><span class="badge">Next</span></div>').join('')||'<div class="empty">Your profile is in good shape. Analyze a target role for more specific recommendations.</div>';function ask(){let q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('answer').textContent='Based on your current Belongix profile, start with verified evidence: align your summary and top skills to the target role, then quantify your strongest achievements. Connect a server-side AI function in config.js to enable generated answers.'}</script></body></html>
