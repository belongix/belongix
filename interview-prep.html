<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Prep — Belongix</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="top"><a class="brand" href="dashboard.html">Belong<span>ix</span></a><nav class="topnav"><a href="dashboard.html">Dashboard</a><a href="resume-builder.html">Resume</a><a href="jobs.html">Jobs</a><a href="applications.html">Applications</a><a class="active" href="interview-prep.html">Interview</a></nav></header><main class="main"><div class="pagehead"><div><h1>Interview Prep</h1><p>Generate role-specific preparation from your resume and target job.</p></div><button class="btn primary" onclick="generate()">Generate prep →</button></div><div id="out" class="grid grid2"></div></main><div class="toast"></div><script>function generate(){let r=BX.local('resume')||{},j=BX.local('lastJob')||{};let role=j.role||r.title||'your target role';let tech=(r.skills||[]).slice(0,8);let qs=['Walk me through your experience relevant to '+role+'.','What was the most difficult technical problem you solved?','Tell me about a measurable achievement in your recent role.','Why are you interested in this role?','Describe a production issue and how you handled it.','What would you improve in your current technical stack?'];document.getElementById('out').innerHTML='<div class="card"><h2>Technical questions</h2>'+qs.slice(0,4).map((q,i)=>'<div class="listitem"><span>'+BX.esc(q)+'</span><span class="badge">Q'+(i+1)+'</span></div>').join('')+'</div><div class="card"><h2>Focus areas</h2><div class="chips">'+tech.map(x=>'<span class="chip">'+BX.esc(x)+'</span>').join('')+'</div><p class="muted" style="margin-top:14px;font-size:13px">Prepare one concrete example for each skill and connect it to business impact.</p><h3 style="margin-top:18px">Behavioral prompts</h3>'+qs.slice(4).map(q=>'<div class="listitem"><span>'+BX.esc(q)+'</span></div>').join('')+'</div>'}generate();</script></body></html>
