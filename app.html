<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Belongix — Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icons/icon-32.png"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<meta name="theme-color" content="#2D1B69"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Belongix"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  --brand:#2D1B69;--brand2:#4C2FAA;--brand3:#6B48CC;
  --accent:#FF5C35;--accent2:#FF7A59;
  --ink:#0D0D1A;--muted:#5A5A7A;--subtle:#8B8BA8;
  --bg:#FAFAFE;--off:#F7F7FC;--off2:#EFEFF8;
  --border:#E4E4F0;--border2:#D0D0E8;
  --green:#10B981;
  --ff:'Sora',sans-serif;--ffb:'DM Sans',sans-serif;
}
html,body{height:100%}
body{
  font-family:var(--ffb);background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
  background-image:linear-gradient(rgba(45,27,105,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(45,27,105,.05) 1px,transparent 1px);
  background-size:52px 52px;background-attachment:fixed;
}
/* Orbs */
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.15;pointer-events:none;z-index:0}
.orb1{width:400px;height:400px;background:radial-gradient(circle,#6B48CC,transparent);top:-80px;right:-80px}
.orb2{width:300px;height:300px;background:radial-gradient(circle,#FF5C35,transparent);bottom:-60px;left:5%}
.app-wrap{width:100%;max-width:400px;position:relative;z-index:1}
/* Logo + tagline */
.app-top{text-align:center;margin-bottom:28px}
.app-logo{font-family:var(--ff);font-size:32px;font-weight:800;color:var(--brand);letter-spacing:-.6px;display:inline-block;text-decoration:none;margin-bottom:6px}
.app-logo span{color:var(--accent)}
.app-tagline{font-size:14px;color:var(--muted);line-height:1.5}
/* Card */
.app-card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:32px;box-shadow:0 8px 40px rgba(45,27,105,.1);position:relative}
.app-card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:3px;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:0 0 3px 3px}
.app-card h2{font-family:var(--ff);font-size:20px;font-weight:800;color:var(--ink);margin-bottom:5px;letter-spacing:-.3px}
.app-card .sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5}
/* Tabs */
.m-tabs{display:flex;gap:2px;background:var(--off);border-radius:10px;padding:3px;margin-bottom:20px}
.m-tab{flex:1;padding:8px;text-align:center;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);transition:.15s;border:none;background:none;font-family:var(--ffb)}
.m-tab.active{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 4px rgba(45,27,105,.1)}
/* Inputs */
.inp-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.m-inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--ffb);color:var(--ink);outline:none;margin-bottom:12px;transition:.15s;background:#FAFAFE}
.m-inp:focus{border-color:var(--brand3);box-shadow:0 0 0 3px rgba(107,72,204,.1);background:#fff}
/* Buttons */
.m-btn{width:100%;padding:13px;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--ffb);transition:.2s;margin-bottom:12px}
.m-btn:hover{background:var(--brand2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(45,27,105,.25)}
.m-btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.or-div{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.or-line{flex:1;height:1px;background:var(--border)}
.or-txt{font-size:11.5px;color:var(--subtle);font-weight:500}
.m-google{width:100%;padding:11px;background:#fff;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--ffb);display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;color:var(--ink)}
.m-google:hover{border-color:var(--border2);background:var(--off)}
/* Alerts */
.m-ok{display:none;background:#ECFDF5;border:1px solid #6EE7B7;border-radius:8px;padding:10px 14px;text-align:center;font-size:13px;color:#065F46;font-weight:600;margin-top:10px;align-items:center;gap:7px}
.m-ok.show{display:flex;justify-content:center}
.m-err{display:none;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;color:#991B1B;margin-top:10px}
.m-err.show{display:block}
.m-fine{font-size:11.5px;color:var(--subtle);text-align:center;margin-top:14px;line-height:1.6}
.m-fine a{color:var(--brand);text-decoration:none;font-weight:600}
.skip-link{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--subtle);text-decoration:none;transition:.15s}
.skip-link:hover{color:var(--brand)}
/* Checking state */
.checking{text-align:center;padding:32px 0}
.check-spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.check-txt{font-size:14px;font-weight:600;color:var(--ink)}
.check-sub{font-size:12px;color:var(--muted);margin-top:4px}
/* Trust row */
.trust-row{display:flex;justify-content:center;gap:20px;margin-top:20px;flex-wrap:wrap}
.trust-item{font-size:11.5px;color:var(--subtle);display:flex;align-items:center;gap:4px;font-weight:500}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="app-wrap">
  <div class="app-top">
    <a href="index.html" class="app-logo">Belong<span>ix</span></a>
    <div class="app-tagline">Your professional career, upgraded.</div>
  </div>

  <!-- Checking state -->
  <div class="app-card" id="checking-card">
    <div class="checking">
      <div class="check-spin"></div>
      <div class="check-txt">Checking your session...</div>
      <div class="check-sub">Just a moment</div>
    </div>
  </div>

  <!-- Auth card -->
  <div class="app-card" id="auth-card" style="display:none">
    <h2 id="card-title">Welcome back</h2>
    <p class="sub" id="card-sub">Sign in to access your dashboard, jobs and Bexi AI.</p>

    <div class="m-tabs">
      <button class="m-tab active" id="tab-si" onclick="appTab('signin')">Sign In</button>
      <button class="m-tab" id="tab-su" onclick="appTab('signup')">Sign Up</button>
    </div>

    <div id="app-signin">
      <label class="inp-label">Email Address</label>
      <input class="m-inp" type="email" id="a-si-email" placeholder="you@email.com" autocomplete="email"/>
      <label class="inp-label">Password</label>
      <input class="m-inp" type="password" id="a-si-pass" placeholder="Your password" autocomplete="current-password"/>
      <button class="m-btn" id="si-btn" onclick="appAuth('signin')">Sign In →</button>
    </div>

    <div id="app-signup" style="display:none">
      <label class="inp-label">Email Address</label>
      <input class="m-inp" type="email" id="a-su-email" placeholder="you@email.com" autocomplete="email"/>
      <label class="inp-label">Password</label>
      <input class="m-inp" type="password" id="a-su-pass" placeholder="Create a password (min 6 chars)" autocomplete="new-password"/>
      <button class="m-btn" id="su-btn" onclick="appAuth('signup')">Create Account →</button>
    </div>

    <div class="or-div"><div class="or-line"></div><span class="or-txt">or</span><div class="or-line"></div></div>

    <button class="m-google" onclick="googleAuth()">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="m-ok" id="app-ok"></div>
    <div class="m-err" id="app-err"></div>

    <p class="m-fine">By signing up you agree to our <a href="terms.html">Terms of Service</a> &amp; <a href="privacy.html">Privacy Policy</a>.</p>
  </div>

  <a class="skip-link" href="index.html">← Back to home</a>

  <div class="trust-row">
    <div class="trust-item">🔒 Secure &amp; Private</div>
    <div class="trust-item">🇮🇳 Made in India</div>
    <div class="trust-item">⚡ Free to join</div>
  </div>
</div>

<script>
var SB_URL='https://efhcfuaxgbzuqlmhlsxc.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';
var sb=supabase.createClient(SB_URL,SB_KEY);

sb.auth.getSession().then(function(r){
  if(r.data&&r.data.session){
    window.location.href='dashboard.html';
  } else {
    document.getElementById('checking-card').style.display='none';
    document.getElementById('auth-card').style.display='block';
  }
});

function appTab(tab){
  document.getElementById('app-signin').style.display=tab==='signin'?'block':'none';
  document.getElementById('app-signup').style.display=tab==='signup'?'block':'none';
  document.getElementById('tab-si').classList[tab==='signin'?'add':'remove']('active');
  document.getElementById('tab-su').classList[tab==='signup'?'add':'remove']('active');
  document.getElementById('card-title').textContent=tab==='signin'?'Welcome back':'Join Belongix Free';
  document.getElementById('card-sub').textContent=tab==='signin'?'Sign in to access your dashboard, jobs and Bexi AI.':'Create your free account and start your career journey.';
  hideAlerts();
}

function hideAlerts(){
  var ok=document.getElementById('app-ok'); if(ok)ok.className='m-ok';
  var err=document.getElementById('app-err'); if(err)err.className='m-err';
}

function showErr(msg){
  var err=document.getElementById('app-err');
  if(err){err.textContent=msg;err.className='m-err show';}
}

async function appAuth(type){
  hideAlerts();
  var email='',pass='',btnId='';
  if(type==='signin'){
    email=(document.getElementById('a-si-email')||{}).value||'';
    pass=(document.getElementById('a-si-pass')||{}).value||'';
    btnId='si-btn';
  } else {
    email=(document.getElementById('a-su-email')||{}).value||'';
    pass=(document.getElementById('a-su-pass')||{}).value||'';
    btnId='su-btn';
  }
  if(!email||!pass){showErr('Please fill in both email and password.');return;}
  if(type==='signup'&&pass.length<6){showErr('Password must be at least 6 characters.');return;}
  var btn=document.getElementById(btnId);
  if(btn){btn.disabled=true;btn.textContent='Please wait...';}
  try{
    var res=type==='signup'
      ?await sb.auth.signUp({email:email,password:pass})
      :await sb.auth.signInWithPassword({email:email,password:pass});
    if(res.error)throw res.error;
    if(type==='signin'){
      window.location.href='dashboard.html';
    } else {
      var ok=document.getElementById('app-ok');
      if(ok){ok.innerHTML='✓ Account created! Check your email to confirm.';ok.className='m-ok show';}
      if(btn){btn.disabled=false;btn.textContent='Create Account →';}
    }
  }catch(e){
    showErr(e.message||'Something went wrong. Please try again.');
    if(btn){btn.disabled=false;btn.textContent=type==='signin'?'Sign In →':'Create Account →';}
  }
}

async function googleAuth(){
  try{
    await sb.auth.signInWithOAuth({
      provider:'google',
      options:{redirectTo:window.location.origin+'/dashboard.html'}
    });
  }catch(e){showErr('Google sign-in failed: '+e.message);}
}

// Enter key support
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    var siActive=document.getElementById('app-signin').style.display!=='none';
    siActive?appAuth('signin'):appAuth('signup');
  }
});
</script>
<script src="pwa-install.js"></script>
</body>
</html>
