<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Skill Gaps — Belongix</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-shell.js"></script>
<style>
.gap-row{border-top:1px solid var(--border);padding:12px 0}
.gap-row:first-child{border-top:none}
.gap-head{display:flex;justify-content:space-between;align-items:center}
.gap-name{font-weight:600;font-size:14px}
.gap-freq{font-size:11.5px;color:var(--text-secondary);margin-top:4px}
</style>
</head>
<body>
<script>
var SB_URL='https://efhcfuaxgbzuqlmhlsxc.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _user=null;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.addEventListener('load',async function(){
  var s=await sb.auth.getSession();
  if(!s.data||!s.data.session){window.location.href='career-profile.html';return;}
  _user=s.data.session.user;

  renderAppShell('skill-gaps', ''
    +'<h1 style="margin-bottom:4px">Skill Gap Analysis</h1>'
    +'<p style="color:var(--text-secondary);font-size:13px;margin-bottom:20px">Computed from your real profile skills against skills actually required across your analyzed jobs — not AI-generated.</p>'
    +'<div class="card" style="margin-bottom:16px"><div class="card-title">Your Strong Skills</div><div id="strong-skills"></div></div>'
    +'<div class="card"><div class="card-title">Missing Skills (ranked by real frequency across your analyzed jobs)</div><div id="gap-list"></div></div>'
  , _user.email);

  await analyze();
});

async function analyze(){
  var results = await Promise.all([
    sb.from('career_profiles').select('technical_skills,soft_skills,tools_and_platforms').eq('user_id',_user.id).maybeSingle(),
    sb.from('job_descriptions').select('extracted').eq('user_id',_user.id)
  ]);
  var profile=results[0].data||{};
  var jds=results[1].data||[];

  var mySkills=[].concat(profile.technical_skills||[],profile.tools_and_platforms||[]).map(function(s){return s.toLowerCase();});

  if(!jds.length){
    document.getElementById('gap-list').innerHTML='<div class="empty-state"><div class="empty-state-icon">📈</div><div class="empty-state-title">No jobs analyzed yet</div><div class="empty-state-desc">Analyze a job description to see real, frequency-ranked skill gaps.</div><a href="jobs.html" class="btn btn-primary">Analyze a Job</a></div>';
    document.getElementById('strong-skills').innerHTML=mySkills.length
      ?[].concat(profile.technical_skills||[],profile.tools_and_platforms||[]).map(function(s){return '<span class="chip chip-strong" style="border-color:#C7D2FE;color:var(--accent);background:var(--accent-light)">'+esc(s)+'</span>';}).join('')
      :'<p style="color:var(--text-secondary);font-size:13px">No skills in your profile yet.</p>';
    return;
  }

  var skillFreq={};
  jds.forEach(function(j){
    var ex=j.extracted||{};
    [].concat(ex.skills_required||[],ex.skills_preferred||[]).forEach(function(sk){
      var key=sk.toLowerCase();
      skillFreq[key]=(skillFreq[key]||0)+1;
    });
  });

  var strong=[],gaps=[];
  Object.keys(skillFreq).forEach(function(sk){
    var have=mySkills.some(function(ms){return ms.indexOf(sk)!==-1||sk.indexOf(ms)!==-1;});
    if(have)strong.push(sk);else gaps.push({skill:sk,freq:skillFreq[sk]});
  });
  gaps.sort(function(a,b){return b.freq-a.freq;});

  document.getElementById('strong-skills').innerHTML=strong.length
    ?strong.map(function(s){return '<span class="chip" style="border-color:#C7D2FE;color:var(--accent);background:var(--accent-light)">'+esc(s)+'</span>';}).join('')
    :'<p style="color:var(--text-secondary);font-size:13px">None of your current skills matched requirements in your analyzed jobs yet.</p>';

  document.getElementById('gap-list').innerHTML=gaps.length?gaps.map(function(g){
    var pct=Math.round(g.freq/jds.length*100);
    var priority=pct>=60?'high':pct>=30?'medium':'low';
    var badgeClass=priority==='high'?'badge-error':priority==='medium'?'badge-warning':'badge-neutral';
    return '<div class="gap-row"><div class="gap-head"><span class="gap-name">'+esc(g.skill)+'</span><span class="badge '+badgeClass+'">'+priority+'</span></div>'
      +'<div class="gap-freq">Appears in '+g.freq+' of '+jds.length+' analyzed jobs ('+pct+'%) — real signal from your own saved job analyses, not a generic industry claim.</div></div>';
  }).join(''):'<p style="color:var(--text-secondary);font-size:13px">No gaps found — your skills cover everything required in your analyzed jobs.</p>';
}
</script>
</body>
</html>
