<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Interview Prep — Belongix</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-shell.js"></script>
<style>
.q-block{border-top:1px solid var(--border);padding:14px 0}
.q-block:first-child{border-top:none}
.q-text{font-weight:600;font-size:13.5px;margin-bottom:8px}
.company-note{background:var(--warning-light);border:1px solid #FDE68A;border-radius:8px;padding:12px;font-size:12.5px;color:var(--warning)}
</style>
</head>
<body>
<script>
var SB_URL='https://efhcfuaxgbzuqlmhlsxc.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _user=null,_apps=[];
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.addEventListener('load',async function(){
  var s=await sb.auth.getSession();
  if(!s.data||!s.data.session){window.location.href='career-profile.html';return;}
  _user=s.data.session.user;

  renderAppShell('interview', ''
    +'<h1 style="margin-bottom:16px">Interview Preparation</h1>'
    +'<div class="card" style="margin-bottom:16px"><div class="card-title">Select an application</div><select id="app-select" onchange="loadPrep()"><option value="">Choose an application…</option></select></div>'
    +'<div id="prep-content"></div>'
  , _user.email);

  var r=await sb.from('applications').select('*,resumes(content),job_descriptions(raw_text,extracted)').eq('user_id',_user.id).not('job_description_id','is',null);
  _apps=r.data||[];
  document.getElementById('app-select').innerHTML='<option value="">Choose an application…</option>'
    +_apps.map(function(a){return '<option value="'+a.id+'">'+esc(a.company)+' — '+esc(a.role_title)+'</option>';}).join('');
  if(!_apps.length)document.getElementById('prep-content').innerHTML='<div class="empty-state"><div class="empty-state-icon">🎤</div><div class="empty-state-title">No applications ready for prep yet</div><div class="empty-state-desc">Add an application with an analyzed job description via Job Intelligence first.</div><a href="jobs.html" class="btn btn-primary">Go to Job Intelligence</a></div>';
});

async function loadPrep(){
  var appId=document.getElementById('app-select').value;
  if(!appId)return;
  var app=_apps.find(function(a){return a.id===appId;});
  var content=document.getElementById('prep-content');
  content.innerHTML='<p style="color:var(--text-secondary)">Generating interview preparation…</p>';

  if(!app.resumes||!app.job_descriptions){
    content.innerHTML='<p style="color:var(--text-secondary)">This application needs both a linked resume and job description to generate real preparation.</p>';
    return;
  }
  var resumeText=(app.resumes.content.summary||'')+' '+JSON.stringify(app.resumes.content.sections||[]);

  try{
    var session=await sb.auth.getSession();
    var r=await fetch(SB_URL+'/functions/v1/career-ai-generate',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.data.session.access_token},
      body:JSON.stringify({action:'generate_interview_prep',payload:{resume_text:resumeText,job_description:app.job_descriptions.raw_text,role_title:app.role_title,company:app.company}})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||'Could not generate preparation');
    renderPrep(d.prep);
  }catch(e){console.error(e);content.innerHTML='<p style="color:var(--error)">⚠️ '+esc(e.message)+'</p>';}
}

function renderPrep(prep){
  var html='';
  if(prep.company_note)html+='<div class="company-note" style="margin-bottom:16px">'+esc(prep.company_note)+'</div>';
  html+=questionPanel('Technical Questions',prep.technical_questions);
  html+=questionPanel('Behavioral Questions',prep.behavioral_questions);
  html+=questionPanel('Resume-Based Questions',prep.resume_based_questions);
  html+=questionPanel('Role-Specific Questions',prep.role_specific_questions);
  document.getElementById('prep-content').innerHTML=html;
}
function questionPanel(title,questions){
  if(!questions||!questions.length)return '';
  return '<div class="card" style="margin-bottom:16px"><div class="card-title">'+title+'</div>'
    +questions.map(function(q){
      return '<div class="q-block"><div class="q-text">'+esc(q)+'</div>'
        +'<textarea rows="3" placeholder="Practice your answer here…"></textarea></div>';
    }).join('')+'</div>';
}
</script>
</body>
</html>
