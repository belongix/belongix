<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<style>
:root{--brand:#2D1B69;--brand2:#4C2FAA;--accent:#FF5C35;--green:#10B981;--ink:#0D0D1A;--muted:#5A5A7A;--subtle:#8B8BA8;--border:#E4E4F0;--bg:#F7F7FC;--white:#fff;--ff:'Sora',sans-serif;--ffb:'DM Sans',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ffb);background:var(--bg);color:var(--ink)}
.nav{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{font-family:var(--ff);font-size:20px;font-weight:800;color:var(--brand);text-decoration:none}
.nav-logo span{color:var(--accent)}
.nav-back{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;transition:.15s}
.nav-back:hover{border-color:var(--brand);color:var(--brand)}

/* LAYOUT */
.page-wrap{max-width:1100px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media(max-width:900px){.page-wrap{grid-template-columns:1fr}.sidebar{display:none}}

/* COURSE HEADER */
.course-header{background:linear-gradient(135deg,#1A0B4B,#2D1B69);border-radius:20px;padding:32px;margin-bottom:24px;color:#fff}
.course-breadcrumb{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:12px}
.course-breadcrumb a{color:rgba(255,255,255,.6);text-decoration:none}
.course-breadcrumb a:hover{color:#fff}
.course-h-title{font-family:var(--ff);font-size:26px;font-weight:800;line-height:1.2;margin-bottom:10px}
.course-h-sub{font-size:15px;color:rgba(255,255,255,.75);margin-bottom:20px}
.course-h-meta{display:flex;gap:16px;flex-wrap:wrap}
.course-h-badge{display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.1);padding:4px 10px;border-radius:20px}

/* MODULES */
.card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.card-title{font-family:var(--ff);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.module-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer;transition:.15s;border:1.5px solid transparent}
.module-item:hover{background:#F0EEFF;border-color:var(--brand)}
.module-item.active{background:#F0EEFF;border-color:var(--brand)}
.module-item.completed{background:#F0FDF4;border-color:var(--green)}
.module-num{width:32px;height:32px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);flex-shrink:0}
.module-item.active .module-num{background:var(--brand);color:#fff}
.module-item.completed .module-num{background:var(--green);color:#fff}
.module-info{flex:1;min-width:0}
.module-title{font-size:13px;font-weight:600;color:var(--ink)}
.module-dur{font-size:11px;color:var(--muted);margin-top:2px}
.module-check{font-size:16px;flex-shrink:0}

/* CONTENT AREA */
.content-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:28px;margin-bottom:16px}
.content-card h2{font-family:var(--ff);font-size:20px;font-weight:700;color:var(--ink);margin-bottom:16px}
.content-card h3{font-family:var(--ff);font-size:16px;font-weight:700;color:var(--ink);margin:20px 0 10px}
.content-card p{font-size:14px;color:#3A3A5A;line-height:1.8;margin-bottom:14px}
.content-card ul,.content-card ol{padding-left:20px;margin-bottom:14px}
.content-card li{font-size:14px;color:#3A3A5A;line-height:1.8;margin-bottom:6px}
.content-card blockquote{background:#F0EEFF;border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;font-size:14px;color:var(--ink);font-style:italic;line-height:1.7}
.content-card strong{color:var(--ink);font-weight:700}
.module-nav{display:flex;gap:10px;margin-top:20px}
.nav-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--ff);border:none;transition:.15s}
.nav-btn.prev{background:#F0EEFF;color:var(--brand)}
.nav-btn.prev:hover{background:var(--brand);color:#fff}
.nav-btn.next{background:var(--brand);color:#fff}
.nav-btn.next:hover{background:var(--brand2)}
.nav-btn.complete{background:var(--green);color:#fff}
.nav-btn.complete:hover{filter:brightness(1.1)}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}

/* QUIZ */
.quiz-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:28px}
.quiz-header{text-align:center;margin-bottom:28px}
.quiz-icon{font-size:48px;margin-bottom:12px}
.quiz-title{font-family:var(--ff);font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px}
.quiz-sub{font-size:14px;color:var(--muted)}
.quiz-progress{height:6px;background:var(--border);border-radius:3px;margin-bottom:28px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),#06B6D4);border-radius:3px;transition:width .4s}
.quiz-q-num{font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.quiz-q-text{font-size:16px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:20px}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.quiz-option{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:.15s;font-size:14px;color:var(--ink)}
.quiz-option:hover:not(.selected):not(.correct):not(.wrong){border-color:var(--brand);background:#F0EEFF}
.quiz-option.selected{border-color:var(--brand);background:#F0EEFF}
.quiz-option.correct{border-color:var(--green);background:#F0FDF4;color:#15803D;font-weight:600}
.quiz-option.wrong{border-color:#EF4444;background:#FEF2F2;color:#B91C1C}
.quiz-opt-letter{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:.15s}
.quiz-option.selected .quiz-opt-letter{background:var(--brand);color:#fff}
.quiz-option.correct .quiz-opt-letter{background:var(--green);color:#fff}
.quiz-option.wrong .quiz-opt-letter{background:#EF4444;color:#fff}
.quiz-explanation{background:#FEF9C3;border:1px solid #FDE68A;border-radius:10px;padding:12px 16px;font-size:13px;color:#92400E;margin-bottom:16px;display:none}
.quiz-explanation.show{display:block}
.quiz-next-btn{width:100%;padding:13px;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--ff);transition:.15s}
.quiz-next-btn:hover{background:var(--brand2)}
.quiz-next-btn:disabled{opacity:.4;cursor:not-allowed}

/* QUIZ RESULT */
.quiz-result{text-align:center;padding:20px 0}
.result-icon{font-size:64px;margin-bottom:16px}
.result-title{font-family:var(--ff);font-size:24px;font-weight:800;margin-bottom:8px}
.result-score{font-family:var(--ff);font-size:48px;font-weight:800;color:var(--brand);margin-bottom:4px}
.result-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
.result-btn{padding:13px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--ff);border:none;transition:.15s}
.result-btn.primary{background:var(--brand);color:#fff;margin-right:10px}
.result-btn.primary:hover{background:var(--brand2)}
.result-btn.secondary{background:#F0EEFF;color:var(--brand)}
.result-btn.secondary:hover{background:var(--brand);color:#fff}

/* SIDEBAR */
.sidebar{position:sticky;top:74px}
.progress-card{background:var(--brand);border-radius:16px;padding:20px;color:#fff;margin-bottom:16px}
.progress-title{font-size:13px;font-weight:600;opacity:.8;margin-bottom:8px}
.progress-pct{font-family:var(--ff);font-size:36px;font-weight:800;margin-bottom:8px}
.progress-bar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;background:#FCD34D;border-radius:4px;transition:width .5s}
.progress-detail{font-size:12px;opacity:.75}
.cert-locked-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;text-align:center}
.cert-locked-icon{font-size:40px;margin-bottom:10px}
.cert-locked-title{font-family:var(--ff);font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
.cert-locked-sub{font-size:12px;color:var(--muted);line-height:1.5}
.cert-available-card{background:linear-gradient(135deg,#065F46,#059669);border-radius:16px;padding:20px;text-align:center;cursor:pointer}
.cert-available-card:hover{filter:brightness(1.05)}
.cert-available-title{font-family:var(--ff);font-size:14px;font-weight:700;color:#fff;margin-bottom:6px}
.cert-available-btn{background:#FCD34D;color:#065F46;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:var(--ff);margin-top:10px;width:100%}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#0D0D1A;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:.3s;pointer-events:none;cursor:pointer}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

async function dbGet(table, qs) {
  try {
    var r = await fetch(_SBR + table + '?' + qs, { headers: Object.assign({}, _SBH, {'Prefer':''}) });
    var d = await r.json();
    return Array.isArray(d) ? d : [];
  } catch(e) { console.warn('dbGet error', table, e.message); return []; }
}
async function dbPost(table, body, prefer) {
  try {
    var h = Object.assign({}, _SBH);
    if (prefer) h['Prefer'] = prefer;
    await fetch(_SBR + table, { method: 'POST', headers: h, body: JSON.stringify(body) });
  } catch(e) { console.warn('dbPost error', table, e.message); }
}
async function dbPatch(table, qs, body) {
  try {
    await fetch(_SBR + table + '?' + qs, { method: 'PATCH', headers: _SBH, body: JSON.stringify(body) });
  } catch(e) { console.warn('dbPatch error', table, e.message); }
}

'web-development-fundamentals':[
  {id:'wdf-1',title:'How the Web Works — Internet Fundamentals',duration_mins:15,order_index:1,is_free_preview:true,content:'<h2>How the Web Works</h2><p>Every time you open a website, a complex but elegant system springs into action. Understanding this system is the foundation of web development.</p><h3>The Request-Response Cycle</h3><p>When you type <code>belongix.in</code> in your browser:</p><ol><li><strong>DNS Lookup</strong> — Your browser asks a DNS server "what IP address is belongix.in?" and gets back something like <code>76.223.105.230</code></li><li><strong>TCP Connection</strong> — Your browser connects to that IP address on port 443 (HTTPS)</li><li><strong>HTTP Request</strong> — Browser sends: <code>GET / HTTP/1.1</code> with headers like <code>Accept-Language: en-IN</code></li><li><strong>Server Response</strong> — Server sends back HTML, status code 200</li><li><strong>Browser Renders</strong> — Browser parses HTML, finds CSS and JS files, downloads them, renders the page</li></ol><h3>HTTP Status Codes You Must Know</h3><ul><li><strong>200 OK</strong> — success</li><li><strong>301 Moved Permanently</strong> — redirect</li><li><strong>404 Not Found</strong> — page does not exist</li><li><strong>500 Internal Server Error</strong> — server crashed</li><li><strong>403 Forbidden</strong> — not authorized</li></ul><h3>The Three Languages of the Web</h3><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:10px;text-align:left;border:1px solid #ddd">Language</th><th style="padding:10px;text-align:left;border:1px solid #ddd">Role</th><th style="padding:10px;text-align:left;border:1px solid #ddd">Analogy</th></tr><tr><td style="padding:10px;border:1px solid #ddd"><strong>HTML</strong></td><td style="padding:10px;border:1px solid #ddd">Structure and content</td><td style="padding:10px;border:1px solid #ddd">The skeleton of a building</td></tr><tr><td style="padding:10px;border:1px solid #ddd"><strong>CSS</strong></td><td style="padding:10px;border:1px solid #ddd">Styling and layout</td><td style="padding:10px;border:1px solid #ddd">Paint, furniture, decoration</td></tr><tr><td style="padding:10px;border:1px solid #ddd"><strong>JavaScript</strong></td><td style="padding:10px;border:1px solid #ddd">Interactivity and logic</td><td style="padding:10px;border:1px solid #ddd">Electricity and plumbing</td></tr></table><h3>Your Browser DevTools</h3><p>Press <strong>F12</strong> right now. This opens the most important tool in your web development journey. You can inspect any element on any website, see network requests, debug JavaScript, and test CSS changes live. Every professional web developer has DevTools open constantly.</p><blockquote><strong>Action:</strong> Open F12, click the Elements tab, and hover over different parts of this page. Watch how HTML elements highlight as you hover over them in the panel.</blockquote>'},
  {id:'wdf-2',title:'HTML — Structure Every Page',duration_mins:20,order_index:2,content:'<h2>HTML — HyperText Markup Language</h2><p>HTML gives meaning and structure to your content. It is not about making things look good — CSS handles that. HTML is about saying "this is a heading," "this is a paragraph," "this is a list."</p><h3>Document Structure</h3><pre><code>&lt;!DOCTYPE html&gt;\n&lt;html lang="en"&gt;\n&lt;head&gt;\n  &lt;meta charset="UTF-8"&gt;\n  &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;\n  &lt;title&gt;My First Page&lt;/title&gt;\n  &lt;link rel="stylesheet" href="style.css"&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;header&gt;\n    &lt;nav&gt;\n      &lt;a href="/"&gt;Home&lt;/a&gt;\n      &lt;a href="/jobs"&gt;Jobs&lt;/a&gt;\n    &lt;/nav&gt;\n  &lt;/header&gt;\n  &lt;main&gt;\n    &lt;h1&gt;Find Your Dream Job&lt;/h1&gt;\n    &lt;p&gt;Browse 10,000+ jobs in Bangalore.&lt;/p&gt;\n  &lt;/main&gt;\n  &lt;footer&gt;Copyright 2026&lt;/footer&gt;\n  &lt;script src="app.js"&gt;&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;</code></pre><h3>Semantic Tags — Use These Always</h3><p>Semantic tags tell both browsers and search engines what each section means:</p><ul><li><code>&lt;header&gt;</code> — top of page/section, usually contains logo and nav</li><li><code>&lt;nav&gt;</code> — navigation links</li><li><code>&lt;main&gt;</code> — the primary content of the page (only one per page)</li><li><code>&lt;section&gt;</code> — a thematic grouping of content</li><li><code>&lt;article&gt;</code> — self-contained content (blog post, news article)</li><li><code>&lt;aside&gt;</code> — sidebar content</li><li><code>&lt;footer&gt;</code> — bottom of page/section</li></ul><h3>Forms — How Users Send Data</h3><pre><code>&lt;form action="/apply" method="POST"&gt;\n  &lt;label for="name"&gt;Full Name&lt;/label&gt;\n  &lt;input type="text" id="name" name="name" required placeholder="Keerthi Reddy"&gt;\n\n  &lt;label for="email"&gt;Email&lt;/label&gt;\n  &lt;input type="email" id="email" name="email" required&gt;\n\n  &lt;label for="resume"&gt;Upload Resume&lt;/label&gt;\n  &lt;input type="file" id="resume" name="resume" accept=".pdf"&gt;\n\n  &lt;select name="experience"&gt;\n    &lt;option value="0-2"&gt;0-2 years&lt;/option&gt;\n    &lt;option value="2-5"&gt;2-5 years&lt;/option&gt;\n    &lt;option value="5+"&gt;5+ years&lt;/option&gt;\n  &lt;/select&gt;\n\n  &lt;button type="submit"&gt;Apply Now&lt;/button&gt;\n&lt;/form&gt;</code></pre><h3>Common Input Types</h3><ul><li><code>type="text"</code> — single line text</li><li><code>type="email"</code> — validates email format automatically</li><li><code>type="password"</code> — masks input</li><li><code>type="number"</code> — numeric keyboard on mobile</li><li><code>type="date"</code> — date picker</li><li><code>type="checkbox"</code> — true/false toggle</li><li><code>type="radio"</code> — choose one from a group</li></ul><blockquote><strong>Practice:</strong> Build a job application form with: full name, email, phone number, years of experience (dropdown), and a file upload for resume. Open it in your browser and fill it out.</blockquote>'},
  {id:'wdf-3',title:'CSS — Design That Works',duration_mins:20,order_index:3,content:'<h2>CSS — Cascading Style Sheets</h2><p>CSS transforms plain HTML into beautiful, responsive interfaces. The word "cascading" means styles flow from parent to child, and later rules override earlier ones.</p><h3>Selectors — Targeting Elements</h3><pre><code>/* Element selector */\np { color: #333; }\n\n/* Class selector (most common) */\n.job-card { background: white; border-radius: 12px; }\n\n/* ID selector (use sparingly) */\n#hero { min-height: 100vh; }\n\n/* Descendant — p inside .card */\n.card p { font-size: 14px; }\n\n/* Pseudo-class — hover state */\n.btn:hover { background: #5a2ed4; transform: translateY(-2px); }\n\n/* Pseudo-element — first letter */\np::first-letter { font-size: 2em; font-weight: bold; }</code></pre><h3>The Box Model — Everything is a Box</h3><pre><code>.job-card {\n  /* Content area */\n  width: 360px;\n  height: auto;\n\n  /* Padding: space INSIDE the border */\n  padding: 24px;           /* all sides */\n  padding: 16px 24px;      /* top/bottom left/right */\n  padding: 10px 20px 10px 20px; /* top right bottom left */\n\n  /* Border */\n  border: 1px solid #e0e0e0;\n  border-radius: 12px;\n\n  /* Margin: space OUTSIDE the border */\n  margin: 0 0 16px 0;\n\n  /* box-sizing: border-box makes width include padding+border */\n  box-sizing: border-box;\n}</code></pre><h3>Flexbox — The Layout Tool You Will Use Daily</h3><pre><code>/* Parent container */\n.nav {\n  display: flex;\n  justify-content: space-between;  /* horizontal alignment */\n  align-items: center;             /* vertical alignment */\n  gap: 16px;                       /* space between items */\n  flex-wrap: wrap;                 /* wrap to next line on small screens */\n}\n\n/* justify-content values:\n   flex-start | center | flex-end | space-between | space-around | space-evenly */\n\n/* align-items values:\n   flex-start | center | flex-end | stretch | baseline */\n\n/* Make a child grow to fill remaining space */\n.search-bar { flex: 1; }</code></pre><h3>CSS Grid — Two-Dimensional Layouts</h3><pre><code>.job-grid {\n  display: grid;\n  /* 3 equal columns */\n  grid-template-columns: repeat(3, 1fr);\n  /* OR auto-responsive columns */\n  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n  gap: 24px;\n}\n\n/* Full-page layout */\n.app-layout {\n  display: grid;\n  grid-template-areas:\n    "header header"\n    "sidebar main"\n    "footer footer";\n  grid-template-columns: 250px 1fr;\n  min-height: 100vh;\n}\n.header { grid-area: header; }\n.sidebar { grid-area: sidebar; }\n.main { grid-area: main; }</code></pre><h3>CSS Variables — Design Tokens</h3><pre><code>:root {\n  --brand-primary: #6C3CE1;\n  --brand-secondary: #FF6B35;\n  --text-primary: #1a1a2e;\n  --text-muted: #666;\n  --bg-white: #ffffff;\n  --bg-light: #f8f9fa;\n  --border-color: #e0e0e0;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 20px;\n  --shadow: 0 4px 20px rgba(0,0,0,0.08);\n}\n\n.btn-primary {\n  background: var(--brand-primary);\n  border-radius: var(--radius-sm);\n  box-shadow: var(--shadow);\n}\n\n/* Dark mode with one change */\n[data-theme="dark"] {\n  --bg-white: #1a1a2e;\n  --text-primary: #f0f0f0;\n}</code></pre><blockquote><strong>Practice:</strong> Style your job application form from the previous module. Add colors, padding, a card layout, hover effects on the submit button, and make it look like a real product form.</blockquote>'},
  {id:'wdf-4',title:'JavaScript — Make It Interactive',duration_mins:20,order_index:4,content:'<h2>JavaScript — The Language of the Web</h2><p>JavaScript runs in the browser and makes websites dynamic. Without JS, websites would be static documents. With JS, they become applications.</p><h3>Variables and Data Types</h3><pre><code>// Use const for values that do not change\nconst MAX_SALARY = 100; // LPA\nconst API_URL = "https://api.belongix.in";\n\n// Use let for values that change\nlet currentPage = 1;\nlet isLoggedIn = false;\n\n// Data types\nconst name = "Keerthi";           // String\nconst age = 26;                    // Number\nconst salary = 22.5;              // Number (decimal)\nconst isHiring = true;            // Boolean\nconst skills = ["React","Node"];  // Array\nconst profile = {                  // Object\n  name: "Keerthi",\n  city: "Bangalore",\n  experience: 3\n};</code></pre><h3>Functions — Reusable Code</h3><pre><code>// Function declaration\nfunction formatSalary(lpa) {\n  return `${lpa} LPA (₹${(lpa * 100000).toLocaleString("en-IN")}/year)`;\n}\n\n// Arrow function (modern, preferred)\nconst formatDate = (dateString) => {\n  return new Date(dateString).toLocaleDateString("en-IN", {\n    day: "numeric", month: "short", year: "numeric"\n  });\n};\n\n// Default parameters\nconst greetUser = (name = "Professional") => `Welcome back, ${name}!`;\n\nconsole.log(formatSalary(22));    // "22 LPA (₹22,00,000/year)"\nconsole.log(greetUser("Keerthi")); // "Welcome back, Keerthi!"</code></pre><h3>DOM Manipulation — Control the Page</h3><pre><code>// Select elements\nconst btn = document.getElementById("apply-btn");\nconst cards = document.querySelectorAll(".job-card");\nconst input = document.querySelector("input[name=email]");\n\n// Change content\nbtn.textContent = "Applied ✓";\nbtn.innerHTML = "&lt;span&gt;✓&lt;/span&gt; Applied";\n\n// Change styles\nbtn.style.background = "#22c55e";\nbtn.classList.add("success");\nbtn.classList.remove("loading");\nbtn.classList.toggle("active");\n\n// Create new elements\nconst card = document.createElement("div");\ncard.className = "job-card";\ncard.innerHTML = `\n  &lt;h3&gt;${job.title}&lt;/h3&gt;\n  &lt;p&gt;${job.company} · ${job.location}&lt;/p&gt;\n`;\ndocument.getElementById("job-list").appendChild(card);\n\n// Events\nbtn.addEventListener("click", () => {\n  console.log("Apply button clicked!");\n  btn.textContent = "Applied ✓";\n  btn.disabled = true;\n});\n\n// Keyboard events\ndocument.addEventListener("keydown", (e) => {\n  if (e.key === "Escape") closeModal();\n});</code></pre><h3>Fetch API — Get Data from Servers</h3><pre><code>// GET request — load jobs\nasync function loadJobs() {\n  try {\n    const response = await fetch("https://api.belongix.in/jobs?city=Bangalore");\n\n    if (!response.ok) throw new Error(`HTTP ${response.status}`);\n\n    const jobs = await response.json();\n\n    jobs.forEach(job => {\n      // Render each job card\n      renderJobCard(job);\n    });\n  } catch (error) {\n    console.error("Failed to load jobs:", error);\n    showErrorMessage("Could not load jobs. Please refresh.");\n  }\n}\n\n// POST request — submit application\nasync function applyToJob(jobId, userData) {\n  const response = await fetch("/api/applications", {\n    method: "POST",\n    headers: { "Content-Type": "application/json" },\n    body: JSON.stringify({ jobId, ...userData })\n  });\n  return response.json();\n}</code></pre><blockquote><strong>Practice:</strong> Add JavaScript to your job form that: (1) validates all fields before submit, (2) shows a success message after submit, (3) disables the submit button while processing to prevent double-submit.</blockquote>'},
  {id:'wdf-5',title:'Responsive Design — Every Screen Size',duration_mins:20,order_index:5,content:'<h2>Responsive Design — Mobile-First Development</h2><p>In India, over 85% of internet users access the web on mobile. If your website only looks good on desktop, you are losing most of your users. Responsive design ensures your site works beautifully on every screen.</p><h3>The Viewport Meta Tag</h3><p>Without this tag, mobile browsers zoom out to show the full desktop version. Always include it:</p><pre><code>&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;</code></pre><h3>Mobile-First CSS Approach</h3><p>Write CSS for mobile first, then add styles for larger screens using min-width media queries:</p><pre><code>/* Mobile first (default — no media query needed) */\n.job-grid {\n  display: grid;\n  grid-template-columns: 1fr; /* single column on mobile */\n  gap: 16px;\n  padding: 16px;\n}\n\n/* Tablet — 768px and up */\n@media (min-width: 768px) {\n  .job-grid {\n    grid-template-columns: repeat(2, 1fr);\n    padding: 24px;\n  }\n}\n\n/* Desktop — 1024px and up */\n@media (min-width: 1024px) {\n  .job-grid {\n    grid-template-columns: repeat(3, 1fr);\n    padding: 40px;\n  }\n}\n\n/* Large desktop — 1440px and up */\n@media (min-width: 1440px) {\n  .container { max-width: 1200px; margin: 0 auto; }\n}</code></pre><h3>Responsive Typography</h3><pre><code>/* Fluid font sizes using clamp() */\nh1 {\n  /* min: 24px, preferred: 5vw, max: 48px */\n  font-size: clamp(24px, 5vw, 48px);\n}\n\nbody {\n  font-size: clamp(14px, 2.5vw, 16px);\n}</code></pre><h3>Responsive Images</h3><pre><code>img {\n  max-width: 100%;\n  height: auto;\n  display: block;\n}\n\n/* Use different images for different screen sizes */\n&lt;picture&gt;\n  &lt;source media="(min-width: 1024px)" srcset="hero-desktop.webp"&gt;\n  &lt;source media="(min-width: 768px)" srcset="hero-tablet.webp"&gt;\n  &lt;img src="hero-mobile.webp" alt="Hero image" loading="lazy"&gt;\n&lt;/picture&gt;</code></pre><h3>Hamburger Menu Pattern</h3><pre><code>/* Mobile nav hidden by default */\n.nav-links {\n  display: none;\n  flex-direction: column;\n  position: absolute;\n  top: 64px;\n  left: 0;\n  right: 0;\n  background: white;\n  padding: 16px;\n  box-shadow: 0 4px 20px rgba(0,0,0,0.1);\n}\n\n.nav-links.open { display: flex; }\n\n/* Show inline on desktop */\n@media (min-width: 768px) {\n  .nav-links {\n    display: flex;\n    flex-direction: row;\n    position: static;\n    box-shadow: none;\n  }\n  .hamburger { display: none; }\n}</code></pre>'},
  {id:'wdf-6',title:'Deploy Your Website — Go Live',duration_mins:15,order_index:6,content:'<h2>Deploying Your Website to the World</h2><p>Building locally is great, but your website needs to be on the internet. Here is exactly how to go live — for free — in under 10 minutes.</p><h3>Option 1: Vercel (Recommended)</h3><p>Vercel is the industry standard for deploying HTML/JS/React sites. It is free, fast, and automatic.</p><ol><li><strong>Create a GitHub account</strong> at github.com</li><li><strong>Push your code</strong>: Create a new repository, upload your HTML/CSS/JS files</li><li><strong>Connect to Vercel</strong>: Go to vercel.com, sign in with GitHub</li><li><strong>Import your repository</strong>: Click "New Project" → select your repo → click "Deploy"</li><li><strong>Done!</strong> Your site is live at <code>yourproject.vercel.app</code></li></ol><p>Every time you push changes to GitHub, Vercel automatically redeploys in ~30 seconds.</p><h3>Custom Domain Setup</h3><pre><code>1. Buy domain from GoDaddy or BigRock (~₹500-800/year for .in)\n2. In Vercel: Project → Settings → Domains → Add Domain\n3. In GoDaddy DNS settings, add CNAME record:\n   Name: www\n   Value: cname.vercel-dns.com\n4. Wait 10-30 minutes for DNS to propagate\n5. Vercel auto-provisions HTTPS certificate (free)</code></pre><h3>Performance Checklist Before Going Live</h3><ul><li>✅ All images compressed (use squoosh.app or tinypng.com)</li><li>✅ Images in WebP format (30-50% smaller than JPEG)</li><li>✅ Viewport meta tag present</li><li>✅ Page loads in under 3 seconds on mobile (test at pagespeed.web.dev)</li><li>✅ No console errors in DevTools</li><li>✅ Works on Chrome, Firefox, and Safari</li><li>✅ Works on iPhone and Android screen sizes</li></ul><h3>SEO Basics</h3><pre><code>&lt;head&gt;\n  &lt;title&gt;Find Tech Jobs in Bangalore | Belongix&lt;/title&gt;\n  &lt;meta name="description" content="Browse 10,000+ verified tech jobs in Bangalore, Hyderabad, and Mumbai. Updated daily."&gt;\n  &lt;meta property="og:title" content="Find Tech Jobs in Bangalore"&gt;\n  &lt;meta property="og:image" content="https://belongix.in/og-image.png"&gt;\n  &lt;link rel="canonical" href="https://belongix.in"&gt;\n&lt;/head&gt;</code></pre><blockquote><strong>Action:</strong> Deploy your project to Vercel right now. Share the live URL. You are officially a web developer.</blockquote>'}

'python-development':[
  {id:'py-1',title:'Python Fundamentals — Variables, Types & Control Flow',duration_mins:25,order_index:1,is_free_preview:true,content:'<h2>Python — The Language That Runs the World</h2><p>Python powers Google, Instagram, Spotify, Swiggy, Razorpay, and thousands of Indian startups. It is the most in-demand language for data science, backend, and automation. And it is the easiest to learn.</p><h3>Why Python Dominates in India</h3><ul><li>Most data science and ML jobs require Python</li><li>Fastest growing language on GitHub for 5+ years</li><li>Readable syntax means faster development</li><li>Massive ecosystem: 400,000+ packages on PyPI</li><li>Bangalore ML engineer average: ₹22-35 LPA (2026)</li></ul><h3>Setup</h3><pre><code># Install Python from python.org (3.12+)\n# Verify installation\npython --version  # Python 3.12.x\n\n# Install pip packages\npip install requests pandas flask jupyter\n\n# Create a virtual environment (always do this)\npython -m venv venv\nsource venv/bin/activate  # Mac/Linux\nvenv\\Scripts\\activate     # Windows</code></pre><h3>Variables and Data Types</h3><pre><code># Strings\nname = "Keerthi"\ncity = "Bangalore"\nfull_name = f"{name} from {city}"  # f-string (most readable)\nprint(full_name)  # Keerthi from Bangalore\n\n# Numbers\nage = 26\nsalary_lpa = 22.5\nyears_to_double = salary_lpa / 2  # auto-float division\n\n# Booleans\nis_hired = True\nhas_experience = age > 2  # True\n\n# None (like null in other languages)\ncurrent_offer = None\n\n# Check type\nprint(type(name))     # &lt;class str&gt;\nprint(type(salary_lpa)) # &lt;class float&gt;</code></pre><h3>Collections</h3><pre><code># List — ordered, mutable, allows duplicates\nskills = ["Python", "SQL", "ML", "Django"]\nskills.append("AWS")           # add to end\nskills.insert(0, "Leadership") # add at index\nskills.remove("SQL")           # remove by value\nprint(skills[0])               # first item\nprint(skills[-1])              # last item\nprint(skills[1:3])             # slice [1, 2]\n\n# Dictionary — key:value pairs\nprofile = {\n    "name": "Keerthi",\n    "city": "Bangalore",\n    "salary_lpa": 22,\n    "skills": ["Python", "ML"]\n}\nprint(profile["name"])          # Keerthi\nprint(profile.get("age", 0))   # safe get, default 0\nprofile["experience"] = 3       # add new key\n\n# Tuple — ordered, immutable\ncoordinates = (12.9716, 77.5946)  # Bangalore lat/lng\nlat, lng = coordinates  # unpacking\n\n# Set — unique values only\nunique_skills = {"Python", "Python", "ML", "Python"}\nprint(unique_skills)  # {"Python", "ML"}</code></pre><h3>Control Flow</h3><pre><code># Conditionals\nif salary_lpa > 30:\n    print("Senior level")\nelif salary_lpa > 20:\n    print("Mid level")\nelif salary_lpa > 10:\n    print("Junior level")\nelse:\n    print("Fresher")\n\n# Loops\nfor skill in skills:\n    print(f"I know {skill}")\n\n# While loop\nattempt = 0\nwhile attempt < 3:\n    password = input("Enter password: ")\n    if password == "correct": break\n    attempt += 1\n\n# List comprehension (Python superpower)\nhigh_paying = [j for j in jobs if j["salary"] > 20]\nbangalore_jobs = [j["title"] for j in jobs if j["city"] == "Bangalore"]\nsalaries = {j["company"]: j["salary"] for j in jobs}</code></pre>'},
  {id:'py-2',title:'Functions, OOP and Modules',duration_mins:25,order_index:2,content:'<h2>Functions and Object-Oriented Programming</h2><h3>Functions — Reusable Blocks of Code</h3><pre><code># Basic function\ndef calculate_tax(income_lpa):\n    """Calculate income tax under new regime (India 2026)"""\n    if income_lpa <= 7:\n        return 0\n    elif income_lpa <= 10:\n        return income_lpa * 0.05\n    elif income_lpa <= 12:\n        return income_lpa * 0.10\n    else:\n        return income_lpa * 0.15\n\n# Default parameters\ndef create_profile(name, city="Bangalore", experience=0):\n    return {"name": name, "city": city, "exp": experience}\n\n# *args — variable positional arguments\ndef total_salary(*components):\n    return sum(components)\n\ntotal = total_salary(18, 4, 2, 1)  # base + HRA + TA + bonus\n\n# **kwargs — variable keyword arguments\ndef create_job(**details):\n    return details\n\njob = create_job(title="SDE-2", company="Flipkart", salary=28)\n\n# Return multiple values\ndef analyze_salary(salary_list):\n    return min(salary_list), max(salary_list), sum(salary_list)/len(salary_list)\n\nlow, high, avg = analyze_salary([18, 22, 28, 35, 45])</code></pre><h3>Lambda Functions</h3><pre><code># Single-expression functions\ndouble = lambda x: x * 2\nsort_key = lambda job: job["salary"]\n\n# Used heavily with sorted(), filter(), map()\njobs_sorted = sorted(jobs, key=lambda j: j["salary"], reverse=True)\nhigh_pay = list(filter(lambda j: j["salary"] > 25, jobs))\nsalaries = list(map(lambda j: j["salary"], jobs))</code></pre><h3>Object-Oriented Programming</h3><pre><code>class JobSeeker:\n    # Class variable — shared by all instances\n    platform = "Belongix"\n\n    def __init__(self, name, city, experience):\n        # Instance variables — unique to each object\n        self.name = name\n        self.city = city\n        self.experience = experience\n        self.applications = []\n        self._score = 0  # _ means "private by convention"\n\n    def apply(self, job_title, company):\n        """Apply to a job and track it"""\n        application = {\n            "job": job_title,\n            "company": company,\n            "status": "Applied"\n        }\n        self.applications.append(application)\n        self._score += 10\n        print(f"{self.name} applied to {job_title} at {company}")\n\n    @property\n    def career_score(self):\n        """Getter for score"""\n        return self._score\n\n    def __str__(self):\n        return f"{self.name} | {self.city} | {self.experience} yrs | Score: {self._score}"\n\n\nclass SeniorSeeker(JobSeeker):\n    """Inherits from JobSeeker"""\n    def __init__(self, name, city, experience, leadership_skills):\n        super().__init__(name, city, experience)\n        self.leadership_skills = leadership_skills\n\n    def apply(self, job_title, company):\n        """Override parent method"""\n        super().apply(job_title, company)  # call parent\n        self._score += 5  # bonus for senior\n\n\nkeerthi = JobSeeker("Keerthi", "Bangalore", 3)\nkeerthi.apply("SDE-2", "Flipkart")\nprint(keerthi)  # Keerthi | Bangalore | 3 yrs | Score: 10</code></pre><h3>Modules and Packages</h3><pre><code># Import built-in modules\nimport os\nimport json\nimport datetime\nfrom pathlib import Path\nfrom collections import defaultdict, Counter\n\n# Import installed packages\nimport requests\nimport pandas as pd\nimport numpy as np\n\n# Import from your own files\nfrom utils import format_salary, validate_email\nfrom models.job import Job, JobApplication\n\n# Common patterns\ntoday = datetime.date.today()\nfile_path = Path("data") / "jobs.json"\n\nwith open(file_path) as f:\n    jobs = json.load(f)\n\ncount = Counter(j["city"] for j in jobs)\nprint(count.most_common(5))  # top 5 cities</code></pre>'},
  {id:'py-3',title:'File Handling, Error Handling & APIs',duration_mins:25,order_index:3,content:'<h2>File Operations, Exceptions, and External APIs</h2><h3>File Handling</h3><pre><code>import json\nimport csv\nfrom pathlib import Path\n\n# Reading text files — always use context manager (with)\nwith open("jobs.txt", "r", encoding="utf-8") as f:\n    content = f.read()           # entire file as string\n    lines = content.splitlines() # list of lines\n\n# Writing files\nwith open("report.txt", "w", encoding="utf-8") as f:\n    f.write("Daily Job Report\\n")\n    f.write(f"Total jobs: {len(jobs)}\\n")\n\n# Appending (does not overwrite)\nwith open("log.txt", "a") as f:\n    f.write(f"{datetime.now()}: New user registered\\n")\n\n# JSON files — most common for web data\nwith open("jobs.json", "r") as f:\n    jobs = json.load(f)  # JSON string → Python dict/list\n\nwith open("jobs.json", "w") as f:\n    json.dump(jobs, f, indent=2, ensure_ascii=False)  # Python → JSON\n\n# CSV files\nwith open("salaries.csv", "r") as f:\n    reader = csv.DictReader(f)\n    for row in reader:\n        print(row["role"], row["salary"])\n\nwith open("output.csv", "w", newline="") as f:\n    writer = csv.DictWriter(f, fieldnames=["name","salary","city"])\n    writer.writeheader()\n    writer.writerows(data)</code></pre><h3>Exception Handling — Graceful Error Management</h3><pre><code># Basic try/except\ntry:\n    salary = int(input("Enter salary: "))\n    tax = calculate_tax(salary)\nexcept ValueError:\n    print("Please enter a valid number")\nexcept ZeroDivisionError:\n    print("Cannot divide by zero")\nexcept Exception as e:\n    print(f"Unexpected error: {e}")\nfinally:\n    print("This always runs")  # cleanup code\n\n# Custom exceptions\nclass SalaryTooLowError(Exception):\n    def __init__(self, salary, minimum):\n        self.salary = salary\n        super().__init__(f"Salary {salary} is below minimum {minimum}")\n\ndef validate_job_posting(salary):\n    if salary < 3:\n        raise SalaryTooLowError(salary, 3)\n    return True\n\ntry:\n    validate_job_posting(2.5)\nexcept SalaryTooLowError as e:\n    print(e)  # Salary 2.5 is below minimum 3</code></pre><h3>Calling REST APIs</h3><pre><code">import requests\n\n# GET request — fetch data\ndef fetch_bangalore_jobs():\n    url = "https://api.belongix.in/jobs"\n    params = {"city": "Bangalore", "limit": 50}\n    headers = {"Authorization": "Bearer YOUR_TOKEN"}\n\n    try:\n        response = requests.get(url, params=params, headers=headers, timeout=10)\n        response.raise_for_status()  # raises exception for 4xx/5xx\n        return response.json()\n    except requests.exceptions.Timeout:\n        print("Request timed out")\n        return []\n    except requests.exceptions.HTTPError as e:\n        print(f"HTTP error: {e.response.status_code}")\n        return []\n\n# POST request — send data\ndef apply_to_job(job_id, applicant_data):\n    response = requests.post(\n        f"https://api.belongix.in/apply/{job_id}",\n        json=applicant_data,  # auto-sets Content-Type: application/json\n        headers={"Authorization": "Bearer TOKEN"}\n    )\n    if response.status_code == 201:\n        print("Application submitted!")\n        return response.json()\n    return None\n\n# Using sessions for multiple requests (reuses connection)\nwith requests.Session() as session:\n    session.headers.update({"Authorization": "Bearer TOKEN"})\n    jobs = session.get("/jobs").json()\n    companies = session.get("/companies").json()</code></pre>'},
  {id:'py-4',title:'pandas — Data Analysis for Real Problems',duration_mins:30,order_index:4,content:'<h2>pandas — Python for Data</h2><p>pandas is used by every data analyst and scientist. It makes working with tabular data as easy as Excel, but 100x more powerful.</p><h3>Loading and Exploring Data</h3><pre><code>import pandas as pd\nimport numpy as np\n\n# Load data\ndf = pd.read_csv("india_tech_salaries_2026.csv")\ndf = pd.read_excel("job_listings.xlsx", sheet_name="Sheet1")\ndf = pd.read_json("https://api.belongix.in/jobs")\n\n# First look at data\nprint(df.shape)        # (rows, columns)\nprint(df.head(10))     # first 10 rows\nprint(df.tail(5))      # last 5 rows\nprint(df.info())       # column types and null counts\nprint(df.describe())   # statistics: mean, std, min, max\nprint(df.columns.tolist())  # column names\nprint(df.dtypes)       # data types of each column\nprint(df.isnull().sum()) # count nulls per column</code></pre><h3>Selecting and Filtering</h3><pre><code># Select a column (returns Series)\nprint(df["salary_lpa"])\n\n# Select multiple columns (returns DataFrame)\nsubset = df[["role", "company", "city", "salary_lpa"]]\n\n# Filter rows\nbangalore = df[df["city"] == "Bangalore"]\nhigh_pay = df[df["salary_lpa"] > 25]\nsenior_devs = df[(df["experience"] >= 5) & (df["role"].str.contains("Senior"))]\nno_service = df[~df["company"].isin(["TCS", "Infosys", "Wipro", "HCL"])]\n\n# String filtering\nml_jobs = df[df["role"].str.lower().str.contains("machine learning|data sci")]\nbangalore_or_mumbai = df[df["city"].isin(["Bangalore", "Mumbai"])]\n\n# loc — label-based (row_label, column_label)\nrow = df.loc[5, "salary_lpa"]\nsubset = df.loc[df["city"] == "Bangalore", ["role", "salary_lpa"]]\n\n# iloc — position-based (row_number, column_number)\nfirst_row = df.iloc[0]\nfirst_5_rows = df.iloc[:5]\nspecific_cell = df.iloc[3, 2]</code></pre><h3>Grouping and Aggregation</h3><pre><code># Average salary by city\ncity_avg = df.groupby("city")["salary_lpa"].mean().sort_values(ascending=False)\nprint(city_avg)\n# Bangalore    28.3\n# Mumbai       25.1\n# Hyderabad    22.4\n# Pune         20.1\n\n# Multiple aggregations\nstats = df.groupby(["city", "experience_band"]).agg(\n    avg_salary=("salary_lpa", "mean"),\n    max_salary=("salary_lpa", "max"),\n    job_count=("role", "count")\n).round(2)\n\n# Pivot tables\npivot = df.pivot_table(\n    values="salary_lpa",\n    index="city",\n    columns="experience_band",\n    aggfunc="median"\n)\n\n# Value counts\nprint(df["city"].value_counts())\nprint(df["role"].value_counts(normalize=True))  # percentages</code></pre><h3>Cleaning Data</h3><pre><code># Handle missing values\ndf.dropna(subset=["salary_lpa"])      # drop rows where salary is null\ndf["city"].fillna("Unknown", inplace=True)\ndf["salary_lpa"].fillna(df["salary_lpa"].median(), inplace=True)\n\n# Remove duplicates\ndf.drop_duplicates(subset=["company", "role", "city"], inplace=True)\n\n# Rename columns\ndf.rename(columns={"sal": "salary_lpa", "exp": "experience"}, inplace=True)\n\n# Change data types\ndf["salary_lpa"] = pd.to_numeric(df["salary_lpa"], errors="coerce")\ndf["posted_date"] = pd.to_datetime(df["posted_date"])\ndf["city"] = df["city"].str.strip().str.title()  # clean strings\n\n# Feature engineering\ndf["salary_monthly"] = df["salary_lpa"] * 100000 / 12\ndf["is_senior"] = df["experience"] >= 5\ndf["days_since_posted"] = (pd.Timestamp.now() - df["posted_date"]).dt.days</code></pre>'},
  {id:'py-5',title:'Building REST APIs with Flask & FastAPI',duration_mins:25,order_index:5,content:'<h2>Building Web APIs with Python</h2><h3>Flask — Lightweight and Simple</h3><pre><code>from flask import Flask, jsonify, request, abort\nfrom functools import wraps\n\napp = Flask(__name__)\n\n# Sample data (replace with database)\njobs = [\n    {"id": 1, "title": "SDE-2", "company": "Flipkart", "city": "Bangalore", "salary": 28},\n    {"id": 2, "title": "Data Scientist", "company": "Swiggy", "city": "Bangalore", "salary": 25},\n]\n\n# GET all jobs with filtering\n@app.route("/api/jobs", methods=["GET"])\ndef get_jobs():\n    city = request.args.get("city")\n    min_salary = request.args.get("min_salary", type=float)\n\n    result = jobs\n    if city:\n        result = [j for j in result if j["city"] == city]\n    if min_salary:\n        result = [j for j in result if j["salary"] >= min_salary]\n\n    return jsonify({"data": result, "count": len(result)})\n\n# GET single job\n@app.route("/api/jobs/&lt;int:job_id&gt;", methods=["GET"])\ndef get_job(job_id):\n    job = next((j for j in jobs if j["id"] == job_id), None)\n    if not job:\n        abort(404, description="Job not found")\n    return jsonify(job)\n\n# POST — create job\n@app.route("/api/jobs", methods=["POST"])\ndef create_job():\n    data = request.get_json()\n    if not data or not data.get("title"):\n        abort(400, description="title is required")\n    new_job = {"id": len(jobs) + 1, **data}\n    jobs.append(new_job)\n    return jsonify(new_job), 201\n\n# Error handlers\n@app.errorhandler(404)\ndef not_found(e):\n    return jsonify({"error": str(e)}), 404\n\nif __name__ == "__main__":\n    app.run(debug=True, port=5000)</code></pre><h3>FastAPI — Modern, Fast, Typed</h3><pre><code>from fastapi import FastAPI, HTTPException, Query\nfrom pydantic import BaseModel\nfrom typing import Optional\n\napp = FastAPI(title="Belongix Jobs API", version="1.0.0")\n\nclass Job(BaseModel):\n    title: str\n    company: str\n    city: str\n    salary_lpa: float\n    skills: list[str] = []\n\nclass JobResponse(Job):\n    id: int\n\n@app.get("/jobs", response_model=list[JobResponse])\nasync def get_jobs(\n    city: Optional[str] = Query(None),\n    min_salary: Optional[float] = Query(None, ge=0)\n):\n    result = db_jobs\n    if city: result = [j for j in result if j.city == city]\n    if min_salary: result = [j for j in result if j.salary_lpa >= min_salary]\n    return result\n\n@app.post("/jobs", response_model=JobResponse, status_code=201)\nasync def create_job(job: Job):\n    new_job = {"id": len(db_jobs) + 1, **job.dict()}\n    db_jobs.append(new_job)\n    return new_job\n\n# Run: uvicorn main:app --reload\n# Auto-generates docs at localhost:8000/docs</code></pre>'},
  {id:'py-6',title:'Django — Full-Featured Web Framework',duration_mins:25,order_index:6,content:'<h2>Django — The Complete Web Framework</h2><p>Django is used by Instagram, Pinterest, Disqus, and hundreds of Indian startups. It follows "batteries included" — everything you need is built in.</p><h3>Setup and Project Structure</h3><pre><code>pip install django djangorestframework\n\ndjango-admin startproject belongix_project\ncd belongix_project\npython manage.py startapp jobs\n\n# Project structure:\n# belongix_project/\n#   manage.py\n#   belongix_project/\n#     settings.py      — configuration\n#     urls.py          — root URL routing\n#   jobs/\n#     models.py        — database models\n#     views.py         — request handlers\n#     urls.py          — app URL routing\n#     serializers.py   — API serializers\n#     admin.py         — admin panel config</code></pre><h3>Models — Database Schema in Python</h3><pre><code">from django.db import models\nfrom django.contrib.auth.models import User\n\nclass Company(models.Model):\n    name = models.CharField(max_length=200)\n    website = models.URLField(blank=True)\n    city = models.CharField(max_length=100)\n    created_at = models.DateTimeField(auto_now_add=True)\n\n    def __str__(self): return self.name\n\nclass Job(models.Model):\n    EXPERIENCE_CHOICES = [(0,"Fresher"),(2,"2+ years"),(5,"5+ years")]\n\n    company = models.ForeignKey(Company, on_delete=models.CASCADE, related_name="jobs")\n    title = models.CharField(max_length=200)\n    description = models.TextField()\n    salary_min = models.IntegerField()  # in LPA\n    salary_max = models.IntegerField()\n    city = models.CharField(max_length=100)\n    skills = models.JSONField(default=list)\n    experience_required = models.IntegerField(choices=EXPERIENCE_CHOICES)\n    is_active = models.BooleanField(default=True)\n    posted_at = models.DateTimeField(auto_now_add=True)\n\n    class Meta:\n        ordering = ["-posted_at"]\n        indexes = [models.Index(fields=["city", "is_active"])]\n\n# Run migrations\n# python manage.py makemigrations\n# python manage.py migrate</code></pre><h3>Django REST Framework — Build APIs</h3><pre><code">from rest_framework import serializers, viewsets, filters\nfrom rest_framework.permissions import IsAuthenticatedOrReadOnly\nfrom django_filters.rest_framework import DjangoFilterBackend\n\nclass JobSerializer(serializers.ModelSerializer):\n    company_name = serializers.CharField(source="company.name", read_only=True)\n\n    class Meta:\n        model = Job\n        fields = ["id","title","company_name","city","salary_min","salary_max","skills"]\n\nclass JobViewSet(viewsets.ModelViewSet):\n    queryset = Job.objects.filter(is_active=True).select_related("company")\n    serializer_class = JobSerializer\n    permission_classes = [IsAuthenticatedOrReadOnly]\n    filter_backends = [DjangoFilterBackend, filters.SearchFilter]\n    filterset_fields = ["city", "experience_required"]\n    search_fields = ["title", "skills", "company__name"]\n\n# urls.py\nfrom rest_framework.routers import DefaultRouter\nrouter = DefaultRouter()\nrouter.register("jobs", JobViewSet)\nurlpatterns = router.urls\n# This creates: GET /jobs/, POST /jobs/, GET /jobs/1/, PUT /jobs/1/, DELETE /jobs/1/</code></pre>'},
  {id:'py-7',title:'Deploy Python Apps & Career Path',duration_mins:20,order_index:7,content:'<h2>Deploying Python to Production</h2><h3>Render.com (Free Tier Available)</h3><pre><code># requirements.txt — pin all versions\nflask==3.0.3\ngunicorn==21.2.0\nrequests==2.31.0\npandas==2.2.0\npsycopg2-binary==2.9.9\npython-dotenv==1.0.0\n\n# Procfile — tells Render how to start your app\nweb: gunicorn app:app\n\n# .env.example — share this, not .env\nDATABASE_URL=postgresql://...\nSECRET_KEY=your-secret-key\nFLASK_ENV=production</code></pre><h3>Environment Variables and Secrets</h3><pre><code">from dotenv import load_dotenv\nimport os\n\nload_dotenv()  # loads .env file in development\n\nDATABASE_URL = os.environ.get("DATABASE_URL")\nSECRET_KEY = os.environ.get("SECRET_KEY")\nDEBUG = os.environ.get("DEBUG", "False") == "True"\n\n# Never hardcode secrets! Always use environment variables</code></pre><h3>Testing Your Code</h3><pre><code">import pytest\nfrom app import app, calculate_tax\n\n# Unit tests\ndef test_calculate_tax_fresher():\n    assert calculate_tax(6) == 0  # below 7 LPA — no tax\n\ndef test_calculate_tax_mid():\n    assert calculate_tax(9) == 9 * 0.05\n\n# API tests with pytest\n@pytest.fixture\ndef client():\n    app.config["TESTING"] = True\n    return app.test_client()\n\ndef test_get_jobs(client):\n    response = client.get("/api/jobs")\n    assert response.status_code == 200\n    data = response.get_json()\n    assert "data" in data\n    assert isinstance(data["data"], list)\n\n# Run: pytest tests/ -v --cov=app</code></pre><h3>Python Career Path in India 2026</h3><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:10px;border:1px solid #ddd">Role</th><th style="padding:10px;border:1px solid #ddd">Experience</th><th style="padding:10px;border:1px solid #ddd">Salary (Bangalore)</th></tr><tr><td style="padding:10px;border:1px solid #ddd">Python Developer</td><td style="padding:10px;border:1px solid #ddd">0-2 years</td><td style="padding:10px;border:1px solid #ddd">₹6-14 LPA</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Python Backend Engineer</td><td style="padding:10px;border:1px solid #ddd">2-5 years</td><td style="padding:10px;border:1px solid #ddd">₹14-30 LPA</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Senior Python Engineer</td><td style="padding:10px;border:1px solid #ddd">5-8 years</td><td style="padding:10px;border:1px solid #ddd">₹28-50 LPA</td></tr><tr><td style="padding:10px;border:1px solid #ddd">ML/Data Science Engineer</td><td style="padding:10px;border:1px solid #ddd">3+ years</td><td style="padding:10px;border:1px solid #ddd">₹22-55 LPA</td></tr></table><p><strong>Top companies hiring Python in India:</strong> Flipkart, Swiggy, Zomato, CRED, Razorpay, PhonePe, Freshworks, Zoho, Amazon India, Google India</p><blockquote><strong>Your next step:</strong> Build a REST API that reads job listings from a CSV, filters by city/salary, and returns JSON. Deploy to Render. This is your portfolio project.</blockquote>'}

'dsa-fundamentals':[
  {id:'dsa-1',title:'Big O Notation & Arrays',duration_mins:25,order_index:1,is_free_preview:true,content:'<h2>Complexity Analysis & Arrays</h2><p>Before solving problems, you need to analyze how efficient your solution is. Big O notation describes how runtime or memory grows as input size grows.</p><h3>Big O — Time Complexity</h3><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:10px;border:1px solid #ddd">Complexity</th><th style="padding:10px;border:1px solid #ddd">Name</th><th style="padding:10px;border:1px solid #ddd">Example</th><th style="padding:10px;border:1px solid #ddd">n=1000 ops</th></tr><tr><td style="padding:10px;border:1px solid #ddd">O(1)</td><td style="padding:10px;border:1px solid #ddd">Constant</td><td style="padding:10px;border:1px solid #ddd">Array lookup by index</td><td style="padding:10px;border:1px solid #ddd">1</td></tr><tr><td style="padding:10px;border:1px solid #ddd">O(log n)</td><td style="padding:10px;border:1px solid #ddd">Logarithmic</td><td style="padding:10px;border:1px solid #ddd">Binary search</td><td style="padding:10px;border:1px solid #ddd">10</td></tr><tr><td style="padding:10px;border:1px solid #ddd">O(n)</td><td style="padding:10px;border:1px solid #ddd">Linear</td><td style="padding:10px;border:1px solid #ddd">Loop through array</td><td style="padding:10px;border:1px solid #ddd">1,000</td></tr><tr><td style="padding:10px;border:1px solid #ddd">O(n log n)</td><td style="padding:10px;border:1px solid #ddd">Linearithmic</td><td style="padding:10px;border:1px solid #ddd">Merge sort</td><td style="padding:10px;border:1px solid #ddd">10,000</td></tr><tr><td style="padding:10px;border:1px solid #ddd">O(n²)</td><td style="padding:10px;border:1px solid #ddd">Quadratic</td><td style="padding:10px;border:1px solid #ddd">Nested loops</td><td style="padding:10px;border:1px solid #ddd">1,000,000</td></tr><tr><td style="padding:10px;border:1px solid #ddd">O(2ⁿ)</td><td style="padding:10px;border:1px solid #ddd">Exponential</td><td style="padding:10px;border:1px solid #ddd">Recursive Fibonacci</td><td style="padding:10px;border:1px solid #ddd">2^1000 (unusable)</td></tr></table><h3>Array Patterns — Two Pointers</h3><pre><code">def two_sum_sorted(nums, target):\n    """O(n) time, O(1) space — array must be sorted"""\n    left, right = 0, len(nums) - 1\n    while left < right:\n        current = nums[left] + nums[right]\n        if current == target:\n            return [left, right]\n        elif current < target:\n            left += 1\n        else:\n            right -= 1\n    return []\n\n# Reverse array in-place O(n) time O(1) space\ndef reverse(arr):\n    left, right = 0, len(arr) - 1\n    while left < right:\n        arr[left], arr[right] = arr[right], arr[left]\n        left += 1; right -= 1\n\n# Valid palindrome\ndef is_palindrome(s):\n    s = "".join(c.lower() for c in s if c.isalnum())\n    l, r = 0, len(s) - 1\n    while l < r:\n        if s[l] != s[r]: return False\n        l += 1; r -= 1\n    return True</code></pre><h3>Sliding Window Pattern</h3><pre><code">def max_sum_subarray(arr, k):\n    """Max sum of k consecutive elements — O(n)"""\n    if len(arr) < k: return 0\n    window_sum = sum(arr[:k])\n    max_sum = window_sum\n    for i in range(k, len(arr)):\n        window_sum += arr[i] - arr[i - k]\n        max_sum = max(max_sum, window_sum)\n    return max_sum\n\ndef longest_unique_substring(s):\n    """O(n) — find longest substring without repeating chars"""\n    char_index = {}\n    max_len = 0\n    left = 0\n    for right, char in enumerate(s):\n        if char in char_index and char_index[char] >= left:\n            left = char_index[char] + 1\n        char_index[char] = right\n        max_len = max(max_len, right - left + 1)\n    return max_len</code></pre>'},
  {id:'dsa-2',title:'Linked Lists',duration_mins:25,order_index:2,content:'<h2>Linked Lists — The Foundation of Dynamic Data</h2><pre><code">class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nclass LinkedList:\n    def __init__(self):\n        self.head = None\n\n    def append(self, val):\n        if not self.head:\n            self.head = ListNode(val)\n            return\n        curr = self.head\n        while curr.next:\n            curr = curr.next\n        curr.next = ListNode(val)\n\n    def to_list(self):\n        result = []\n        curr = self.head\n        while curr:\n            result.append(curr.val)\n            curr = curr.next\n        return result\n\n# Reverse a linked list\ndef reverse_list(head):\n    prev = None\n    curr = head\n    while curr:\n        next_node = curr.next\n        curr.next = prev\n        prev = curr\n        curr = next_node\n    return prev\n\n# Detect cycle (Floyd cycle detection)\ndef has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow == fast:\n            return True\n    return False\n\n# Find middle of linked list\ndef find_middle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n    return slow\n\n# Merge two sorted lists\ndef merge_sorted_lists(l1, l2):\n    dummy = ListNode(0)\n    curr = dummy\n    while l1 and l2:\n        if l1.val <= l2.val:\n            curr.next = l1; l1 = l1.next\n        else:\n            curr.next = l2; l2 = l2.next\n        curr = curr.next\n    curr.next = l1 or l2\n    return dummy.next</code></pre>'},
  {id:'dsa-3',title:'Stacks, Queues & Hash Maps',duration_mins:25,order_index:3,content:'<h2>Stacks, Queues and Hash Maps</h2><h3>Stack (LIFO) and Applications</h3><pre><code">from collections import deque\n\n# Python list as stack\nstack = []\nstack.append(1)  # push\nstack.append(2)\nstack.pop()       # returns 2\n\n# Valid parentheses\ndef is_valid(s):\n    stack = []\n    mapping = {")": "(", "}": "{", "]": "["}\n    for char in s:\n        if char in mapping:\n            top = stack.pop() if stack else "#"\n            if mapping[char] != top:\n                return False\n        else:\n            stack.append(char)\n    return not stack\n\n# Min Stack\nclass MinStack:\n    def __init__(self):\n        self.stack = []\n        self.min_stack = []\n\n    def push(self, val):\n        self.stack.append(val)\n        min_val = min(val, self.min_stack[-1] if self.min_stack else val)\n        self.min_stack.append(min_val)\n\n    def pop(self): self.stack.pop(); self.min_stack.pop()\n    def get_min(self): return self.min_stack[-1]</code></pre><h3>Queue and BFS Pattern</h3><pre><code">from collections import deque\n\nqueue = deque()\nqueue.append(1)   # enqueue right\nqueue.appendleft(0)  # enqueue left\nqueue.popleft()   # dequeue (O(1) unlike list.pop(0))\n\n# BFS pattern (used with graphs and trees)\ndef bfs(graph, start):\n    visited = set([start])\n    queue = deque([start])\n    order = []\n    while queue:\n        node = queue.popleft()\n        order.append(node)\n        for neighbor in graph[node]:\n            if neighbor not in visited:\n                visited.add(neighbor)\n                queue.append(neighbor)\n    return order</code></pre><h3>Hash Maps — O(1) Lookups</h3><pre><code"># Two Sum using hash map — O(n)\ndef two_sum(nums, target):\n    seen = {}  # value: index\n    for i, num in enumerate(nums):\n        complement = target - num\n        if complement in seen:\n            return [seen[complement], i]\n        seen[num] = i\n    return []\n\n# Group anagrams\ndef group_anagrams(strs):\n    groups = {}\n    for s in strs:\n        key = tuple(sorted(s))\n        groups.setdefault(key, []).append(s)\n    return list(groups.values())\n\n# Frequency counter pattern\nfrom collections import Counter\n\ndef top_k_frequent(nums, k):\n    count = Counter(nums)\n    return [x for x, _ in count.most_common(k)]</code></pre>'},
  {id:'dsa-4',title:'Trees & Binary Search Trees',duration_mins:30,order_index:4,content:'<h2>Trees — The Most Asked Topic in Indian Interviews</h2><pre><code">class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val; self.left = left; self.right = right\n\n# Build tree from list\ndef build_tree(vals):\n    if not vals: return None\n    root = TreeNode(vals[0])\n    queue = deque([root])\n    i = 1\n    while queue and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); queue.append(node.right)\n        i += 1\n    return root\n\n# Traversals\ndef inorder(root):   # Left Root Right — sorted order for BST\n    return inorder(root.left) + [root.val] + inorder(root.right) if root else []\n\ndef preorder(root):  # Root Left Right\n    return [root.val] + preorder(root.left) + preorder(root.right) if root else []\n\ndef postorder(root): # Left Right Root\n    return postorder(root.left) + postorder(root.right) + [root.val] if root else []\n\ndef level_order(root):  # BFS\n    if not root: return []\n    result, queue = [], deque([root])\n    while queue:\n        level = []\n        for _ in range(len(queue)):\n            node = queue.popleft()\n            level.append(node.val)\n            if node.left: queue.append(node.left)\n            if node.right: queue.append(node.right)\n        result.append(level)\n    return result\n\n# Max depth\ndef max_depth(root):\n    if not root: return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))\n\n# Is balanced\ndef is_balanced(root):\n    def height(node):\n        if not node: return 0\n        left = height(node.left)\n        if left == -1: return -1\n        right = height(node.right)\n        if right == -1: return -1\n        if abs(left - right) > 1: return -1\n        return 1 + max(left, right)\n    return height(root) != -1\n\n# Lowest Common Ancestor\ndef lca(root, p, q):\n    if not root or root == p or root == q: return root\n    left = lca(root.left, p, q)\n    right = lca(root.right, p, q)\n    return root if left and right else left or right</code></pre>'},
  {id:'dsa-5',title:'Graphs — BFS, DFS & Shortest Path',duration_mins:30,order_index:5,content:'<h2>Graphs — Networks of Nodes</h2><pre><code">from collections import defaultdict, deque\n\nclass Graph:\n    def __init__(self, directed=False):\n        self.adj = defaultdict(list)\n        self.directed = directed\n\n    def add_edge(self, u, v, weight=1):\n        self.adj[u].append((v, weight))\n        if not self.directed:\n            self.adj[v].append((u, weight))\n\n    def dfs(self, start):\n        """Depth First Search — explore deep first"""\n        visited = set()\n        result = []\n        def _dfs(node):\n            visited.add(node)\n            result.append(node)\n            for neighbor, _ in self.adj[node]:\n                if neighbor not in visited:\n                    _dfs(neighbor)\n        _dfs(start)\n        return result\n\n    def bfs(self, start):\n        """Breadth First Search — explore level by level"""\n        visited = set([start])\n        queue = deque([start])\n        result = []\n        while queue:\n            node = queue.popleft()\n            result.append(node)\n            for neighbor, _ in self.adj[node]:\n                if neighbor not in visited:\n                    visited.add(neighbor)\n                    queue.append(neighbor)\n        return result\n\n# Number of islands (grid DFS)\ndef num_islands(grid):\n    if not grid: return 0\n    rows, cols = len(grid), len(grid[0])\n    count = 0\n\n    def dfs(r, c):\n        if r < 0 or r >= rows or c < 0 or c >= cols or grid[r][c] == "0":\n            return\n        grid[r][c] = "0"  # mark visited\n        for dr, dc in [(1,0),(-1,0),(0,1),(0,-1)]:\n            dfs(r+dr, c+dc)\n\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == "1":\n                dfs(r, c)\n                count += 1\n    return count\n\n# Dijkstra shortest path\nimport heapq\n\ndef dijkstra(graph_adj, start):\n    dist = {node: float("inf") for node in graph_adj}\n    dist[start] = 0\n    heap = [(0, start)]\n    while heap:\n        d, u = heapq.heappop(heap)\n        if d > dist[u]: continue\n        for v, w in graph_adj[u]:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n                heapq.heappush(heap, (dist[v], v))\n    return dist</code></pre>'},
  {id:'dsa-6',title:'Recursion & Dynamic Programming',duration_mins:35,order_index:6,content:'<h2>Dynamic Programming — The Hardest, Most Asked Topic</h2><h3>Recursion First</h3><pre><code">def fibonacci(n):\n    if n <= 1: return n\n    return fibonacci(n-1) + fibonacci(n-2)  # O(2^n) — too slow!\n\n# Memoization — cache results\ndef fib_memo(n, memo={}):\n    if n in memo: return memo[n]\n    if n <= 1: return n\n    memo[n] = fib_memo(n-1, memo) + fib_memo(n-2, memo)\n    return memo[n]  # O(n) time, O(n) space\n\n# Bottom-up DP (tabulation)\ndef fib_dp(n):\n    if n <= 1: return n\n    dp = [0] * (n + 1)\n    dp[1] = 1\n    for i in range(2, n + 1):\n        dp[i] = dp[i-1] + dp[i-2]\n    return dp[n]  # O(n) time, O(n) space\n\n# Space optimized\ndef fib_optimal(n):\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a  # O(n) time, O(1) space</code></pre><h3>Classic DP Problems</h3><pre><code"># 1. Climbing Stairs (how many ways to reach n steps, 1 or 2 at a time)\ndef climb_stairs(n):\n    if n <= 2: return n\n    a, b = 1, 2\n    for _ in range(n - 2):\n        a, b = b, a + b\n    return b\n\n# 2. 0/1 Knapsack\ndef knapsack(weights, values, capacity):\n    n = len(weights)\n    dp = [[0] * (capacity + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        for w in range(capacity + 1):\n            dp[i][w] = dp[i-1][w]\n            if weights[i-1] <= w:\n                dp[i][w] = max(dp[i][w], dp[i-1][w-weights[i-1]] + values[i-1])\n    return dp[n][capacity]\n\n# 3. Longest Common Subsequence\ndef lcs(s1, s2):\n    m, n = len(s1), len(s2)\n    dp = [[0] * (n+1) for _ in range(m+1)]\n    for i in range(1, m+1):\n        for j in range(1, n+1):\n            if s1[i-1] == s2[j-1]:\n                dp[i][j] = dp[i-1][j-1] + 1\n            else:\n                dp[i][j] = max(dp[i-1][j], dp[i][j-1])\n    return dp[m][n]\n\n# 4. Coin Change — minimum coins to make amount\ndef coin_change(coins, amount):\n    dp = [float("inf")] * (amount + 1)\n    dp[0] = 0\n    for coin in coins:\n        for x in range(coin, amount + 1):\n            dp[x] = min(dp[x], dp[x - coin] + 1)\n    return dp[amount] if dp[amount] != float("inf") else -1</code></pre>'},
  {id:'dsa-7',title:'Sorting & Searching Algorithms',duration_mins:25,order_index:7,content:'<h2>Sorting and Searching — Interview Essentials</h2><pre><code"># Merge Sort — O(n log n) always\ndef merge_sort(arr):\n    if len(arr) <= 1: return arr\n    mid = len(arr) // 2\n    left = merge_sort(arr[:mid])\n    right = merge_sort(arr[mid:])\n    return merge(left, right)\n\ndef merge(left, right):\n    result = []\n    i = j = 0\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]: result.append(left[i]); i += 1\n        else: result.append(right[j]); j += 1\n    return result + left[i:] + right[j:]\n\n# Quick Sort — O(n log n) average, O(n^2) worst\ndef quicksort(arr, low, high):\n    if low < high:\n        pi = partition(arr, low, high)\n        quicksort(arr, low, pi - 1)\n        quicksort(arr, pi + 1, high)\n\ndef partition(arr, low, high):\n    pivot = arr[high]\n    i = low - 1\n    for j in range(low, high):\n        if arr[j] <= pivot:\n            i += 1\n            arr[i], arr[j] = arr[j], arr[i]\n    arr[i+1], arr[high] = arr[high], arr[i+1]\n    return i + 1\n\n# Binary Search — O(log n)\ndef binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == target: return mid\n        elif arr[mid] < target: lo = mid + 1\n        else: hi = mid - 1\n    return -1\n\n# Search in rotated sorted array\ndef search_rotated(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target: return mid\n        if nums[lo] <= nums[mid]:\n            if nums[lo] <= target < nums[mid]: hi = mid - 1\n            else: lo = mid + 1\n        else:\n            if nums[mid] < target <= nums[hi]: lo = mid + 1\n            else: hi = mid - 1\n    return -1</code></pre>'},
  {id:'dsa-8',title:'Heaps & Priority Queues',duration_mins:25,order_index:8,content:'<h2>Heaps — Efficient Min/Max Operations</h2><pre><code">import heapq\n\n# Python heapq is a min-heap by default\n# For max-heap: negate the values\n\nheap = []\nheapq.heappush(heap, 3)\nheapq.heappush(heap, 1)\nheapq.heappush(heap, 5)\nprint(heapq.heappop(heap))  # 1 (min)\n\n# Kth largest element\ndef kth_largest(nums, k):\n    """O(n log k) using min-heap of size k"""\n    heap = nums[:k]\n    heapq.heapify(heap)\n    for num in nums[k:]:\n        if num > heap[0]:\n            heapq.heapreplace(heap, num)\n    return heap[0]\n\n# Merge k sorted arrays\ndef merge_k_sorted(arrays):\n    result = []\n    heap = []  # (value, array_index, element_index)\n    for i, arr in enumerate(arrays):\n        if arr:\n            heapq.heappush(heap, (arr[0], i, 0))\n    while heap:\n        val, i, j = heapq.heappop(heap)\n        result.append(val)\n        if j + 1 < len(arrays[i]):\n            heapq.heappush(heap, (arrays[i][j+1], i, j+1))\n    return result\n\n# Top K frequent elements\ndef top_k_frequent(nums, k):\n    from collections import Counter\n    count = Counter(nums)\n    return heapq.nlargest(k, count.keys(), key=count.get)\n\n# Running median\nclass MedianFinder:\n    def __init__(self):\n        self.small = []  # max-heap (negated)\n        self.large = []  # min-heap\n\n    def add_num(self, num):\n        heapq.heappush(self.small, -num)\n        if self.small and self.large and -self.small[0] > self.large[0]:\n            heapq.heappush(self.large, -heapq.heappop(self.small))\n        if len(self.small) > len(self.large) + 1:\n            heapq.heappush(self.large, -heapq.heappop(self.small))\n        if len(self.large) > len(self.small):\n            heapq.heappush(self.small, -heapq.heappop(self.large))\n\n    def find_median(self):\n        if len(self.small) > len(self.large): return -self.small[0]\n        return (-self.small[0] + self.large[0]) / 2</code></pre>'},
  {id:'dsa-9',title:'Tries & Advanced Data Structures',duration_mins:25,order_index:9,content:'<h2>Tries and Union-Find</h2><h3>Trie — Prefix Tree</h3><pre><code">class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word):\n        node = self.root\n        for char in word:\n            if char not in node.children:\n                node.children[char] = TrieNode()\n            node = node.children[char]\n        node.is_end = True\n\n    def search(self, word):\n        node = self.root\n        for char in word:\n            if char not in node.children: return False\n            node = node.children[char]\n        return node.is_end\n\n    def starts_with(self, prefix):\n        node = self.root\n        for char in prefix:\n            if char not in node.children: return False\n            node = node.children[char]\n        return True\n\n    def autocomplete(self, prefix):\n        """Return all words starting with prefix"""\n        node = self.root\n        for char in prefix:\n            if char not in node.children: return []\n            node = node.children[char]\n        results = []\n        self._dfs(node, prefix, results)\n        return results\n\n    def _dfs(self, node, current, results):\n        if node.is_end: results.append(current)\n        for char, child in node.children.items():\n            self._dfs(child, current + char, results)</code></pre><h3>Union-Find (Disjoint Set)</h3><pre><code">class UnionFind:\n    def __init__(self, n):\n        self.parent = list(range(n))\n        self.rank = [0] * n\n        self.components = n\n\n    def find(self, x):\n        if self.parent[x] != x:\n            self.parent[x] = self.find(self.parent[x])  # path compression\n        return self.parent[x]\n\n    def union(self, x, y):\n        px, py = self.find(x), self.find(y)\n        if px == py: return False\n        if self.rank[px] < self.rank[py]: px, py = py, px\n        self.parent[py] = px\n        if self.rank[px] == self.rank[py]: self.rank[px] += 1\n        self.components -= 1\n        return True\n\n# Number of connected components\ndef count_components(n, edges):\n    uf = UnionFind(n)\n    for u, v in edges:\n        uf.union(u, v)\n    return uf.components</code></pre>'},
  {id:'dsa-10',title:'Interview Strategy & System Design Intro',duration_mins:30,order_index:10,content:'<h2>Cracking the Indian Tech Interview</h2><h3>The 45-Minute Interview Framework</h3><ol><li><strong>Clarify (3-5 min)</strong> — Ask about edge cases, constraints, expected input size. "Can the array be empty? Can values be negative? What is the max size?"</li><li><strong>Brute Force (2 min)</strong> — State the naive approach out loud. Do NOT code it. "I could check every pair in O(n²), but we can do better."</li><li><strong>Optimize (5 min)</strong> — Think aloud. "If I sort first... if I use a hash map... if I use two pointers..."</li><li><strong>Code (15-20 min)</strong> — Write clean, readable code. Use meaningful variable names. Comment complex logic.</li><li><strong>Test (5 min)</strong> — Trace through your code with: normal input, edge cases (empty, single element, duplicates), corner cases (all same, sorted/reverse sorted).</li></ol><h3>Pattern Recognition — Most Interview Problems Map to These</h3><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:8px;border:1px solid #ddd">Pattern</th><th style="padding:8px;border:1px solid #ddd">When to Use</th></tr><tr><td style="padding:8px;border:1px solid #ddd">Two Pointers</td><td style="padding:8px;border:1px solid #ddd">Sorted array, pairs, palindromes</td></tr><tr><td style="padding:8px;border:1px solid #ddd">Sliding Window</td><td style="padding:8px;border:1px solid #ddd">Subarrays, substrings, "maximum/minimum of k elements"</td></tr><tr><td style="padding:8px;border:1px solid #ddd">BFS</td><td style="padding:8px;border:1px solid #ddd">Shortest path, level order, word ladder</td></tr><tr><td style="padding:8px;border:1px solid #ddd">DFS</td><td style="padding:8px;border:1px solid #ddd">Tree paths, islands, permutations</td></tr><tr><td style="padding:8px;border:1px solid #ddd">Dynamic Programming</td><td style="padding:8px;border:1px solid #ddd">"Count ways", "max/min value", overlapping subproblems</td></tr><tr><td style="padding:8px;border:1px solid #ddd">Heap</td><td style="padding:8px;border:1px solid #ddd">Top K, running median, merge k sorted</td></tr><tr><td style="padding:8px;border:1px solid #ddd">Trie</td><td style="padding:8px;border:1px solid #ddd">Prefix search, autocomplete, word search</td></tr><tr><td style="padding:8px;border:1px solid #ddd">Union-Find</td><td style="padding:8px;border:1px solid #ddd">Connected components, cycle detection</td></tr></table><h3>Companies and Their DSA Focus (India)</h3><ul><li><strong>Flipkart, Amazon</strong> — Heavy DP, graphs, system design</li><li><strong>Google India</strong> — Hard DP, strings, graphs</li><li><strong>Microsoft Hyderabad</strong> — Trees, graphs, OOP design</li><li><strong>Swiggy, Zomato</strong> — Medium arrays, SQL, system design</li><li><strong>CRED, Razorpay</strong> — Medium DSA + strong system design</li></ul><h3>30-Day DSA Plan for Indian Interviews</h3><ol><li>Week 1: Arrays, Strings, Hash Maps (30 problems on LeetCode easy/medium)</li><li>Week 2: Trees, Linked Lists, Stacks/Queues (25 problems)</li><li>Week 3: Graphs, BFS/DFS, DP intro (25 problems)</li><li>Week 4: Advanced DP, Heaps, Mock interviews</li></ol>'}
],
