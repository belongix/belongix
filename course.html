  {id:'gai-1',title:'Generative AI — The Technology That Changed Everything',duration_mins:20,order_index:1,is_free_preview:true,content:'<h2>Understanding Generative AI</h2><p>Generative AI is not just another technology trend — it is the most significant shift in computing since the internet. Understanding it deeply, not just using it superficially, will separate professionals who thrive from those who get replaced.</p><h3>What Generative AI Actually Does</h3><p>These models are trained on massive text (and image) datasets to predict what comes next. Given "The capital of India is ___", the model predicts "New Delhi" because it has seen that pattern billions of times.</p><p>The key insight: <strong>prediction at massive scale creates apparent understanding.</strong> The model does not "know" facts the way humans do — but its predictions are so accurate that the output is useful for nearly any task.</p><h3>The Models You Need to Know in 2026</h3><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:10px;border:1px solid #ddd">Model</th><th style="padding:10px;border:1px solid #ddd">Company</th><th style="padding:10px;border:1px solid #ddd">Best For</th><th style="padding:10px;border:1px solid #ddd">Context Window</th></tr><tr><td style="padding:10px;border:1px solid #ddd">GPT-4o</td><td style="padding:10px;border:1px solid #ddd">OpenAI</td><td style="padding:10px;border:1px solid #ddd">General, voice, images</td><td style="padding:10px;border:1px solid #ddd">128K tokens</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Claude 3.5 Sonnet</td><td style="padding:10px;border:1px solid #ddd">Anthropic</td><td style="padding:10px;border:1px solid #ddd">Coding, analysis, long docs</td><td style="padding:10px;border:1px solid #ddd">200K tokens</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Gemini 1.5 Pro</td><td style="padding:10px;border:1px solid #ddd">Google</td><td style="padding:10px;border:1px solid #ddd">Long docs, Google Workspace</td><td style="padding:10px;border:1px solid #ddd">1M tokens</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Llama 3.1 70B</td><td style="padding:10px;border:1px solid #ddd">Meta</td><td style="padding:10px;border:1px solid #ddd">Self-hosted, privacy-first</td><td style="padding:10px;border:1px solid #ddd">128K tokens</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Mistral Large</td><td style="padding:10px;border:1px solid #ddd">Mistral</td><td style="padding:10px;border:1px solid #ddd">European/multilingual</td><td style="padding:10px;border:1px solid #ddd">128K tokens</td></tr></table><h3>Why This Matters for Indian Professionals Specifically</h3><p>India has 5 million+ software developers and millions more knowledge workers. The gap between those who master AI and those who do not is already measurable in productivity — and soon it will be measurable in salary.</p><ul><li>Developers using AI coding tools ship 2-3x more features per sprint</li><li>Analysts using AI summarization process 5x more data per day</li><li>Managers using AI for communication draft in minutes what used to take hours</li></ul><p>The opportunity: Indian professionals who build real AI skills early will earn an additional ₹5-15 LPA premium over peers by 2027.</p>'},
  {id:'gai-2',title:'Prompt Engineering — The Master Skill',duration_mins:25,order_index:2,content:'<h2>Prompt Engineering — Getting 10x More from AI</h2><p>The same AI model gives dramatically different quality outputs based on how you prompt it. Mastering prompting is the fastest path to a meaningful productivity increase.</p><h3>The RCTF Framework</h3><p>Every powerful prompt has four components:</p><ul><li><strong>R — Role:</strong> Tell the AI who it is. "You are a senior HR manager at a Bangalore product company with 10 years of experience in technical hiring."</li><li><strong>C — Context:</strong> Provide relevant background. Include the situation, constraints, what you have already tried, and any relevant data.</li><li><strong>T — Task:</strong> Be specific about exactly what you want. Use action verbs: analyze, write, compare, critique, summarize, generate.</li><li><strong>F — Format:</strong> Specify the output format precisely: numbered list, table, JSON, Python code, under 200 words, etc.</li></ul><h3>Real Prompt Transformations</h3><p><strong>Bad:</strong> "Help me with my resume"</p><p><strong>Good:</strong> "You are an ATS resume expert and career coach specializing in tech roles in Indian product companies. Review my resume below for a Senior Data Scientist role at Flipkart. Provide: (1) ATS keyword gaps comparing my resume to the job description I will paste, (2) 3 specific achievements I should rewrite with the STAR method and metrics, (3) skills section gaps for the Flipkart role, (4) overall score out of 10 with reasoning. Format as a structured report with sections."</p><h3>Advanced Prompting Techniques</h3><h4>Chain of Thought</h4><p>Add "Let us think through this step by step" to get more accurate reasoning on complex problems:</p><pre><code>Prompt: "A Bangalore startup is deciding between React and Vue for their new app. \nThey have 4 React developers and 1 Vue developer. \nThey need to ship in 3 months. \nLet us think through this step by step to make the right decision."</code></pre><h4>Few-Shot Learning</h4><p>Give 2-3 examples of what you want before asking for the real thing:</p><pre><code">Convert these job titles to standard levels:\n\nInput: "Software Engineer II" → Output: SDE-2\nInput: "Staff Engineer" → Output: Staff SDE\nInput: "Principal Engineer" → Output: Principal SDE\n\nNow convert: "Senior Software Development Engineer, Backend"</code></pre><h4>Role + Persona Stacking</h4><pre><code">You are simultaneously:\n- A senior recruiter at Flipkart (you know what they look for)\n- A career coach who has helped 500 professionals crack product companies\n- A Bangalore professional who made the IT→product switch yourself\n\nGiven this dual perspective, review this resume and tell me what the recruiter would skip past and what the career coach would fix first.</code></pre><h3>When AI Hallucinates — How to Catch It</h3><p>AI models sometimes generate confident-sounding false information. Protect yourself:</p><ul><li>For any specific fact (numbers, dates, names), verify with a real source</li><li>Ask the model: "How confident are you in this? What would you need to verify?"</li><li>For research, use Perplexity.ai which shows citations</li><li>For code, run it and test it — do not ship unvalidated AI code</li></ul>'},
  {id:'gai-3',title:'ChatGPT & Claude for Professional Work',duration_mins:20,order_index:3,content:'<h2>Using AI Daily — Real Professional Workflows</h2><h3>For Developers — 10 AI Workflows</h3><ol><li><strong>Debug faster:</strong> Paste error message + relevant code → "What is wrong and how do I fix it?"</li><li><strong>Write tests:</strong> Paste a function → "Write pytest unit tests covering happy path, edge cases, and error cases"</li><li><strong>Code review:</strong> Paste code → "Review this for: bugs, security issues, performance, readability. Be specific."</li><li><strong>Generate boilerplate:</strong> "Write a Flask REST endpoint for user authentication with JWT, including refresh tokens, input validation, and proper error handling"</li><li><strong>Explain complex code:</strong> Paste legacy code → "Explain what this does line by line. What does it break if removed?"</li><li><strong>Write documentation:</strong> Paste function → "Write JSDoc/docstring with parameters, return values, examples"</li><li><strong>SQL queries:</strong> Describe what you need in plain English → get optimized SQL</li><li><strong>Regex:</strong> "Write a regex to validate Indian mobile numbers (10 digits, starting with 6-9)"</li><li><strong>Git messages:</strong> Paste diff → "Write a conventional commit message for this change"</li><li><strong>Architecture review:</strong> Describe your system → "What are the failure points and how would you improve it?"</li></ol><h3>For Analysts — 5 AI Workflows</h3><ol><li><strong>SQL from English:</strong> "Write a SQL query to find the top 10 users by revenue who signed up in the last 30 days and have not churned"</li><li><strong>Data story:</strong> Paste a table of numbers → "Write a 3-paragraph executive summary of what this data shows"</li><li><strong>Chart recommendations:</strong> Describe your data → "What visualization type best communicates this insight and why?"</li><li><strong>Python pandas:</strong> "Write pandas code to clean this CSV: remove duplicates by email, fill null salaries with city median, convert date columns"</li><li><strong>Statistical interpretation:</strong> Paste a p-value, confidence interval → "Explain what this means to a non-technical stakeholder"</li></ol><h3>For Everyone — Communication Templates</h3><pre><code">CONTEXT: I need to tell my manager that the feature will be delayed by 2 weeks \nbecause of unexpected API issues we found in testing. My manager values honesty \nbut is under pressure from stakeholders.\n\nWrite a Slack message that:\n- Is direct about the delay\n- Explains root cause without making excuses\n- Proposes a concrete recovery plan\n- Keeps it under 150 words\n- Ends with a clear next step</code></pre>'},
  {id:'gai-4',title:'Image Generation & Multimodal AI',duration_mins:20,order_index:4,content:'<h2>AI Image Generation — From Prompts to Visuals</h2><h3>Midjourney — Professional Quality Images</h3><p>Midjourney is the industry standard for high-quality image generation. Used by Indian marketing teams, designers, and content creators.</p><h3>The Image Prompt Formula</h3><p><code>[Subject] + [Setting/Context] + [Style] + [Lighting] + [Camera/Composition] + [Mood]</code></p><p>Example: "Indian woman software engineer presenting to team, modern Bangalore office with plants, corporate photography, soft natural window light, medium shot, confident and collaborative mood, --ar 16:9 --style raw"</p><h3>Key Parameters</h3><ul><li><code>--ar 16:9</code> — widescreen (presentations, YouTube thumbnails)</li><li><code>--ar 1:1</code> — square (Instagram, profile photos)</li><li><code>--ar 4:5</code> — vertical (Instagram Stories, mobile)</li><li><code>--style raw</code> — photorealistic, less artistic interpretation</li><li><code>--v 6</code> — latest model version</li><li><code>--no text, logos</code> — exclude unwanted elements</li></ul><h3>Free Alternatives for Indian Professionals</h3><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:10px;border:1px solid #ddd">Tool</th><th style="padding:10px;border:1px solid #ddd">Free Tier</th><th style="padding:10px;border:1px solid #ddd">Best For</th></tr><tr><td style="padding:10px;border:1px solid #ddd">Leonardo.ai</td><td style="padding:10px;border:1px solid #ddd">150 credits/day</td><td style="padding:10px;border:1px solid #ddd">Product images, marketing</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Ideogram</td><td style="padding:10px;border:1px solid #ddd">25 images/day</td><td style="padding:10px;border:1px solid #ddd">Text in images (posters, thumbnails)</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Adobe Firefly</td><td style="padding:10px;border:1px solid #ddd">25 credits/month</td><td style="padding:10px;border:1px solid #ddd">Commercially safe, Photoshop integration</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Canva AI</td><td style="padding:10px;border:1px solid #ddd">Limited free</td><td style="padding:10px;border:1px solid #ddd">Presentations, social media</td></tr></table><h3>Using GPT-4o Vision — Analyze Images</h3><p>Upload an image and ask questions about it:</p><ul><li>Analyze a competitor website screenshot → "What UX improvements would you suggest?"</li><li>Upload a chart → "What are the 3 key insights and what decisions does this drive?"</li><li>Upload your resume as image → "How does the visual layout affect readability?"</li></ul>'},
  {id:'gai-5',title:'Building RAG Systems',duration_mins:20,order_index:5,content:'<h2>RAG — Teach AI About Your Own Data</h2><p>RAG (Retrieval-Augmented Generation) lets you build AI that answers questions about your specific documents, company knowledge base, or proprietary data — without the risk of the AI making things up.</p><h3>How RAG Works</h3><ol><li><strong>Ingest</strong> — Upload your documents (PDFs, Notion, Confluence, Google Docs)</li><li><strong>Chunk</strong> — Break documents into smaller pieces (typically 500-1000 tokens each)</li><li><strong>Embed</strong> — Convert chunks to numerical vectors using an embedding model</li><li><strong>Store</strong> — Save vectors in a vector database (Pinecone, Weaviate, Supabase pgvector)</li><li><strong>Query</strong> — User asks a question → convert to vector → find similar chunks</li><li><strong>Generate</strong> — Pass relevant chunks as context to LLM → get accurate, sourced answer</li></ol><h3>No-Code RAG Options</h3><ul><li><strong>ChatGPT Custom GPTs</strong> — Upload documents, share the GPT link. Free for Plus users.</li><li><strong>Notion AI</strong> — Built-in RAG over your Notion workspace</li><li><strong>Perplexity</strong> — Real-time RAG over the web with citations</li><li><strong>Guru / Confluence AI</strong> — Enterprise knowledge management with AI</li></ul><h3>Simple Python RAG with LangChain</h3><pre><code">from langchain.document_loaders import PyPDFLoader, DirectoryLoader\nfrom langchain.text_splitter import RecursiveCharacterTextSplitter\nfrom langchain_openai import OpenAIEmbeddings, ChatOpenAI\nfrom langchain.vectorstores import Chroma\nfrom langchain.chains import RetrievalQA\n\n# Load your documents\nloader = DirectoryLoader("./company_docs", glob="**/*.pdf", loader_cls=PyPDFLoader)\ndocs = loader.load()\n\n# Split into chunks\nsplitter = RecursiveCharacterTextSplitter(\n    chunk_size=1000,\n    chunk_overlap=200,  # overlap ensures context is not lost at boundaries\n    separators=["\\n\\n", "\\n", ". ", " "]\n)\nchunks = splitter.split_documents(docs)\nprint(f"Split into {len(chunks)} chunks")\n\n# Create vector store\nembeddings = OpenAIEmbeddings(model="text-embedding-3-small")\nvectorstore = Chroma.from_documents(chunks, embeddings, persist_directory="./chroma_db")\n\n# Create QA chain\nllm = ChatOpenAI(model="gpt-4o", temperature=0)\nqa_chain = RetrievalQA.from_chain_type(\n    llm=llm,\n    retriever=vectorstore.as_retriever(search_kwargs={"k": 5}),\n    return_source_documents=True\n)\n\n# Query\nresult = qa_chain.invoke("What is the company leave policy?")\nprint(result["result"])\nprint("Sources:", [doc.metadata["source"] for doc in result["source_documents"]])</code></pre>'},
  {id:'gai-6',title:'AI Automation with Make.com and n8n',duration_mins:20,order_index:6,content:'<h2>Automating Work with AI Workflows</h2><p>The real power of AI is not just chatting with it manually — it is building workflows where AI automatically processes data, makes decisions, and takes actions.</p><h3>Make.com — No-Code AI Automation</h3><p>Make.com (formerly Integromat) lets you visually connect apps and APIs. Free tier: 1,000 operations/month.</p><h3>Real Workflow: Auto-Respond to Job Applications</h3><ol><li><strong>Trigger:</strong> New email received in Gmail (Subject contains "Application")</li><li><strong>Extract:</strong> OpenAI API → "Extract applicant name, role applied, years of experience, and key skills from this email: {email_body}"</li><li><strong>Evaluate:</strong> OpenAI API → "Score this applicant 1-10 for [role] based on these criteria: [criteria]. Return JSON with score and reason."</li><li><strong>If score >= 7:</strong> Gmail → Send interview invitation with available slots from Google Calendar</li><li><strong>If score < 7:</strong> Gmail → Send polite rejection with feedback</li><li><strong>Log:</strong> Google Sheets → Add row with applicant details and score</li></ol><h3>Workflow: Daily Market Intelligence Report</h3><ol><li><strong>Schedule:</strong> Every morning at 7 AM</li><li><strong>Fetch:</strong> RSS feeds from Economic Times, YourStory, Inc42 (India tech news)</li><li><strong>Summarize:</strong> Claude API → "Summarize these 10 articles into 5 key insights relevant to Indian startups. Format as bullet points."</li><li><strong>Send:</strong> Email/Slack message to team with the summary</li></ol><h3>n8n — Self-Hosted Alternative</h3><p>n8n is open source. Deploy on your own server for unlimited automation with no per-operation cost. Perfect for sensitive data that should not go to third-party servers.</p>'},
  {id:'gai-7',title:'AI Ethics & Responsible Use',duration_mins:15,order_index:7,content:'<h2>Using AI Responsibly — What Every Professional Must Know</h2><h3>The Hallucination Problem</h3><p>AI models confidently generate incorrect information. This is not a bug — it is inherent to how they work. In professional contexts, this can be dangerous.</p><p><strong>High-risk uses (always verify):</strong></p><ul><li>Legal advice or contract interpretation</li><li>Medical information</li><li>Financial calculations</li><li>Statistics and specific data points</li><li>Recent events (models have training cutoffs)</li></ul><p><strong>Lower-risk uses (AI shines here):</strong></p><ul><li>Drafting and editing text</li><li>Generating code structures (still test thoroughly)</li><li>Brainstorming and ideation</li><li>Explaining concepts</li><li>Reformatting existing information</li></ul><h3>Privacy and Data Security</h3><p>Critical rules for Indian professionals:</p><ul><li><strong>Never paste customer data</strong> into public AI tools (ChatGPT, Claude.ai). This likely violates DPDP Act 2023 (India data protection law).</li><li><strong>Never paste proprietary code</strong> or trade secrets into public AI tools</li><li>For sensitive use cases: use API with zero data retention, or deploy open-source models internally</li><li>Use Enterprise plans (OpenAI Enterprise, Claude for Enterprise) which have contractual data protections</li></ul><h3>AI and Employment</h3><p>The honest picture: AI is eliminating some job functions while creating new ones. Roles most at risk: data entry, basic content writing, simple code generation, basic image editing. Roles growing: AI engineering, prompt engineering, AI product management, AI auditing, human oversight roles.</p>'},
  {id:'gai-8',title:'AI Career Strategy for India 2026',duration_mins:15,order_index:8,content:'<h2>Building an AI-First Career in India</h2><h3>The AI Skill Stack — What to Learn in Order</h3><ol><li><strong>Foundation (Week 1-2):</strong> Master prompting (this course). Practice daily with real work tasks.</li><li><strong>Tools (Week 3-4):</strong> ChatGPT for work, Claude for analysis, Midjourney for visuals, Make.com for automation</li><li><strong>Technical (Month 2-3):</strong> LangChain basics, OpenAI API, build one RAG project</li><li><strong>Advanced (Month 4-6):</strong> Fine-tuning, agents, LangGraph, vector databases</li><li><strong>Specialization (Month 6+):</strong> Pick a domain: AI for fintech, AI for healthtech, AI for e-commerce</li></ol><h3>What to Add to Your Resume</h3><pre><code">BEFORE: "Wrote Python scripts for data processing"\nAFTER:  "Automated data processing pipeline using Python + GPT-4 API, \n         reducing manual review time by 70% (8 hours/week → 2 hours/week)"\n\nBEFORE: "Created marketing content"\nAFTER:  "Built LangChain-powered content generation system that produced \n         50 SEO-optimized articles/month at ₹2,000/article cost reduction"</code></pre><h3>India-Specific AI Career Opportunities</h3><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:10px;border:1px solid #ddd">Role</th><th style="padding:10px;border:1px solid #ddd">Salary Range</th><th style="padding:10px;border:1px solid #ddd">Companies</th></tr><tr><td style="padding:10px;border:1px solid #ddd">AI/ML Engineer</td><td style="padding:10px;border:1px solid #ddd">₹20-50 LPA</td><td style="padding:10px;border:1px solid #ddd">Google, Microsoft, Sarvam AI, Krutrim</td></tr><tr><td style="padding:10px;border:1px solid #ddd">LLM Engineer</td><td style="padding:10px;border:1px solid #ddd">₹25-60 LPA</td><td style="padding:10px;border:1px solid #ddd">Sarvam, Krutrim, CRED, Razorpay</td></tr><tr><td style="padding:10px;border:1px solid #ddd">AI Product Manager</td><td style="padding:10px;border:1px solid #ddd">₹30-70 LPA</td><td style="padding:10px;border:1px solid #ddd">Flipkart, Swiggy, PhonePe</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Prompt Engineer</td><td style="padding:10px;border:1px solid #ddd">₹12-30 LPA</td><td style="padding:10px;border:1px solid #ddd">Startups, agencies, consultancies</td></tr></table>'}

'salary-negotiation':[
  {id:'sn-1',title:'Know Your Market Value — Research Like a Pro',duration_mins:20,order_index:1,is_free_preview:true,content:'<h2>The Foundation of Every Negotiation: Data</h2><p>The most common reason Indian professionals are underpaid is not lack of skill — it is lack of data. You cannot negotiate effectively without knowing your market rate precisely.</p><h3>The Best Sources for India Salary Data (2026)</h3><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:10px;border:1px solid #ddd">Source</th><th style="padding:10px;border:1px solid #ddd">Best For</th><th style="padding:10px;border:1px solid #ddd">Reliability</th></tr><tr><td style="padding:10px;border:1px solid #ddd"><strong>Levels.fyi</strong></td><td style="padding:10px;border:1px solid #ddd">Product companies, FAANG, total comp</td><td style="padding:10px;border:1px solid #ddd">⭐⭐⭐⭐⭐</td></tr><tr><td style="padding:10px;border:1px solid #ddd"><strong>Glassdoor India</strong></td><td style="padding:10px;border:1px solid #ddd">Wide coverage, all industries</td><td style="padding:10px;border:1px solid #ddd">⭐⭐⭐⭐</td></tr><tr><td style="padding:10px;border:1px solid #ddd"><strong>Belongix Salary Intelligence</strong></td><td style="padding:10px;border:1px solid #ddd">Real India market data</td><td style="padding:10px;border:1px solid #ddd">⭐⭐⭐⭐⭐</td></tr><tr><td style="padding:10px;border:1px solid #ddd"><strong>LinkedIn Salary</strong></td><td style="padding:10px;border:1px solid #ddd">Non-tech roles, leadership</td><td style="padding:10px;border:1px solid #ddd">⭐⭐⭐</td></tr><tr><td style="padding:10px;border:1px solid #ddd"><strong>Ask in communities</strong></td><td style="padding:10px;border:1px solid #ddd">Blind app, Reddit r/india, AngelList</td><td style="padding:10px;border:1px solid #ddd">⭐⭐⭐⭐</td></tr></table><h3>How to Research Your Exact Market Rate</h3><p>Your market rate is specific to: <strong>role title + years of experience + city + company type (product vs service)</strong>. Generic data is useless.</p><p>Example research for a Data Scientist with 3 years experience in Bangalore:</p><ol><li>Go to Levels.fyi → India → Data Scientist → filter by Bangalore → filter by "3-5 years experience"</li><li>Look at the P50 (median) and P75 (75th percentile)</li><li>Note whether the data is all-in (base + bonus + equity) or just base</li><li>Cross-check with Glassdoor India for the same filters</li><li>Post anonymously on Blind: "I have 3 yrs DS experience, Bangalore — currently at ₹16 LPA. Fair?"</li></ol><h3>Understanding Total Compensation</h3><p>Never compare base salaries alone. Always compare total compensation:</p><ul><li><strong>Base salary</strong> — monthly fixed component</li><li><strong>Variable/Bonus</strong> — typically 10-25% of base at product companies</li><li><strong>ESOPs/RSUs</strong> — stock that vests over 4 years. At a funded startup, worth ₹10-50 LPA equivalent if company grows</li><li><strong>Benefits</strong> — health insurance (you + family), gratuity, PF contributions, meal allowance</li></ul><blockquote><strong>Action item:</strong> Research your exact market rate right now. Write down: current salary, market P50, market P75. The gap between your current salary and P50 is your negotiation ammunition. If you are at or above P75, your current company is paying well.</blockquote>'},
  {id:'sn-2',title:'The Negotiation Playbook — Word by Word',duration_mins:20,order_index:2,content:'<h2>Exactly What to Say — Scripts for Every Situation</h2><h3>When HR Asks "What Is Your Expected CTC?"</h3><p>This is the most important moment. Get it wrong and you leave lakhs on the table.</p><p><strong>Never say a number first if you can avoid it.</strong> Try this first:</p><blockquote>"I am more interested in understanding the full scope of the role and the total compensation structure before naming a number. Could you share the budget for this position?"</blockquote><p>If they insist on a number from you:</p><blockquote>"Based on my research on Glassdoor and Levels.fyi for [Role] in Bangalore at [Company type] with my [X] years of experience, I am targeting ₹[your P75] to ₹[your P90]. My priority is the right opportunity, so I am flexible within that range."</blockquote><h3>When You Receive an Offer</h3><p><strong>Step 1:</strong> Never accept on the spot. Always say:</p><blockquote>"Thank you so much! I am genuinely excited about this opportunity. Could I have until [specific date — 3-5 days] to review the full offer details?"</blockquote><p><strong>Step 2:</strong> Review carefully. Look at: base, variable target %, joining bonus (if any), ESOPs (vesting schedule, cliff), notice period buy-out policy, health insurance coverage.</p><p><strong>Step 3:</strong> Counter if below your target:</p><blockquote>"I really appreciate the offer and I am very excited about the role and team. I did want to share some honest feedback — I was expecting something closer to ₹[your target] based on my research for this role in Bangalore, and given my background in [specific relevant skills]. Is there any flexibility to get closer to that number?"</blockquote><h3>After You Counter — Stay Silent</h3><p>After delivering your counter, <strong>stop talking completely.</strong> No filling the silence. No "but I am flexible" backpedaling. No explaining further. The first person to speak after a negotiation anchor generally concedes.</p>'},
  {id:'sn-3',title:'Handling Every Objection',duration_mins:15,order_index:3,content:'<h2>Every Objection and Exactly How to Respond</h2><h3>Objection: "This Is Our Final Offer"</h3><p>This is rarely actually final. It is a negotiating tactic. Your response:</p><blockquote>"I understand. I genuinely want to make this work. Is there flexibility in any other components — perhaps the joining bonus, variable target, or ESOPs — to bridge the gap? I am also open to discussing a structured 3-month review if the base cannot move right now."</blockquote><h3>Objection: "You Are Already at the Top of Our Band"</h3><blockquote>"I appreciate you sharing that context. Could you help me understand what it would take to move into the next band? I would love to understand the growth trajectory here."</blockquote><h3>Objection: "Your Current Salary Is Too Low"</h3><p>This is a common trap. Your current salary is irrelevant to your market value. Respond:</p><blockquote>"I want to focus on the market rate for this role rather than my current compensation. Based on Glassdoor data for [Role] in [City], the median is ₹[market rate]. That is what I am benchmarking against."</blockquote><h3>Objection: "We Cannot Exceed Our Internal Parity"</h3><blockquote>"I understand parity is important. Could you help me see what the path to ₹[your target] looks like within your system? I am committed to this role and want to understand the growth trajectory."</blockquote><h3>Key Rule: You Will NEVER Lose a Legitimate Offer by Negotiating</h3><p>This is the fear that stops 80% of Indian professionals from negotiating. It is unfounded. In 15+ years of recruiting, virtually no offer has ever been withdrawn because a candidate politely asked for more. A company that withdraws an offer for a reasonable negotiation request was not worth working for.</p>'},
  {id:'sn-4',title:'Annual Appraisals & The Switching Strategy',duration_mins:20,order_index:4,content:'<h2>Maximizing Your Salary Over a Career</h2><h3>The Annual Appraisal — Start 6 Months Early</h3><p>Your appraisal outcome is determined months before the conversation. Most managers form their ratings by month 9 of the year based on documented impact.</p><p><strong>Month 1-6:</strong> Document everything. Keep a running Google Doc titled "Wins 2026." Every time you ship something, solve a problem, or get positive feedback — note it with numbers. "Fixed API performance issue — reduced response time from 2.1s to 0.3s, unblocking team of 4."</p><p><strong>Month 7-8:</strong> Research market rates. Pull Glassdoor and Levels.fyi data for your current role at your experience level. Calculate the percentage gap between your salary and market P50.</p><p><strong>Month 9:</strong> Have an informal conversation with your manager: "I want to share what I have been working on this year and get your early input on my appraisal." This signals you are thinking about it and gives your manager time to prepare.</p><p><strong>Month 10-11:</strong> If you have a competing offer available, this is when you use it.</p><h3>The India Switching Premium</h3><p>This is the most important data point for your career:</p><table style="width:100%;border-collapse:collapse;margin:16px 0"><tr style="background:#f3f0ff"><th style="padding:10px;border:1px solid #ddd">Path</th><th style="padding:10px;border:1px solid #ddd">Typical Hike</th></tr><tr><td style="padding:10px;border:1px solid #ddd">Annual increment at same company</td><td style="padding:10px;border:1px solid #ddd">8-15%</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Promotion at same company</td><td style="padding:10px;border:1px solid #ddd">15-25%</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Switching companies (lateral)</td><td style="padding:10px;border:1px solid #ddd">30-50%</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Switching to a funded startup with ESOPs</td><td style="padding:10px;border:1px solid #ddd">20-40% base + potential upside</td></tr></table><h3>The Competing Offer Strategy</h3><p>The single most effective salary tool. Even if you are not planning to leave:</p><ol><li>Start one interview process with a company you are genuinely interested in</li><li>Reach offer stage (takes 3-6 weeks typically)</li><li>Receive written offer</li><li>Go to current manager: "I received an offer for ₹[amount]. I genuinely prefer to stay here because [real reason]. Is there any way to match this?"</li><li>Give them one week to respond. If they cannot match within 80% of the offer, take the offer.</li></ol>'}
]

  {id:'dsa-q1',question:'What is the time complexity of binary search on a sorted array of n elements?',option_a:'O(n)',option_b:'O(n²)',option_c:'O(log n)',option_d:'O(1)',correct:'c',explanation:'Binary search halves the search space with each comparison. To reduce n to 1 takes log₂(n) steps, giving O(log n) complexity.',order_index:1},
  {id:'dsa-q2',question:'Which data structure is LIFO (Last In, First Out)?',option_a:'Queue',option_b:'Stack',option_c:'Heap',option_d:'Linked List',correct:'b',explanation:'A stack is LIFO — the last element pushed is the first one popped. Think of a stack of plates: you add and remove from the top.',order_index:2},

window.addEventListener('load', async function() {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug') || 'salary-negotiation';

  try {
    var sess = await sb.auth.getSession();
    if (sess.data && sess.data.session && sess.data.session.user) {
      _user = sess.data.session.user;
    }
  } catch(e) {}

  await loadCourse(slug);
});

async function loadCourse(slug) {
  /* Use plain XHR-style fetch — supabase-js causes DataCloneError in this env */
  var H = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Accept': 'application/json' };
  var base = SB_URL + '/rest/v1/';

  async function dbGet(table, query) {
    try {
      var r = await fetch(base + table + '?' + query, { method: 'GET', headers: H });
      if (!r.ok) { console.warn('DB ' + table + ' HTTP ' + r.status); return []; }
      var d = await r.json();
      return Array.isArray(d) ? d : [];
    } catch(e) { console.warn('DB fetch error (' + table + '):', e.message); return []; }
  }

  /* --- 1. Load course --- */
  var courses = await dbGet('belongix_courses', 'slug=eq.' + encodeURIComponent(slug) + '&select=*&limit=1');
  if (courses.length) _course = courses[0];

  /* --- 2. Fallback to static if not in DB --- */
  if (!_course && STATIC_COURSES[slug]) {
    _course    = STATIC_COURSES[slug];
    _modules   = STATIC_MODULES[slug]   || [];
    _questions = STATIC_QUESTIONS[slug] || [];
    /* Static data loaded — skip DB module fetch, go straight to render */
  } else {
    /* Course found in DB — try to load modules from DB, then fall back to static */
    if (_course && _course.id) {
      var mods = await dbGet('course_modules', 'course_id=eq.' + _course.id + '&select=*&order=order_index');
      if (mods.length) _modules = mods;
      var quiz = await dbGet('course_quiz_questions', 'course_id=eq.' + _course.id + '&select=*&order=order_index');
      if (quiz.length) _questions = quiz;
    }
    /* DB modules empty — fall back to static content */
    if ((!_modules || _modules.length === 0) && STATIC_MODULES[slug]) {
      _modules   = STATIC_MODULES[slug];
      _questions = STATIC_QUESTIONS[slug] || [];
    }
  }

  /* --- 4. Load user data (enrollments, progress, cert) --- */
  if (_user && _course && _course.id) {
    var enr = await dbGet('course_enrollments', 'user_id=eq.' + _user.id + '&course_id=eq.' + _course.id + '&select=*&limit=1');
    _enrollment = enr[0] || null;

    var prog = await dbGet('course_progress', 'user_id=eq.' + _user.id + '&course_id=eq.' + _course.id + '&select=module_id');
    prog.forEach(function(p){ _completedModules.add(p.module_id); });

    var certs = await dbGet('certificates', 'user_id=eq.' + _user.id + '&course_id=eq.' + _course.id + '&select=*&limit=1');
    _certificate = certs[0] || null;
  }

  /* If course loaded but has no modules at all — show Coming Soon */
  if (_course && _modules.length === 0) {
    _modules = [{
      id: 'placeholder',
      title: 'Content Coming Soon',
      duration_mins: 5,
      order_index: 1,
      is_free_preview: true,
      content: '<div style="text-align:center;padding:40px 20px">'
        + '<div style="font-size:48px;margin-bottom:16px">🚀</div>'
        + '<h2 style="margin-bottom:12px">Content Coming Soon!</h2>'
        + '<p style="color:var(--muted);max-width:400px;margin:0 auto 24px">We are adding full course content for <strong>' + (_course.title||'this course') + '</strong> very soon. Check back shortly!</p>'
        + '<a href="courses.html" style="display:inline-block;background:var(--brand);color:#fff;padding:10px 24px;border-radius:10px;text-decoration:none;font-weight:600">← Browse Other Courses</a>'
        + '</div>'
    }];
  }

  if (!_course) {
    document.getElementById('page-content').innerHTML = '<div style="text-align:center;padding:80px;color:var(--muted)">Course not found. <a href="courses.html">Browse all courses →</a></div>';
    return;
  }

  /* Check localStorage for existing certificate if DB cert not found */
  if (!_certificate && _course && _user) {
    try {
      var stored = localStorage.getItem('bx_cert_' + _course.id + '_' + _user.id);
      if (stored) _certificate = JSON.parse(stored);
    } catch(ex) {}
  }

  /* Auto-enroll if logged in and not enrolled */
  if (_user && !_enrollment && _course.id) {
    try {
      await dbPost('course_enrollments', { user_id: _user.id, course_id: _course.id, status: 'in_progress' }, 'resolution=merge-duplicates');
    } catch(e) {}
  }

  renderPage();
}

function renderPage() {
  var completedCount = _completedModules.size;
  var totalModules = _modules.length;
  var pct = totalModules > 0 ? Math.round((completedCount / totalModules) * 100) : 0;
  var allModulesDone = completedCount >= totalModules && totalModules > 0;
  var hasCert = !!_certificate;

  var sidebarHtml = '<div class="sidebar">'
    + '<div class="progress-card">'
    + '<div class="progress-title">Your Progress</div>'
    + '<div class="progress-pct">' + pct + '%</div>'
    + '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="progress-detail">' + completedCount + ' of ' + totalModules + ' modules completed</div>'
    + '</div>'
    + (hasCert
      ? '<div class="cert-available-card" onclick="downloadCertificate()">'
        + '<div style="font-size:32px;margin-bottom:8px">🏆</div>'
        + '<div class="cert-available-title">Certificate Earned!</div>'
        + '<div style="font-size:12px;color:rgba(255,255,255,.8);margin-bottom:4px">' + esc(_certificate.cert_id) + '</div>'
        + '<button class="cert-available-btn" onclick="event.stopPropagation();downloadCertificate()">Download Certificate →</button>'
        + '<button style="width:100%;margin-top:8px;padding:7px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--ffb)" onclick="event.stopPropagation();shareOnLinkedIn()">Share on LinkedIn</button>'
        + '</div>'
      : allModulesDone
        ? '<div class="cert-available-card" onclick="startQuiz()">'
          + '<div style="font-size:32px;margin-bottom:8px">🎯</div>'
          + '<div class="cert-available-title">Ready for the Quiz!</div>'
          + '<div style="font-size:12px;color:rgba(255,255,255,.8);margin-bottom:10px">Pass with ' + (_course.pass_score||70) + '%+ to earn your certificate</div>'
          + '<button class="cert-available-btn">Take the Quiz →</button>'
          + '</div>'
        : '<div class="cert-locked-card">'
          + '<div class="cert-locked-icon">🔒</div>'
          + '<div class="cert-locked-title">Certificate Locked</div>'
          + '<div class="cert-locked-sub">Complete all ' + totalModules + ' modules and pass the quiz to earn your Belongix Certificate.</div>'
          + '</div>')
    + '</div>';

  var modulesListHtml = _modules.map(function(m, i) {
    var isDone = _completedModules.has(m.id) || (i < completedCount);
    var isActive = i === _currentModule;
    var cls = 'module-item' + (isActive ? ' active' : '') + (isDone ? ' completed' : '');
    return '<div class="' + cls + '" onclick="goToModule(' + i + ')">'
      + '<div class="module-num">' + (isDone ? '✓' : (i+1)) + '</div>'
      + '<div class="module-info"><div class="module-title">' + esc(m.title) + '</div><div class="module-dur">' + (m.duration_mins||10) + ' min</div></div>'
      + '</div>';
  }).join('');

  var currentMod = _modules[_currentModule] || {};
  var isLastModule = _currentModule === _modules.length - 1;
  var isModuleDone = _completedModules.has(currentMod.id) || (_currentModule < completedCount);

  var contentHtml = _mode === 'quiz' ? renderQuizHtml() :
    '<div class="content-card">'
    + '<div style="font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Module ' + (_currentModule+1) + ' of ' + _modules.length + '</div>'
    + '<h2>' + esc(currentMod.title || '') + '</h2>'
    + (currentMod.content || '<p style="color:var(--muted)">Content loading...</p>')
    + '<div class="module-nav">'
    + '<button class="nav-btn prev" onclick="prevModule()" ' + (_currentModule === 0 ? 'disabled' : '') + '>← Previous</button>'
    + (isLastModule
        ? (isModuleDone
            ? '<button class="nav-btn complete" onclick="startQuiz()">Take Quiz 🎯</button>'
            : '<button class="nav-btn complete" onclick="completeAndStartQuiz()">Complete & Take Quiz 🎯</button>')
        : isModuleDone
          ? '<button class="nav-btn next" onclick="nextModule()">Next Module →</button>'
          : '<button class="nav-btn next" onclick="completeModule()">Mark Complete & Next →</button>')
    + '</div></div>';

  document.getElementById('page-content').innerHTML =
    '<div class="course-header">'
    + '<div class="course-breadcrumb"><a href="courses.html">Courses</a> / ' + esc(_course.category||'') + '</div>'
    + '<div class="course-h-title">' + esc(_course.title||'') + '</div>'
    + '<div class="course-h-sub">' + esc(_course.subtitle||'') + '</div>'
    + '<div class="course-h-meta">'
    + '<div class="course-h-badge">📚 ' + _modules.length + ' modules</div>'
    + '<div class="course-h-badge">⏱ ' + (_course.duration_mins||0) + ' min</div>'
    + '<div class="course-h-badge">📊 ' + (_course.difficulty||'Beginner') + '</div>'
    + '<div class="course-h-badge">🏆 Free Certificate</div>'
    + '</div></div>'
    + '<div class="page-wrap">'
    + '<div>'
    + '<div class="card"><div class="card-title">📚 Course Modules</div>' + modulesListHtml + '</div>'
    + contentHtml
    + '</div>'
    + sidebarHtml
    + '</div>';
}

function renderQuizHtml() {
  if (_quizState.showResult) return renderResultHtml();
  var q = _questions[_quizState.current];
  if (!q) return '<div class="quiz-card"><p>No quiz questions available.</p></div>';
  var pct = Math.round((_quizState.current / _questions.length) * 100);
  var opts = [
    {key:'a', label: q.option_a},
    {key:'b', label: q.option_b},
    {key:'c', label: q.option_c},
    {key:'d', label: q.option_d}
  ];
  var answered = _quizState.answered;
  var chosen = _quizState.answers[_quizState.current];

  return '<div class="quiz-card">'
    + '<div class="quiz-header">'
    + '<div class="quiz-icon">🎯</div>'
    + '<div class="quiz-title">Final Quiz</div>'
    + '<div class="quiz-sub">Score ' + (_course.pass_score||70) + '%+ to earn your certificate</div>'
    + '</div>'
    + '<div class="quiz-progress"><div class="quiz-progress-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="quiz-q-num">Question ' + (_quizState.current+1) + ' of ' + _questions.length + '</div>'
    + '<div class="quiz-q-text">' + esc(q.question) + '</div>'
    + '<div class="quiz-options">'
    + opts.map(function(o) {
        var cls = 'quiz-option';
        if (answered) {
          if (o.key === q.correct) cls += ' correct';
          else if (o.key === chosen && o.key !== q.correct) cls += ' wrong';
        } else if (o.key === chosen) cls += ' selected';
        return '<div class="' + cls + '" onclick="selectAnswer(\'' + o.key + '\')">'
          + '<div class="quiz-opt-letter">' + o.key.toUpperCase() + '</div>'
          + '<div>' + esc(o.label) + '</div></div>';
      }).join('')
    + '</div>'
    + '<div class="quiz-explanation ' + (answered ? 'show' : '') + '">'
    + '💡 ' + esc(q.explanation || '') + '</div>'
    + '<button class="quiz-next-btn" onclick="nextQuestion()" '
    + (!answered ? 'disabled' : '') + '>'
    + (_quizState.current === _questions.length - 1 ? 'Submit Quiz →' : 'Next Question →')
    + '</button></div>';
}

function renderResultHtml() {
  var pct = Math.round((_quizState.score / _quizState.total) * 100);
  var passed = _quizState.passed;
  return '<div class="quiz-card"><div class="quiz-result">'
    + '<div class="result-icon">' + (passed ? '🏆' : '📚') + '</div>'
    + '<div class="result-title" style="color:' + (passed ? 'var(--green)' : '#EF4444') + '">' + (passed ? 'Congratulations! You Passed!' : 'Not Quite There Yet') + '</div>'
    + '<div class="result-score" style="color:' + (passed ? 'var(--green)' : '#EF4444') + '">' + pct + '%</div>'
    + '<div class="result-sub">You got ' + _quizState.score + ' out of ' + _quizState.total + ' questions correct.<br/>'
    + (passed ? 'Your certificate is being generated...' : 'You need ' + (_course.pass_score||70) + '% to pass. Review the modules and try again.') + '</div>'
    + (passed
      ? '<button class="result-btn primary" onclick="downloadCertificate()">🏆 Download Certificate</button>'
        + '<button class="result-btn secondary" onclick="shareOnLinkedIn()">Share on LinkedIn</button>'
      : '<button class="result-btn primary" onclick="retakeQuiz()">Retake Quiz</button>'
        + '<button class="result-btn secondary" onclick="backToModules()">Review Modules</button>')
    + '</div></div>';
}

/* ── NAVIGATION ── */
function goToModule(idx) {
  _currentModule = idx;
  _mode = 'content';
  renderPage();
  window.scrollTo(0, 0);
}

function prevModule() {
  if (_currentModule > 0) { _currentModule--; renderPage(); window.scrollTo(0,0); }
}

async function completeModule() {
  var mod = _modules[_currentModule];
  if (mod && _user && _course.id && !_completedModules.has(mod.id)) {
    _completedModules.add(mod.id);
    try {
      await dbPost('course_progress', { user_id: _user.id, course_id: _course.id, module_id: mod.id }, 'resolution=merge-duplicates');
      /* Update enrollment status */
      var isDone = _completedModules.size >= _modules.length;
      await dbPatch('course_enrollments', 'user_id=eq.'+_user.id+'&course_id=eq.'+_course.id, { status: isDone ? 'completed' : 'in_progress' });
    } catch(e) {}
  } else if (!_user) {
    /* Allow progress in localStorage for guests */
    if (mod) _completedModules.add(mod.id);
  }

  var isLast = _currentModule === _modules.length - 1;
  if (isLast) {
    /* Last module done — go straight to quiz */
    startQuiz();
  } else {
    _currentModule++;
    renderPage();
    window.scrollTo(0, 0);
  }
}

async function completeAndStartQuiz() {
  /* Mark last module complete, then start quiz */
  var mod = _modules[_currentModule];
  if (mod) {
    _completedModules.add(mod.id);
    if (_user && _course.id) {
      try {
        await dbPost('course_progress', { user_id: _user.id, course_id: _course.id, module_id: mod.id }, 'resolution=merge-duplicates');
        await dbPatch('course_enrollments', 'user_id=eq.'+_user.id+'&course_id=eq.'+_course.id, { status: 'completed' });
      } catch(e) {}
    }
  }
  startQuiz();
}

function nextModule() {
  if (_currentModule < _modules.length - 1) { _currentModule++; renderPage(); window.scrollTo(0,0); }
}

function startQuiz() {
  if (!_user) { showToast('Sign in to take the quiz and earn a certificate'); window.location.href='index.html'; return; }
  _mode = 'quiz';
  _quizState = { current: 0, answers: {}, answered: false, score: 0, total: _questions.length, passed: false, showResult: false };
  renderPage();
  window.scrollTo(0, 0);
}

function selectAnswer(key) {
  if (_quizState.answered) return;
  _quizState.answers[_quizState.current] = key;
  _quizState.answered = true;
  var q = _questions[_quizState.current];
  if (key === q.correct) _quizState.score++;
  renderPage();
}

async function nextQuestion() {
  if (!_quizState.answered) return;
  if (_quizState.current === _questions.length - 1) {
    /* Submit quiz */
    var pct = Math.round((_quizState.score / _quizState.total) * 100);
    _quizState.passed = pct >= (_course.pass_score || 70);
    _quizState.showResult = true;

    /* Save attempt */
    try {
      await dbPost('course_quiz_attempts', {
        user_id: _user.id, course_id: _course.id,
        score: _quizState.score, total: _quizState.total,
        passed: _quizState.passed, answers: _quizState.answers
      });
    } catch(e) {}

    /* Generate certificate if passed */
    if (_quizState.passed) {
      await generateCertificate(pct);
    }
    renderPage();
  } else {
    _quizState.current++;
    _quizState.answered = false;
    renderPage();
    window.scrollTo(0, 0);
  }
}

async function generateCertificate(score) {
  if (!_user) return;
  var certId = 'BX-' + new Date().getFullYear() + '-' + Math.random().toString(36).substr(2,6).toUpperCase();
  var nm = (_user.user_metadata && _user.user_metadata.full_name) || _user.email.split('@')[0];
  var certData = {
    cert_id: certId,
    user_id: _user.id,
    user_name: nm,
    user_email: _user.email,
    course_id: _course.id,
    course_title: _course.title,
    cert_title: _course.certificate_title || ('Certified: ' + _course.title),
    score: score,
    issued_at: new Date().toISOString(),
    is_valid: true
  };
  /* Always save to localStorage first — works without Supabase */
  _certificate = certData;
  try { localStorage.setItem('bx_cert_' + _course.id + '_' + (_user ? _user.id : 'x'), JSON.stringify(certData)); } catch(ex) {}

  /* Also try saving to Supabase (non-blocking) */
  dbPost('certificates', certData, 'resolution=merge-duplicates').catch(function(){});

  showToast('🏆 Certificate earned! ' + certId);
  renderPage();
}

function downloadCertificate() {
  if (!_certificate) {
    /* Try localStorage fallback */
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('bx_cert_' + (_course ? _course.id : '') + '_' + (_user ? _user.id : 'x')) || 'null'); } catch(ex) {}
    if (stored) { _certificate = stored; } else { showToast('Certificate not found. Please retake the quiz.'); return; }
  }
  renderCertificatePage(_certificate);
}

    + '.cert-desc{font-size:15px;color:#555;line-height:1.7;font-style:italic;max-width:500px;margin:0 auto 36px}'
    + '.cert-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;padding-top:24px;border-top:1px solid #f0eaff;gap:20px}'
    + '.cert-sig{text-align:center;flex:1}'
    + '.cert-sig-name{font-size:15px;font-weight:bold;color:#1a1a2e;font-family:system-ui,sans-serif}'
    + '.cert-sig-role{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;font-family:system-ui,sans-serif;margin-top:2px}'
    + '.cert-sig-line{width:140px;height:1px;background:#ddd;margin:10px auto 8px}'
    + '.cert-id-block{text-align:center;flex:1}'
    + '.cert-id{font-size:13px;font-weight:700;color:#6C3CE1;font-family:monospace;letter-spacing:1px}'

    + '.cert-seal{position:absolute;top:40px;right:50px;width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#6C3CE1,#4F46E5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,sans-serif;box-shadow:0 4px 20px rgba(108,60,225,0.4)}'
    + '.cert-seal-icon{font-size:24px;margin-bottom:2px}'

    + '.btn-print:hover{background:#5a2ed4}'
    + '.btn-share{background:#0077B5;color:#fff;border:none;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}'

    + '</style></head><body>'
    + '<div class="cert-wrap">'

  var win = window.open('', '_blank');
  if (win) {
    win.document.write(html);
    win.document.close();
  } else {
    showToast('Please allow popups to download your certificate');
  }
}

function shareOnLinkedIn() {
  if (!_certificate) { showToast('Complete the course first'); return; }
  var url = encodeURIComponent('https://www.belongix.in/verify.html?id=' + _certificate.cert_id);
  var title = encodeURIComponent('I just earned the "' + _certificate.cert_title + '" certificate from Belongix! Built for Indian professionals. Check it out:');
  window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + url + '&summary=' + title, '_blank');
}

function retakeQuiz() {
  _quizState = { current: 0, answers: {}, answered: false, score: 0, total: _questions.length, passed: false, showResult: false };
  renderPage();
}

function backToModules() {
  _mode = 'content';
  _currentModule = 0;
  renderPage();
}

function showToast(msg, onClick) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.onclick = onClick || null;
  t.style.cursor = onClick ? 'pointer' : 'default';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 5000);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
