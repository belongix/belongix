<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<style>
:root{--brand:#2D1B69;--brand2:#4C2FAA;--accent:#FF5C35;--green:#10B981;--ink:#0D0D1A;--muted:#5A5A7A;--subtle:#8B8BA8;--border:#E4E4F0;--bg:#F7F7FC;--white:#fff;--ff:'Sora',sans-serif;--ffb:'DM Sans',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ffb);background:var(--bg);color:var(--ink)}
.nav{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{font-family:var(--ff);font-size:20px;font-weight:800;color:var(--brand);text-decoration:none}
.nav-logo span{color:var(--accent)}
.nav-back{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;transition:.15s}
.nav-back:hover{border-color:var(--brand);color:var(--brand)}

/* LAYOUT */
.page-wrap{max-width:1100px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media(max-width:900px){.page-wrap{grid-template-columns:1fr}.sidebar{display:none}}

/* COURSE HEADER */
.course-header{background:linear-gradient(135deg,#1A0B4B,#2D1B69);border-radius:20px;padding:32px;margin-bottom:24px;color:#fff}
.course-breadcrumb{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:12px}
.course-breadcrumb a{color:rgba(255,255,255,.6);text-decoration:none}
.course-breadcrumb a:hover{color:#fff}
.course-h-title{font-family:var(--ff);font-size:26px;font-weight:800;line-height:1.2;margin-bottom:10px}
.course-h-sub{font-size:15px;color:rgba(255,255,255,.75);margin-bottom:20px}
.course-h-meta{display:flex;gap:16px;flex-wrap:wrap}
.course-h-badge{display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.1);padding:4px 10px;border-radius:20px}

/* MODULES */
.card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.card-title{font-family:var(--ff);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.module-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer;transition:.15s;border:1.5px solid transparent}
.module-item:hover{background:#F0EEFF;border-color:var(--brand)}
.module-item.active{background:#F0EEFF;border-color:var(--brand)}
.module-item.completed{background:#F0FDF4;border-color:var(--green)}
.module-num{width:32px;height:32px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);flex-shrink:0}
.module-item.active .module-num{background:var(--brand);color:#fff}
.module-item.completed .module-num{background:var(--green);color:#fff}
.module-info{flex:1;min-width:0}
.module-title{font-size:13px;font-weight:600;color:var(--ink)}
.module-dur{font-size:11px;color:var(--muted);margin-top:2px}
.module-check{font-size:16px;flex-shrink:0}

/* CONTENT AREA */
.content-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:28px;margin-bottom:16px}
.content-card h2{font-family:var(--ff);font-size:20px;font-weight:700;color:var(--ink);margin-bottom:16px}
.content-card h3{font-family:var(--ff);font-size:16px;font-weight:700;color:var(--ink);margin:20px 0 10px}
.content-card p{font-size:14px;color:#3A3A5A;line-height:1.8;margin-bottom:14px}
.content-card ul,.content-card ol{padding-left:20px;margin-bottom:14px}
.content-card li{font-size:14px;color:#3A3A5A;line-height:1.8;margin-bottom:6px}
.content-card blockquote{background:#F0EEFF;border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;font-size:14px;color:var(--ink);font-style:italic;line-height:1.7}
.content-card strong{color:var(--ink);font-weight:700}
.module-nav{display:flex;gap:10px;margin-top:20px}
.nav-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--ff);border:none;transition:.15s}
.nav-btn.prev{background:#F0EEFF;color:var(--brand)}
.nav-btn.prev:hover{background:var(--brand);color:#fff}
.nav-btn.next{background:var(--brand);color:#fff}
.nav-btn.next:hover{background:var(--brand2)}
.nav-btn.complete{background:var(--green);color:#fff}
.nav-btn.complete:hover{filter:brightness(1.1)}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}

/* QUIZ */
.quiz-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:28px}
.quiz-header{text-align:center;margin-bottom:28px}
.quiz-icon{font-size:48px;margin-bottom:12px}
.quiz-title{font-family:var(--ff);font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px}
.quiz-sub{font-size:14px;color:var(--muted)}
.quiz-progress{height:6px;background:var(--border);border-radius:3px;margin-bottom:28px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),#06B6D4);border-radius:3px;transition:width .4s}
.quiz-q-num{font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.quiz-q-text{font-size:16px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:20px}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.quiz-option{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:.15s;font-size:14px;color:var(--ink)}
.quiz-option:hover:not(.selected):not(.correct):not(.wrong){border-color:var(--brand);background:#F0EEFF}
.quiz-option.selected{border-color:var(--brand);background:#F0EEFF}
.quiz-option.correct{border-color:var(--green);background:#F0FDF4;color:#15803D;font-weight:600}
.quiz-option.wrong{border-color:#EF4444;background:#FEF2F2;color:#B91C1C}
.quiz-opt-letter{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:.15s}
.quiz-option.selected .quiz-opt-letter{background:var(--brand);color:#fff}
.quiz-option.correct .quiz-opt-letter{background:var(--green);color:#fff}
.quiz-option.wrong .quiz-opt-letter{background:#EF4444;color:#fff}
.quiz-explanation{background:#FEF9C3;border:1px solid #FDE68A;border-radius:10px;padding:12px 16px;font-size:13px;color:#92400E;margin-bottom:16px;display:none}
.quiz-explanation.show{display:block}
.quiz-next-btn{width:100%;padding:13px;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--ff);transition:.15s}
.quiz-next-btn:hover{background:var(--brand2)}
.quiz-next-btn:disabled{opacity:.4;cursor:not-allowed}

/* QUIZ RESULT */
.quiz-result{text-align:center;padding:20px 0}
.result-icon{font-size:64px;margin-bottom:16px}
.result-title{font-family:var(--ff);font-size:24px;font-weight:800;margin-bottom:8px}
.result-score{font-family:var(--ff);font-size:48px;font-weight:800;color:var(--brand);margin-bottom:4px}
.result-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
.result-btn{padding:13px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--ff);border:none;transition:.15s}
.result-btn.primary{background:var(--brand);color:#fff;margin-right:10px}
.result-btn.primary:hover{background:var(--brand2)}
.result-btn.secondary{background:#F0EEFF;color:var(--brand)}
.result-btn.secondary:hover{background:var(--brand);color:#fff}

/* SIDEBAR */
.sidebar{position:sticky;top:74px}
.progress-card{background:var(--brand);border-radius:16px;padding:20px;color:#fff;margin-bottom:16px}
.progress-title{font-size:13px;font-weight:600;opacity:.8;margin-bottom:8px}
.progress-pct{font-family:var(--ff);font-size:36px;font-weight:800;margin-bottom:8px}
.progress-bar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;background:#FCD34D;border-radius:4px;transition:width .5s}
.progress-detail{font-size:12px;opacity:.75}
.cert-locked-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;text-align:center}
.cert-locked-icon{font-size:40px;margin-bottom:10px}
.cert-locked-title{font-family:var(--ff);font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
.cert-locked-sub{font-size:12px;color:var(--muted);line-height:1.5}
.cert-available-card{background:linear-gradient(135deg,#065F46,#059669);border-radius:16px;padding:20px;text-align:center;cursor:pointer}
.cert-available-card:hover{filter:brightness(1.05)}
.cert-available-title{font-family:var(--ff);font-size:14px;font-weight:700;color:#fff;margin-bottom:6px}
.cert-available-btn{background:#FCD34D;color:#065F46;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:var(--ff);margin-top:10px;width:100%}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#0D0D1A;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:.3s;pointer-events:none;cursor:pointer}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

async function dbGet(table, qs) {
  try {
    var r = await fetch(_SBR + table + '?' + qs, { headers: Object.assign({}, _SBH, {'Prefer':''}) });
    var d = await r.json();
    return Array.isArray(d) ? d : [];
  } catch(e) { console.warn('dbGet error', table, e.message); return []; }
}
async function dbPost(table, body, prefer) {
  try {
    var h = Object.assign({}, _SBH);
    if (prefer) h['Prefer'] = prefer;
    await fetch(_SBR + table, { method: 'POST', headers: h, body: JSON.stringify(body) });
  } catch(e) { console.warn('dbPost error', table, e.message); }
}
async function dbPatch(table, qs, body) {
  try {
    await fetch(_SBR + table + '?' + qs, { method: 'PATCH', headers: _SBH, body: JSON.stringify(body) });
  } catch(e) { console.warn('dbPatch error', table, e.message); }
}

  {id:'web-development-fundamentals-2',title:'HTML — Semantic Structure & Forms',duration_mins:20,order_index:2,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: HTML — Semantic Structure & Forms</strong><br><span style="font-size:11px;color:#888">by Programming with Mosh · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=qz0aGYrrlhU" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>HTML — Structure That Means Something</h2><pre><code>&lt;!DOCTYPE html&gt;\n&lt;html lang="en"&gt;\n&lt;head&gt;\n  &lt;meta charset="UTF-8"&gt;\n  &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;\n  &lt;title&gt;Belongix — India Career Platform&lt;/title&gt;\n  &lt;link rel="stylesheet" href="style.css"&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;header&gt;&lt;nav&gt;...&lt;/nav&gt;&lt;/header&gt;\n  &lt;main&gt;\n    &lt;section class="hero"&gt;\n      &lt;h1&gt;Find Your Dream Job in India&lt;/h1&gt;\n      &lt;p&gt;120+ verified jobs, updated daily.&lt;/p&gt;\n      &lt;a href="/jobs" class="btn"&gt;Search Jobs &#8594;&lt;/a&gt;\n    &lt;/section&gt;\n  &lt;/main&gt;\n  &lt;footer&gt;...&lt;/footer&gt;\n  &lt;script src="app.js"&gt;&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;</code></pre><h3>Semantic Tags — Always Use These</h3><pre><code>&lt;header&gt; &lt;nav&gt; &lt;main&gt; &lt;section&gt;\n&lt;article&gt; &lt;aside&gt; &lt;footer&gt; &lt;figure&gt;</code></pre><h3>Forms</h3><pre><code>&lt;form action="/apply" method="POST"&gt;\n  &lt;label for="name"&gt;Full Name&lt;/label&gt;\n  &lt;input type="text" id="name" name="name" required placeholder="Keerthi Reddy"&gt;\n  &lt;label for="email"&gt;Email&lt;/label&gt;\n  &lt;input type="email" id="email" name="email" required&gt;\n  &lt;select name="experience"&gt;\n    &lt;option value="0"&gt;Fresher&lt;/option&gt;\n    &lt;option value="1-2"&gt;1-2 years&lt;/option&gt;\n    &lt;option value="3-5"&gt;3-5 years&lt;/option&gt;\n  &lt;/select&gt;\n  &lt;input type="file" name="resume" accept=".pdf"&gt;\n  &lt;button type="submit"&gt;Apply Now&lt;/button&gt;\n&lt;/form&gt;</code></pre><blockquote><strong>Practice:</strong> Build a complete job application form with name, email, phone, experience dropdown, city checkboxes, and resume upload.</blockquote>'},
  {id:'web-development-fundamentals-3',title:'CSS — Flexbox, Grid & Design Systems',duration_mins:20,order_index:3,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: CSS — Flexbox, Grid & Design Systems</strong><br><span style="font-size:11px;color:#888">by freeCodeCamp · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=OXGznpKZ_sA" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>CSS — Layout and Design</h2><h3>Flexbox</h3><pre><code>.nav { display:flex; justify-content:space-between; align-items:center; gap:16px; }\n.hero { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }\n.card-row { display:flex; gap:20px; flex-wrap:wrap; }\n.card { flex:1; min-width:280px; }</code></pre><h3>CSS Grid</h3><pre><code>.job-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:24px; }\n.app { display:grid; grid-template-areas:"header header" "sidebar main" "footer footer"; grid-template-columns:260px 1fr; min-height:100vh; }</code></pre><h3>CSS Variables</h3><pre><code>:root {\n  --brand:#6C3CE1; --accent:#FF6B35; --text:#1a1a2e;\n  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,0.08);\n}\n.btn { background:var(--brand); border-radius:var(--radius); }\n[data-theme="dark"] { --bg:#0f0f1a; --text:#f0f0f0; }</code></pre><h3>Box Model</h3><pre><code>.card { width:360px; padding:24px; border:1px solid #e0e0e0;\n  border-radius:var(--radius); margin-bottom:16px; box-sizing:border-box; }</code></pre>'},
  {id:'web-development-fundamentals-4',title:'JavaScript — DOM, Events & Fetch',duration_mins:20,order_index:4,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: JavaScript — DOM, Events & Fetch</strong><br><span style="font-size:11px;color:#888">by freeCodeCamp · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=W6NZfCO5SIk" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>JavaScript — Making Pages Interactive</h2><h3>Modern Variables</h3><pre><code>const API = "https://api.belongix.in";  // never changes\nlet page = 1;  // can change\nconst profile = { name:"Keerthi", city:"Bangalore", skills:["Python","React"] };\nconst { name, city } = profile;  // destructuring</code></pre><h3>DOM Manipulation</h3><pre><code>const btn = document.querySelector("#apply-btn");\nbtn.textContent = "Applied &#10003;";\nbtn.classList.add("success");\n\n// Create elements\nconst card = document.createElement("div");\ncard.className = "job-card";\ncard.innerHTML = `&lt;h3&gt;${job.title}&lt;/h3&gt;&lt;p&gt;${job.company}&lt;/p&gt;`;\ndocument.getElementById("list").appendChild(card);\n\n// Event delegation — efficient\ndocument.getElementById("list").addEventListener("click", e =&gt; {\n  if (e.target.matches(".apply-btn")) apply(e.target.dataset.id);\n});</code></pre><h3>Fetch API</h3><pre><code>async function loadJobs(city="Bangalore") {\n  try {\n    const r = await fetch(`${API}/jobs?city=${city}`);\n    if (!r.ok) throw new Error(`HTTP ${r.status}`);\n    const jobs = await r.json();\n    renderJobs(jobs);\n  } catch(err) { showError(err.message); }\n}</code></pre>'},
  {id:'web-development-fundamentals-5',title:'Responsive Design — Mobile-First',duration_mins:20,order_index:5,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: Responsive Design — Mobile-First</strong><br><span style="font-size:11px;color:#888">by freeCodeCamp · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=srvUrASNj0s" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>Responsive Design</h2><p>87% of Indian users are on mobile. Always design mobile-first.</p><h3>Mobile-First CSS</h3><pre><code>/* Mobile default */\n.grid { display:flex; flex-direction:column; gap:16px; padding:16px; }\n\n/* Tablet 768px+ */\n@media (min-width:768px) { .grid { flex-direction:row; flex-wrap:wrap; } }\n\n/* Desktop 1024px+ */\n@media (min-width:1024px) { .grid { display:grid; grid-template-columns:repeat(3,1fr); } }\n\n/* Fluid typography */\nh1 { font-size: clamp(24px, 5vw, 56px); }\n\n/* Dark mode */\n@media (prefers-color-scheme:dark) { body { background:#0f0f1a; color:#f0f0f0; } }</code></pre><h3>Responsive Nav</h3><pre><code>.nav-links { display:none; }\n.nav-links.open { display:flex; flex-direction:column; }\n@media (min-width:768px) { .nav-links { display:flex; } .hamburger { display:none; } }\ndocument.getElementById("menu-btn").onclick = () =&gt;\n  document.getElementById("nav").classList.toggle("open");</code></pre>'},

  {id:'python-development-2',title:'Functions, OOP & Modules',duration_mins:22,order_index:2,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: Functions, OOP & Modules</strong><br><span style="font-size:11px;color:#888">by freeCodeCamp · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=Ej_02ICOIgs" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>Functions & OOP</h2><pre><code>def calculate_tax(lpa, regime="new"):\n    if lpa <= 7: return 0\n    return lpa * 0.15\n\nclass Developer:\n    def __init__(self, name, city, exp):\n        self.name = name; self.city = city; self.exp = exp\n        self.applications = []\n\n    def apply(self, job):\n        self.applications.append(job)\n\n    @property\n    def score(self): return min(100, 30 + self.exp*10)\n\nclass SeniorDev(Developer):\n    def __init__(self, name, city, exp, leads=False):\n        super().__init__(name, city, exp)\n        self.leads = leads</code></pre>'},
  {id:'python-development-3',title:'File Handling, APIs & Error Management',duration_mins:23,order_index:3,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: File Handling, APIs & Error Management</strong><br><span style="font-size:11px;color:#888">by Corey Schafer · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=rfscVS0vtbw" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>Files, APIs & Exceptions</h2><pre><code>import json, requests\n\nwith open("jobs.json") as f: jobs = json.load(f)\n\ntry:\n    r = requests.get(url, timeout=10)\n    r.raise_for_status()\n    data = r.json()\nexcept requests.exceptions.Timeout: print("Timed out")\nexcept requests.exceptions.HTTPError as e: print(f"HTTP {e.response.status_code}")\nfinally: print("Request completed")</code></pre>'},
  {id:'python-development-4',title:'pandas — Data Analysis',duration_mins:24,order_index:4,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: pandas — Data Analysis</strong><br><span style="font-size:11px;color:#888">by freeCodeCamp · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=vmEHCJofslg" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>pandas Data Analysis</h2><pre><code>import pandas as pd\n\ndf = pd.read_csv("india_salaries_2026.csv")\nbangalore = df[df["city"] == "Bangalore"]\nhigh_pay = df[df["salary_lpa"] > 25]\n\nstats = df.groupby("city").agg(\n    avg=("salary_lpa","mean"), jobs=("role","count")\n).round(2).sort_values("avg", ascending=False)\n\ndf["monthly"] = df["salary_lpa"] * 100000 / 12\ndf["is_product"] = ~df["company"].isin(["TCS","Infosys","Wipro"])</code></pre>'},
  {id:'python-development-5',title:'Flask & FastAPI — Build REST APIs',duration_mins:25,order_index:5,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: Flask & FastAPI — Build REST APIs</strong><br><span style="font-size:11px;color:#888">by freeCodeCamp · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=Z1RJmh_OqeA" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>FastAPI REST APIs</h2><pre><code>from fastapi import FastAPI, Query\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\nclass Job(BaseModel):\n    title: str; company: str; city: str; salary_lpa: float\n\n@app.get("/jobs")\nasync def get_jobs(city: str = Query(None), min_salary: float = 0):\n    result = db\n    if city: result = [j for j in result if j["city"]==city]\n    return {"data": result}\n\n@app.post("/jobs", status_code=201)\nasync def create_job(job: Job): return job\n\n# uvicorn main:app --reload → docs at /docs</code></pre>'},
  {id:'python-development-6',title:'Django — Full Web Framework',duration_mins:26,order_index:6,is_free_preview:false,content:'<div style="background:#f0f4ff;border-radius:12px;padding:20px;margin:0 0 24px 0;border-left:4px solid #6C3CE1"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:20px">&#127909;</span><div><strong style="color:#1a1a2e;font-size:14px">Watch: Django — Full Web Framework</strong><br><span style="font-size:11px;color:#888">by freeCodeCamp · Free on YouTube</span></div></div><a href="https://www.youtube.com/watch?v=F5mRW0jo-U4" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#FF0000;color:#fff;padding:9px 18px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px">&#9654; Watch Free on YouTube</a></div><h2>Django Framework</h2><pre><code>from django.db import models\n\nclass Job(models.Model):\n    title = models.CharField(max_length=200)\n    company = models.CharField(max_length=200)\n    salary_lpa = models.FloatField()\n    city = models.CharField(max_length=100)\n    posted = models.DateTimeField(auto_now_add=True)\n\n# DRF\nfrom rest_framework import serializers, viewsets\n\nclass JobSerializer(serializers.ModelSerializer):\n    class Meta: model = Job; fields = "__all__"\n\nclass JobViewSet(viewsets.ModelViewSet):\n    queryset = Job.objects.all()\n    serializer_class = JobSerializer</code></pre>'},

window.addEventListener('load', async function() {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug') || 'salary-negotiation';

  try {
    var sess = await sb.auth.getSession();
    if (sess.data && sess.data.session && sess.data.session.user) {
      _user = sess.data.session.user;
    }
  } catch(e) {}

  try {
    await loadCourse(slug);
  } catch(err) {
    console.error('loadCourse error:', err);
    document.getElementById('page-content').innerHTML =
      '<div style="text-align:center;padding:80px;color:#666">'
      + '<div style="font-size:48px;margin-bottom:16px">⚠️</div>'
      + '<h2 style="margin-bottom:12px">Something went wrong</h2>'
      + '<p style="margin-bottom:20px">Error: ' + (err.message||err) + '</p>'
      + '<a href="courses.html" style="color:#6C3CE1;font-weight:600">← Back to Courses</a>'
      + '</div>';
  }
});

async function loadCourse(slug) {
  /* Use plain XHR-style fetch — supabase-js causes DataCloneError in this env */
  var H = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Accept': 'application/json' };
  var base = SB_URL + '/rest/v1/';

  async function dbGet(table, query) {
    try {
      var r = await fetch(base + table + '?' + query, { method: 'GET', headers: H });
      if (!r.ok) { console.warn('DB ' + table + ' HTTP ' + r.status); return []; }
      var d = await r.json();
      return Array.isArray(d) ? d : [];
    } catch(e) { console.warn('DB fetch error (' + table + '):', e.message); return []; }
  }

  /* --- 1. Load course --- */
  var courses = await dbGet('belongix_courses', 'slug=eq.' + encodeURIComponent(slug) + '&select=*&limit=1');
  if (courses.length) _course = courses[0];

  /* --- 2. Fallback to static if not in DB --- */
  if (!_course && STATIC_COURSES[slug]) {
    _course    = STATIC_COURSES[slug];
    _modules   = STATIC_MODULES[slug]   || [];
    _questions = STATIC_QUESTIONS[slug] || [];
    /* Static data loaded — skip DB module fetch, go straight to render */
  } else {
    /* Course found in DB — try to load modules from DB, then fall back to static */
    if (_course && _course.id) {
      var mods = await dbGet('course_modules', 'course_id=eq.' + _course.id + '&select=*&order=order_index');
      if (mods.length) _modules = mods;
      var quiz = await dbGet('course_quiz_questions', 'course_id=eq.' + _course.id + '&select=*&order=order_index');
      if (quiz.length) _questions = quiz;
    }
    /* DB modules empty — fall back to static content */
    if ((!_modules || _modules.length === 0) && STATIC_MODULES[slug]) {
      _modules   = STATIC_MODULES[slug];
      _questions = STATIC_QUESTIONS[slug] || [];
    }
  }

  /* --- 4. Load user data (enrollments, progress, cert) --- */
  if (_user && _course && _course.id) {
    var enr = await dbGet('course_enrollments', 'user_id=eq.' + _user.id + '&course_id=eq.' + _course.id + '&select=*&limit=1');
    _enrollment = enr[0] || null;

    var prog = await dbGet('course_progress', 'user_id=eq.' + _user.id + '&course_id=eq.' + _course.id + '&select=module_id');
    prog.forEach(function(p){ _completedModules.add(p.module_id); });

    /* Also load from localStorage — works even when Supabase tables don't exist yet */
    try {
      var lsKey = 'bx_progress_' + slug + '_' + _user.id;
      var lsProgress = JSON.parse(localStorage.getItem(lsKey) || '[]');
      lsProgress.forEach(function(mid){ _completedModules.add(mid); });
    } catch(ex) {}

    var certs = await dbGet('certificates', 'user_id=eq.' + _user.id + '&course_id=eq.' + _course.id + '&select=*&limit=1');
    _certificate = certs[0] || null;
  }

  /* If course loaded but has no modules at all — show Coming Soon */
  if (_course && _modules.length === 0) {
    _modules = [{
      id: 'placeholder',
      title: 'Content Coming Soon',
      duration_mins: 5,
      order_index: 1,
      is_free_preview: true,
      content: '<div style="text-align:center;padding:40px 20px">'
        + '<div style="font-size:48px;margin-bottom:16px">🚀</div>'
        + '<h2 style="margin-bottom:12px">Content Coming Soon!</h2>'
        + '<p style="color:var(--muted);max-width:400px;margin:0 auto 24px">We are adding full course content for <strong>' + (_course.title||'this course') + '</strong> very soon. Check back shortly!</p>'
        + '<a href="courses.html" style="display:inline-block;background:var(--brand);color:#fff;padding:10px 24px;border-radius:10px;text-decoration:none;font-weight:600">← Browse Other Courses</a>'
        + '</div>'
    }];
  }

  if (!_course) {
    document.getElementById('page-content').innerHTML = '<div style="text-align:center;padding:80px;color:var(--muted)">Course not found. <a href="courses.html">Browse all courses →</a></div>';
    return;
  }

  /* Load progress from localStorage for ALL users (logged in + guests) */
  var _slug = _course.slug || _course.id;
  var _uid = _user ? _user.id : 'guest';
  try {
    var lsKey = 'bx_progress_' + _slug + '_' + _uid;
    var lsProgress = JSON.parse(localStorage.getItem(lsKey) || '[]');
    lsProgress.forEach(function(mid){ _completedModules.add(mid); });
  } catch(ex) {}

  /* Restore last visited module position */
  var savedModule = loadCurrentModuleFromLocalStorage(_slug, _uid);
  if (savedModule > 0 && savedModule < _modules.length) {
    _currentModule = savedModule;
  }

  /* Check localStorage for existing certificate if DB cert not found */
  if (!_certificate && _course && _user) {
    try {
      var stored = localStorage.getItem('bx_cert_' + _course.id + '_' + _user.id);
      if (stored) _certificate = JSON.parse(stored);
    } catch(ex) {}
  }

  /* Auto-enroll if logged in and not enrolled */
  if (_user && !_enrollment && _course.id) {
    try {
      await dbPost('course_enrollments', { user_id: _user.id, course_id: _course.id, status: 'in_progress' }, 'resolution=merge-duplicates');
    } catch(e) {}
  }

  /* If certificate earned, show certificate immediately */
  if (_certificate) {
    _mode = 'result';
  }

  renderPage();
}

function renderPage() {
  var completedCount = _completedModules.size;
  var totalModules = _modules.length;
  var pct = totalModules > 0 ? Math.round((completedCount / totalModules) * 100) : 0;
  var allModulesDone = completedCount >= totalModules && totalModules > 0;
  var hasCert = !!_certificate;

  var sidebarHtml = '<div class="sidebar">'
    + '<div class="progress-card">'
    + '<div class="progress-title">Your Progress</div>'
    + '<div class="progress-pct">' + pct + '%</div>'
    + '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="progress-detail">' + completedCount + ' of ' + totalModules + ' modules completed</div>'
    + '</div>'
    + (hasCert
      ? '<div class="cert-available-card" onclick="downloadCertificate()">'
        + '<div style="font-size:32px;margin-bottom:8px">🏆</div>'
        + '<div class="cert-available-title">Certificate Earned!</div>'
        + '<div style="font-size:12px;color:rgba(255,255,255,.8);margin-bottom:4px">' + esc(_certificate.cert_id) + '</div>'
        + '<button class="cert-available-btn" onclick="event.stopPropagation();downloadCertificate()">Download Certificate →</button>'
        + '<button style="width:100%;margin-top:8px;padding:7px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--ffb)" onclick="event.stopPropagation();shareOnLinkedIn()">Share on LinkedIn</button>'
        + '</div>'
      : allModulesDone
        ? '<div class="cert-available-card" onclick="startQuiz()">'
          + '<div style="font-size:32px;margin-bottom:8px">🎯</div>'
          + '<div class="cert-available-title">Ready for the Quiz!</div>'
          + '<div style="font-size:12px;color:rgba(255,255,255,.8);margin-bottom:10px">Pass with ' + (_course.pass_score||70) + '%+ to earn your certificate</div>'
          + '<button class="cert-available-btn">Take the Quiz →</button>'
          + '</div>'
        : '<div class="cert-locked-card">'
          + '<div class="cert-locked-icon">🔒</div>'
          + '<div class="cert-locked-title">Certificate Locked</div>'
          + '<div class="cert-locked-sub">Complete all ' + totalModules + ' modules and pass the quiz to earn your Belongix Certificate.</div>'
          + '</div>')
    + '</div>';

  var modulesListHtml = _modules.map(function(m, i) {
    var isDone = _completedModules.has(m.id) || (i < completedCount);
    var isActive = i === _currentModule;
    var cls = 'module-item' + (isActive ? ' active' : '') + (isDone ? ' completed' : '');
    return '<div class="' + cls + '" onclick="goToModule(' + i + ')">'
      + '<div class="module-num">' + (isDone ? '✓' : (i+1)) + '</div>'
      + '<div class="module-info"><div class="module-title">' + esc(m.title) + '</div><div class="module-dur">' + (m.duration_mins||10) + ' min</div></div>'
      + '</div>';
  }).join('');

  var currentMod = _modules[_currentModule] || {};
  var isLastModule = _currentModule === _modules.length - 1;
  var isModuleDone = _completedModules.has(currentMod.id) || (_currentModule < completedCount);

  var contentHtml = _mode === 'quiz' ? renderQuizHtml() :
    '<div class="content-card">'
    + '<div style="font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Module ' + (_currentModule+1) + ' of ' + _modules.length + '</div>'
    + '<h2>' + esc(currentMod.title || '') + '</h2>'
    + (currentMod.content || '<p style="color:var(--muted)">Content loading...</p>')
    + '<div class="module-nav">'
    + '<button class="nav-btn prev" onclick="prevModule()" ' + (_currentModule === 0 ? 'disabled' : '') + '>← Previous</button>'
    + (isLastModule
        ? (isModuleDone
            ? '<button class="nav-btn complete" onclick="startQuiz()">Take Quiz 🎯</button>'
            : '<button class="nav-btn complete" onclick="completeAndStartQuiz()">Complete & Take Quiz 🎯</button>')
        : isModuleDone
          ? '<button class="nav-btn next" onclick="nextModule()">Next Module →</button>'
          : '<button class="nav-btn next" onclick="completeModule()">Mark Complete & Next →</button>')
    + '</div></div>';

  document.getElementById('page-content').innerHTML =
    '<div class="course-header">'
    + '<div class="course-breadcrumb"><a href="courses.html">Courses</a> / ' + esc(_course.category||'') + '</div>'
    + '<div class="course-h-title">' + esc(_course.title||'') + '</div>'
    + '<div class="course-h-sub">' + esc(_course.subtitle||'') + '</div>'
    + '<div class="course-h-meta">'
    + '<div class="course-h-badge">📚 ' + _modules.length + ' modules</div>'
    + '<div class="course-h-badge">⏱ ' + (_course.duration_mins||0) + ' min</div>'
    + '<div class="course-h-badge">📊 ' + (_course.difficulty||'Beginner') + '</div>'
    + '<div class="course-h-badge">🏆 Free Certificate</div>'
    + '</div></div>'
    + '<div class="page-wrap">'
    + '<div>'
    + '<div class="card"><div class="card-title">📚 Course Modules</div>' + modulesListHtml + '</div>'
    + contentHtml
    + '</div>'
    + sidebarHtml
    + '</div>';
}

function renderQuizHtml() {
  if (_quizState.showResult) return renderResultHtml();
  var q = _questions[_quizState.current];
  if (!q) return '<div class="quiz-card"><p>No quiz questions available.</p></div>';
  var pct = Math.round((_quizState.current / _questions.length) * 100);
  var opts = [
    {key:'a', label: q.option_a},
    {key:'b', label: q.option_b},
    {key:'c', label: q.option_c},
    {key:'d', label: q.option_d}
  ];
  var answered = _quizState.answered;
  var chosen = _quizState.answers[_quizState.current];

  return '<div class="quiz-card">'
    + '<div class="quiz-header">'
    + '<div class="quiz-icon">🎯</div>'
    + '<div class="quiz-title">Final Quiz</div>'
    + '<div class="quiz-sub">Score ' + (_course.pass_score||70) + '%+ to earn your certificate</div>'
    + '</div>'
    + '<div class="quiz-progress"><div class="quiz-progress-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="quiz-q-num">Question ' + (_quizState.current+1) + ' of ' + _questions.length + '</div>'
    + '<div class="quiz-q-text">' + esc(q.question) + '</div>'
    + '<div class="quiz-options">'
    + opts.map(function(o) {
        var cls = 'quiz-option';
        if (answered) {
          if (o.key === q.correct) cls += ' correct';
          else if (o.key === chosen && o.key !== q.correct) cls += ' wrong';
        } else if (o.key === chosen) cls += ' selected';
        return '<div class="' + cls + '" onclick="selectAnswer(\'' + o.key + '\')">'
          + '<div class="quiz-opt-letter">' + o.key.toUpperCase() + '</div>'
          + '<div>' + esc(o.label) + '</div></div>';
      }).join('')
    + '</div>'
    + '<div class="quiz-explanation ' + (answered ? 'show' : '') + '">'
    + '💡 ' + esc(q.explanation || '') + '</div>'
    + '<button class="quiz-next-btn" onclick="nextQuestion()" '
    + (!answered ? 'disabled' : '') + '>'
    + (_quizState.current === _questions.length - 1 ? 'Submit Quiz →' : 'Next Question →')
    + '</button></div>';
}

function renderResultHtml() {
  var pct = Math.round((_quizState.score / _quizState.total) * 100);
  var passed = _quizState.passed;
  return '<div class="quiz-card"><div class="quiz-result">'
    + '<div class="result-icon">' + (passed ? '🏆' : '📚') + '</div>'
    + '<div class="result-title" style="color:' + (passed ? 'var(--green)' : '#EF4444') + '">' + (passed ? 'Congratulations! You Passed!' : 'Not Quite There Yet') + '</div>'
    + '<div class="result-score" style="color:' + (passed ? 'var(--green)' : '#EF4444') + '">' + pct + '%</div>'
    + '<div class="result-sub">You got ' + _quizState.score + ' out of ' + _quizState.total + ' questions correct.<br/>'
    + (passed ? 'Your certificate is being generated...' : 'You need ' + (_course.pass_score||70) + '% to pass. Review the modules and try again.') + '</div>'
    + (passed
      ? '<button class="result-btn primary" onclick="downloadCertificate()">🏆 Download Certificate</button>'
        + '<button class="result-btn secondary" onclick="shareOnLinkedIn()">Share on LinkedIn</button>'
      : '<button class="result-btn primary" onclick="retakeQuiz()">Retake Quiz</button>'
        + '<button class="result-btn secondary" onclick="backToModules()">Review Modules</button>')
    + '</div></div>';
}

/* ── NAVIGATION ── */
function goToModule(idx) {
  _currentModule = idx;
  _mode = 'content';
  saveCurrentModuleToLocalStorage(_course.slug || _course.id, _user ? _user.id : null, idx);
  renderPage();
  window.scrollTo(0, 0);
}

function prevModule() {
  if (_currentModule > 0) {
    _currentModule--;
    saveCurrentModuleToLocalStorage(_course.slug || _course.id, _user ? _user.id : null, _currentModule);
    renderPage();
    window.scrollTo(0,0);
  }
}

function saveProgressToLocalStorage(slug, userId, moduleId) {
  try {
    var key = 'bx_progress_' + slug + '_' + (userId || 'guest');
    var arr = JSON.parse(localStorage.getItem(key) || '[]');
    if (arr.indexOf(moduleId) === -1) arr.push(moduleId);
    localStorage.setItem(key, JSON.stringify(arr));
  } catch(ex) {}
}

function saveCurrentModuleToLocalStorage(slug, userId, moduleIndex) {
  try {
    var key = 'bx_current_' + slug + '_' + (userId || 'guest');
    localStorage.setItem(key, String(moduleIndex));
  } catch(ex) {}
}

function loadCurrentModuleFromLocalStorage(slug, userId) {
  try {
    var key = 'bx_current_' + slug + '_' + (userId || 'guest');
    var val = localStorage.getItem(key);
    return val !== null ? parseInt(val, 10) : 0;
  } catch(ex) { return 0; }
}

async function completeModule() {
  var mod = _modules[_currentModule];
  if (mod && !_completedModules.has(mod.id)) {
    _completedModules.add(mod.id);

    /* Always save to localStorage first — works for everyone */
    saveProgressToLocalStorage(_course.slug || _course.id, _user ? _user.id : null, mod.id);

    /* Also try Supabase if logged in */
    if (_user && _course.id) {
      try {
        await dbPost('course_progress', { user_id: _user.id, course_id: _course.id, module_id: mod.id }, 'resolution=merge-duplicates');
        var isDone = _completedModules.size >= _modules.length;
        await dbPatch('course_enrollments', 'user_id=eq.'+_user.id+'&course_id=eq.'+_course.id, { status: isDone ? 'completed' : 'in_progress' });
      } catch(e) {}
    }
  }

  var isLast = _currentModule === _modules.length - 1;
  if (isLast) {
    startQuiz();
  } else {
    _currentModule++;
    saveCurrentModuleToLocalStorage(_course.slug || _course.id, _user ? _user.id : null, _currentModule);
    renderPage();
    window.scrollTo(0, 0);
  }
}

async function completeAndStartQuiz() {
  var mod = _modules[_currentModule];
  if (mod && !_completedModules.has(mod.id)) {
    _completedModules.add(mod.id);

    /* Always save to localStorage first */
    saveProgressToLocalStorage(_course.slug || _course.id, _user ? _user.id : null, mod.id);

    if (_user && _course.id) {
      try {
        await dbPost('course_progress', { user_id: _user.id, course_id: _course.id, module_id: mod.id }, 'resolution=merge-duplicates');
        await dbPatch('course_enrollments', 'user_id=eq.'+_user.id+'&course_id=eq.'+_course.id, { status: 'completed' });
      } catch(e) {}
    }
  }
  startQuiz();
}

function nextModule() {
  if (_currentModule < _modules.length - 1) {
    _currentModule++;
    saveCurrentModuleToLocalStorage(_course.slug || _course.id, _user ? _user.id : null, _currentModule);
    renderPage();
    window.scrollTo(0,0);
  }
}

function startQuiz() {
  if (!_user) { showToast('Sign in to take the quiz and earn a certificate'); window.location.href='index.html'; return; }
  _mode = 'quiz';
  _quizState = { current: 0, answers: {}, answered: false, score: 0, total: _questions.length, passed: false, showResult: false };
  renderPage();
  window.scrollTo(0, 0);
}

function selectAnswer(key) {
  if (_quizState.answered) return;
  _quizState.answers[_quizState.current] = key;
  _quizState.answered = true;
  var q = _questions[_quizState.current];
  if (key === q.correct) _quizState.score++;
  renderPage();
}

async function nextQuestion() {
  if (!_quizState.answered) return;
  if (_quizState.current === _questions.length - 1) {
    /* Submit quiz */
    var pct = Math.round((_quizState.score / _quizState.total) * 100);
    _quizState.passed = pct >= (_course.pass_score || 70);
    _quizState.showResult = true;

    /* Save attempt */
    try {
      await dbPost('course_quiz_attempts', {
        user_id: _user.id, course_id: _course.id,
        score: _quizState.score, total: _quizState.total,
        passed: _quizState.passed, answers: _quizState.answers
      });
    } catch(e) {}

    /* Generate certificate if passed */
    if (_quizState.passed) {
      await generateCertificate(pct);
    }
    renderPage();
  } else {
    _quizState.current++;
    _quizState.answered = false;
    renderPage();
    window.scrollTo(0, 0);
  }
}

async function generateCertificate(score) {
  if (!_user) return;
  var certId = 'BX-' + new Date().getFullYear() + '-' + Math.random().toString(36).substr(2,6).toUpperCase();
  var nm = (_user.user_metadata && _user.user_metadata.full_name) || _user.email.split('@')[0];
  var certData = {
    cert_id: certId,
    user_id: _user.id,
    user_name: nm,
    user_email: _user.email,
    course_id: _course.id,
    course_title: _course.title,
    cert_title: _course.certificate_title || ('Certified: ' + _course.title),
    score: score,
    issued_at: new Date().toISOString(),
    is_valid: true
  };
  /* Always save to localStorage first — works without Supabase */
  _certificate = certData;
  try { localStorage.setItem('bx_cert_' + _course.id + '_' + (_user ? _user.id : 'x'), JSON.stringify(certData)); } catch(ex) {}

  /* Also try saving to Supabase (non-blocking) */
  dbPost('certificates', certData, 'resolution=merge-duplicates').catch(function(){});

  showToast('🏆 Certificate earned! ' + certId);
  renderPage();
}

function downloadCertificate() {
  if (!_certificate) {
    /* Try localStorage fallback */
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('bx_cert_' + (_course ? _course.id : '') + '_' + (_user ? _user.id : 'x')) || 'null'); } catch(ex) {}
    if (stored) { _certificate = stored; } else { showToast('Certificate not found. Please retake the quiz.'); return; }
  }
  renderCertificatePage(_certificate);
}

    + '.cert-sig{text-align:center;flex:1}'
    + '.cert-sig-name{font-size:15px;font-weight:bold;color:#1a1a2e;font-family:system-ui,sans-serif}'
    + '.cert-sig-role{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;font-family:system-ui,sans-serif;margin-top:2px}'

    + '.cert-id-block{text-align:center;flex:1}'
    + '.cert-id{font-size:13px;font-weight:700;color:#6C3CE1;font-family:monospace;letter-spacing:1px}'

    + 'function shareLinkedIn(){'
    + 'var url=encodeURIComponent("https://www.belongix.in/certificate.html?id=' + certId + '");'
    + 'var txt=encodeURIComponent("Excited to share that I earned the \"' + certTitle + '\" certificate from @Belongix! India-specific career learning platform. #Belongix #CareerGrowth #India");'

  var win = window.open('', '_blank');
  if (win) {
    win.document.write(html);
    win.document.close();
  } else {
    showToast('Please allow popups to download your certificate');
  }
}

function shareOnLinkedIn() {
  if (!_certificate) { showToast('Complete the course first'); return; }
  var url = encodeURIComponent('https://www.belongix.in/certificate.html?id=' + _certificate.cert_id);
  var title = encodeURIComponent('I just earned the "' + _certificate.cert_title + '" certificate from Belongix! Built for Indian professionals. Check it out:');
  window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + url + '&summary=' + title, '_blank');
}

function retakeQuiz() {
  _quizState = { current: 0, answers: {}, answered: false, score: 0, total: _questions.length, passed: false, showResult: false };
  renderPage();
}

function backToModules() {
  _mode = 'content';
  _currentModule = 0;
  renderPage();
}

function showToast(msg, onClick) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.onclick = onClick || null;
  t.style.cursor = onClick ? 'pointer' : 'default';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 5000);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
