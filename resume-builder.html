<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Builder — Belongix</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="top"><a class="brand" href="dashboard.html">Belong<span>ix</span></a><nav class="topnav"><a href="dashboard.html">Dashboard</a><a href="career-profile.html">Profile</a><a class="active" href="resume-builder.html">Resume</a><a href="jobs.html">Jobs</a><a href="applications.html">Applications</a></nav><div class="topright"><button class="btn" onclick="runATS()">ATS Score</button><button class="btn primary" onclick="window.print()">Export PDF</button></div></header><main class="main"><div class="pagehead"><div><h1>Resume Builder</h1><p>Rezi-inspired workflow: structured editor on the left, live ATS-friendly preview on the right.</p></div><div class="score"><div class="scorecircle" id="score">—</div><span class="muted">ATS readiness</span></div></div><div class="resume-layout"><section class="editor"><div class="card"><h2>Contact</h2><div class="row"><div class="field"><label>Name</label><input id="name" oninput="save()"></div><div class="field"><label>Professional title</label><input id="title" oninput="save()"></div></div><div class="row"><div class="field"><label>Email</label><input id="email" oninput="save()"></div><div class="field"><label>Phone</label><input id="phone" oninput="save()"></div></div><div class="row"><div class="field"><label>City</label><input id="city" oninput="save()"></div><div class="field"><label>LinkedIn / portfolio</label><input id="links" oninput="save()"></div></div></div><div class="card" style="margin-top:12px"><h2>Summary</h2><div class="field"><textarea id="summary" oninput="save()" placeholder="2–4 lines focused on role, skills and impact"></textarea></div><button class="btn" onclick="improveSummary()">✨ Improve with AI</button></div><div class="card" style="margin-top:12px"><h2>Experience</h2><div id="exp"></div><button class="btn" onclick="addExp()">+ Add position</button></div><div class="card" style="margin-top:12px"><h2>Education</h2><div id="education"></div><button class="btn" onclick="addEdu()">+ Add education</button></div><div class="card" style="margin-top:12px"><h2>Skills</h2><div id="skillchips" class="chips" style="margin-bottom:8px"></div><div style="display:flex;gap:8px"><input id="skill" placeholder="Java, Spring Boot, SQL" onkeydown="if(event.key==='Enter')addSkill()"><button class="btn" onclick="addSkill()">Add</button></div></div><div class="card" style="margin-top:12px"><h2>Job targeting</h2><div class="field"><label>Job description</label><textarea id="jd" oninput="save()" placeholder="Paste a target job description for keyword analysis"></textarea></div><button class="btn primary" onclick="runATS()">Analyze match</button></div></section><section class="preview-wrap"><div class="resume-page" id="preview"></div></section></div></main><div class="toast"></div><script>let r=BX.local('resume')||{name:'',title:'',email:'',phone:'',city:'',links:'',summary:'',exp:[],edu:[],skills:[],jd:''};function sync(){['name','title','email','phone','city','links','summary','jd'].forEach(k=>document.getElementById(k).value=r[k]||'');render()}function save(){['name','title','email','phone','city','links','summary','jd'].forEach(k=>r[k]=document.getElementById(k).value);BX.local('resume',r);renderPreview()}function render(){syncFields();renderExp();renderEdu();document.getElementById('skillchips').innerHTML=r.skills.map((s,i)=>'<span class="chip">'+BX.esc(s)+' <button onclick="r.skills.splice('+i+',1);save();render()">×</button></span>').join('');renderPreview()}function syncFields(){['name','title','email','phone','city','links','summary','jd'].forEach(k=>{let e=document.getElementById(k);if(e)e.value=r[k]||''})}function renderExp(){document.getElementById('exp').innerHTML=r.exp.length?r.exp.map((x,i)=>'<div class="card" style="background:#fafafa;margin-bottom:8px"><div class="row"><div class="field"><label>Job title</label><input value="'+BX.esc(x.title)+'" oninput="r.exp['+i+'].title=this.value;save()"></div><div class="field"><label>Company</label><input value="'+BX.esc(x.company)+'" oninput="r.exp['+i+'].company=this.value;save()"></div></div><div class="row"><div class="field"><label>Dates</label><input value="'+BX.esc(x.dates)+'" oninput="r.exp['+i+'].dates=this.value;save()"></div><div class="field"><label>Location</label><input value="'+BX.esc(x.location)+'" oninput="r.exp['+i+'].location=this.value;save()"></div></div><div class="field"><label>Achievements — one per line</label><textarea oninput="r.exp['+i+'].bullets=this.value.split('\\n');save()">'+BX.esc((x.bullets||[]).join('\n'))+'</textarea></div><button class="btn danger" onclick="r.exp.splice('+i+',1);save();render()">Remove</button></div>').join(''):'<div class="empty">Add your most relevant experience.</div>'}function renderEdu(){document.getElementById('education').innerHTML=r.edu.length?r.edu.map((x,i)=>'<div class="listitem"><div><input value="'+BX.esc(x.degree)+'" oninput="r.edu['+i+'].degree=this.value;save()"><input value="'+BX.esc(x.school)+'" oninput="r.edu['+i+'].school=this.value;save()" style="margin-left:6px"></div><button class="btn danger" onclick="r.edu.splice('+i+',1);save();render()">Remove</button></div>').join(''):'<div class="empty">Add education.</div>'}function addExp(){r.exp.push({title:'',company:'',dates:'',location:'',bullets:['']});save();render()}function addEdu(){r.edu.push({degree:'',school:''});save();render()}function addSkill(){let v=document.getElementById('skill').value.trim();if(v&&!r.skills.includes(v))r.skills.push(v);document.getElementById('skill').value='';save();render()}function text(){return [r.name,r.title,r.summary,...r.skills,...r.exp.flatMap(x=>[x.title,x.company,...(x.bullets||[])]),...r.edu.flatMap(x=>[x.degree,x.school])].join(' ').toLowerCase()}function runATS(){let t=text(),checks=[r.name,r.email,r.summary,r.exp.length,r.edu.length,r.skills.length>=3,r.jd?1:0];let score=Math.round(checks.filter(Boolean).length/checks.length*70+Math.min(r.skills.length,8)/8*20+(r.jd?10:0));document.getElementById('score').textContent=score;BX.local('ats',{score});BX.toast('ATS score updated: '+score)}function improveSummary(){if(!r.summary){BX.toast('Add a summary first');return}r.summary=r.summary.replace(/\bI\b/gi,'Professional').replace(/worked on/gi,'delivered');save();BX.toast('Draft improved — review before saving')}function renderPreview(){let p=document.getElementById('preview');if(!p)return;p.innerHTML='<h1>'+BX.esc(r.name||'Your Name')+'</h1><div class="rtitle">'+BX.esc(r.title||'Professional Title')+'</div><div class="contact">'+BX.esc([r.email,r.phone,r.city,r.links].filter(Boolean).join(' · '))+'</div>'+(r.summary?'<section><h2>Professional Summary</h2><div>'+BX.esc(r.summary)+'</div></section>':'')+(r.exp.length?'<section><h2>Experience</h2>'+r.exp.map(x=>'<div class="exp"><div class="exphead"><span>'+BX.esc(x.title)+' — '+BX.esc(x.company)+'</span><span>'+BX.esc(x.dates)+'</span></div><div class="sub">'+BX.esc(x.location)+'</div><ul>'+(x.bullets||[]).filter(Boolean).map(b=>'<li>'+BX.esc(b)+'</li>').join('')+'</ul></div>').join('')+'</section>':'')+(r.edu.length?'<section><h2>Education</h2>'+r.edu.map(x=>'<div class="exp"><div class="exphead"><span>'+BX.esc(x.degree)+'</span><span>'+BX.esc(x.school)+'</span></div></div>').join('')+'</section>':'')+(r.skills.length?'<section><h2>Skills</h2><div>'+BX.esc(r.skills.join(' · '))+'</div></section>':'')}function init(){render();runATS()}init();</script></body></html>
