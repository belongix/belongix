<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belongix — Resume Builder</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body class="resumePage"><header class="topbar"><a class="logo" href="index.html">Belong<b>ix</b></a><nav class="nav"><a href="dashboard.html">Workspace</a><a class="active" href="resume-builder.html">Resume Builder</a><a href="career-profile.html">Profile</a><a href="settings.html">Settings</a></nav><div class="actions"><button class="btn" onclick="saveResume()">Save</button><button class="btn primary" onclick="window.print()">Export / Print</button></div></header><main class="resumeApp"><section class="editor"><div class="editorHead"><b>Resume Builder</b><span class="muted" id="saveState">Not saved</span></div><details class="editorSection" open><summary>Basics</summary><div class="editorBody"><div class="row"><div class="field"><label>Name</label><input id="rname" oninput="render()"></div><div class="field"><label>Professional title</label><input id="rrole" oninput="render()"></div></div><div class="field"><label>Contact line</label><input id="rcontact" placeholder="Bengaluru · email@example.com · +91 ... · linkedin.com/in/..." oninput="render()"></div><div class="field"><label>Summary</label><textarea id="rsummary" oninput="render()"></textarea></div></div></details><details class="editorSection" open><summary>Experience</summary><div class="editorBody"><div id="expEditor"></div><button class="btn" onclick="addExp()">+ Add experience</button></div></details><details class="editorSection" open><summary>Education</summary><div class="editorBody"><div id="eduEditor"></div><button class="btn" onclick="addEdu()">+ Add education</button></div></details><details class="editorSection" open><summary>Skills</summary><div class="editorBody"><div class="field"><label>Skills, separated by commas</label><input id="rskills" oninput="render()"></div></div></details><details class="editorSection"><summary>AI Resume Assistant</summary><div class="editorBody"><p class="muted">Select text from the editor and use AI to improve wording while preserving facts.</p><div class="heroBtns"><button class="btn primary" onclick="aiSummary()">Improve summary</button><button class="btn" onclick="aiBullets()">Improve bullets</button><button class="btn" onclick="quality()">Check quality</button></div><div id="aiResult" style="margin-top:14px"></div></div></details></section><section class="previewWrap"><article class="paper" id="paper"></article></section></main><script>
let session,data={experience:[],education:[]};
function expForm(x={}){return `<div class="card expForm" style="margin-bottom:10px"><div class="row"><div class="field"><label>Job title</label><input class="xTitle" value="${BX.esc(x.title||'')}" oninput="render()"></div><div class="field"><label>Company</label><input class="xCompany" value="${BX.esc(x.company||'')}" oninput="render()"></div></div><div class="field"><label>Dates / location</label><input class="xMeta" value="${BX.esc(x.meta||'')}" oninput="render()"></div><div class="field"><label>Achievements — one per line</label><textarea class="xBullets" oninput="render()">${BX.esc((x.bullets||[]).join('\\n'))}</textarea></div><button class="btn small danger" onclick="this.closest('.expForm').remove();render()">Remove</button></div>`}
function eduForm(x={}){return `<div class="card eduForm" style="margin-bottom:10px"><div class="row"><div class="field"><label>Degree</label><input class="eDegree" value="${BX.esc(x.degree||'')}" oninput="render()"></div><div class="field"><label>Institution</label><input class="eSchool" value="${BX.esc(x.school||'')}" oninput="render()"></div></div><div class="field"><label>Dates</label><input class="eMeta" value="${BX.esc(x.meta||'')}" oninput="render()"></div><button class="btn small danger" onclick="this.closest('.eduForm').remove();render()">Remove</button></div>`}
function addExp(){document.getElementById('expEditor').insertAdjacentHTML('beforeend',expForm());render()}function addEdu(){document.getElementById('eduEditor').insertAdjacentHTML('beforeend',eduForm());render()}
function collect(){data.experience=[...document.querySelectorAll('.expForm')].map(e=>({title:e.querySelector('.xTitle').value,company:e.querySelector('.xCompany').value,meta:e.querySelector('.xMeta').value,bullets:e.querySelector('.xBullets').value.split('\\n').map(x=>x.trim()).filter(Boolean)}));data.education=[...document.querySelectorAll('.eduForm')].map(e=>({degree:e.querySelector('.eDegree').value,school:e.querySelector('.eSchool').value,meta:e.querySelector('.eMeta').value}));return data}
function render(){collect();let name=BX.esc(document.getElementById('rname').value||'Your Name'),role=BX.esc(document.getElementById('rrole').value||'Professional Title'),contact=BX.esc(document.getElementById('rcontact').value||'email@example.com · Phone · Location'),summary=BX.esc(document.getElementById('rsummary').value||'Your professional summary will appear here.'),skills=(document.getElementById('rskills').value||'').split(',').map(x=>x.trim()).filter(Boolean);document.getElementById('paper').innerHTML=`<h1>${name}</h1><div class="role">${role}</div><div class="contact">${contact}</div><section><h2>Professional Summary</h2><p>${summary}</p></section><section><h2>Experience</h2>${data.experience.map(x=>`<div class="exp"><div class="expHead"><span>${BX.esc(x.title||'Job Title')} · ${BX.esc(x.company||'Company')}</span><span>${BX.esc(x.meta||'Dates')}</span></div><ul>${x.bullets.map(b=>`<li>${BX.esc(b)}</li>`).join('')}</ul></div>`).join('')}</section><section><h2>Education</h2>${data.education.map(x=>`<div class="exp"><div class="expHead"><span>${BX.esc(x.degree||'Degree')} · ${BX.esc(x.school||'Institution')}</span><span>${BX.esc(x.meta||'Dates')}</span></div></div>`).join('')}</section><section><h2>Skills</h2><p>${skills.map(BX.esc).join(' · ')}</p></section>`}
async function load(){session=await BX.requireAuth();if(!session)return;let r=BX.sb?await BX.sb.from('resumes').select('*').eq('user_id',session.user.id).order('updated_at',{ascending:false}).limit(1).maybeSingle():{data:null};let d=r.data;if(d){document.getElementById('rname').value=d.name||'';document.getElementById('rrole').value=d.role||'';document.getElementById('rcontact').value=d.contact||'';document.getElementById('rsummary').value=d.summary||'';document.getElementById('rskills').value=(d.skills||[]).join(', ');(d.experience||[]).forEach(addExp);(d.education||[]).forEach(addEdu)}else{addExp();addEdu()}render()}
async function saveResume(){if(!session)return;collect();let row={user_id:session.user.id,name:document.getElementById('rname').value.trim()||'My Resume',role:document.getElementById('rrole').value.trim(),contact:document.getElementById('rcontact').value.trim(),summary:document.getElementById('rsummary').value.trim(),skills:document.getElementById('rskills').value.split(',').map(x=>x.trim()).filter(Boolean),experience:data.experience,education:data.education,updated_at:new Date().toISOString()};let r=await BX.sb.from('resumes').upsert(row,{onConflict:'id'});document.getElementById('saveState').textContent=r.error?'Save failed':'Saved';BX.toast(r.error?r.error.message:'Resume saved')}
async function aiSummary(){let result=document.getElementById('aiResult');result.textContent='Improving…';try{let d=await BX.ai('improve_summary',{summary:document.getElementById('rsummary').value,profile:data});result.innerHTML=`<div class="card"><b>Suggestion</b><p>${BX.esc(d.result||d.summary||'No suggestion returned.')}</p><button class="btn primary" onclick="document.getElementById('rsummary').value=this.previousElementSibling.textContent;render()">Use suggestion</button></div>`}catch(e){result.textContent=e.message}}
async function aiBullets(){let result=document.getElementById('aiResult');result.textContent='Improving…';try{let d=await BX.ai('improve_bullets',{experience:data.experience});result.innerHTML=`<div class="card"><b>AI suggestions</b><pre style="white-space:pre-wrap;font:inherit">${BX.esc(JSON.stringify(d.result||d,null,2))}</pre></div>`}catch(e){result.textContent=e.message}}
function quality(){let text=document.getElementById('paper').innerText,checks=[['Name',!!document.getElementById('rname').value.trim()],['Title',!!document.getElementById('rrole').value.trim()],['Summary',document.getElementById('rsummary').value.trim().length>40],['Experience',data.experience.some(x=>x.title||x.company)],['Education',data.education.some(x=>x.degree||x.school)],['Skills',document.getElementById('rskills').value.trim().length>2]];let score=Math.round(checks.filter(x=>x[1]).length/checks.length*100);document.getElementById('aiResult').innerHTML=`<div class="card"><div class="score"><div class="scoreNum">${score}%</div><b>Resume quality readiness</b></div><div style="margin-top:14px">${checks.map(x=>`<div class="listitem"><span>${x[0]}</span><span>${x[1]?'✓':'Needs attention'}</span></div>`).join('')}</div></div>`}
load();
</script></body></html>
