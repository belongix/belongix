<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<style>
.ai-suggestion-actions{display:flex;gap:8px;margin-top:8px}
.bullet-row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.bullet-row textarea{min-height:38px;font-size:13px}
.entry-block{border-top:1px solid var(--border);padding:12px 0;margin-top:4px}
.entry-block:first-child{border-top:none;margin-top:0;padding-top:0}
.pv-name{font-size:22px;font-weight:700;margin-bottom:2px}
.pv-contact{font-size:11px;color:#555;margin-bottom:14px}
.pv-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #ccc;padding-bottom:3px;margin:16px 0 8px}
.pv-entry-title{font-weight:600;font-size:12.5px}
.pv-entry-sub{font-size:11px;color:#555;margin-bottom:4px}
.pv-bullet{font-size:11.5px;margin:2px 0 2px 14px}
.resume-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;cursor:pointer}
.resume-card:hover{border-color:var(--accent)}
.rc-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.rc-default{font-size:10px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:100px;font-weight:700}
.rc-sub{font-size:12px;color:var(--text-secondary);margin-top:4px}
.rc-meta{font-size:11px;color:var(--text-secondary);margin-top:10px}
.rc-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.ai-suggestion{background:var(--accent-light);border:1px solid #C7D2FE;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12.5px}
.ats-factor-row{display:flex;justify-content:space-between;padding:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
</style>
</head>

var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGNmdWF4Z2J6dXFsbWhsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDg1NzgsImV4cCI6MjA5MjcyNDU3OH0.vpFvBPnKkrMMONXo9z6FemJ2qIlRChRloQYRB0LMdjY';
var sb=supabase.createClient(SB_URL,SB_KEY);
var _user=null,_resumes=[],_current=null,_saveTimer=null;

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function gv(id){var el=document.getElementById(id);return el?el.value:'';}
function setv(id,val){var el=document.getElementById(id);if(el)el.value=val||'';}

window.addEventListener('load',async function(){
  try{
    var s=await sb.auth.getSession();
    if(!s.data||!s.data.session){window.location.href='career-profile.html';return;}
    _user=s.data.session.user;
    buildShell();
    await loadResumes();
    showList();
  }catch(e){window.location.href='career-profile.html';}
});

function buildShell(){
  var html =
    '<div id="view-list">'
    +'<div class="topbar"><div><h1>Your Resumes</h1><p style="color:var(--text-secondary);font-size:13px;margin-top:2px">Build ATS-ready resumes tailored to each role.</p></div><button class="btn btn-primary" onclick="createResume()">+ New Resume</button></div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px" id="resume-grid"></div>'
    +'</div>'

    +'<div id="view-editor" class="hidden">'
    +'<div class="topbar" style="flex-wrap:wrap;gap:12px">'
    +'<input class="input" id="edit-title" oninput="updateTitle()" style="font-weight:600;font-size:17px;border:none;background:transparent;max-width:320px;padding:4px"/>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +'<select id="template-select" onchange="setTemplate(this.value)" style="width:auto"><option value="classic">Classic template</option><option value="modern">Modern template</option><option value="minimal">Minimal template</option></select>'
    +'<button class="btn btn-secondary btn-sm" onclick="showList()">← All Resumes</button>'
    +'<button class="btn btn-primary btn-sm" onclick="exportPDF()">⬇ Export PDF</button>'
    +'</div></div>'

    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start" id="editor-grid-wrap">'
    +'<div id="editor-form">'

    +'<div class="card" style="margin-bottom:14px"><div class="card-title">Contact Information</div>'
    +'<div class="field-row"><div class="field"><label>Full name</label><input id="c-full_name" oninput="onFieldChange()"/></div><div class="field"><label>Email</label><input id="c-email" oninput="onFieldChange()"/></div></div>'
    +'<div class="field-row"><div class="field"><label>Phone</label><input id="c-phone" oninput="onFieldChange()"/></div><div class="field"><label>Location</label><input id="c-location" oninput="onFieldChange()"/></div></div>'
    +'<div class="field-row"><div class="field"><label>LinkedIn</label><input id="c-linkedin_url" oninput="onFieldChange()"/></div><div class="field"><label>Portfolio</label><input id="c-portfolio_url" oninput="onFieldChange()"/></div></div>'
    +'</div>'

    +'<div class="card" style="margin-bottom:14px"><div class="topbar" style="margin-bottom:10px"><div class="card-title" style="margin-bottom:0">Professional Summary</div><button class="ai-action" onclick="generateSummary()">✨ AI Generate</button></div>'
    +'<textarea id="c-summary" rows="3" oninput="onFieldChange()"></textarea><div id="summary-ai-box"></div></div>'

    +'<div class="card" style="margin-bottom:14px" id="section-work_experience"><div class="topbar" style="margin-bottom:10px"><div class="card-title" style="margin-bottom:0">Work Experience</div><button class="btn btn-secondary btn-sm" onclick="addWorkEntry()">+ Add</button></div><div id="work-entries"></div></div>'
    +'<div class="card" style="margin-bottom:14px" id="section-education"><div class="topbar" style="margin-bottom:10px"><div class="card-title" style="margin-bottom:0">Education</div><button class="btn btn-secondary btn-sm" onclick="addEduEntry()">+ Add</button></div><div id="edu-entries"></div></div>'
    +'<div class="card" style="margin-bottom:14px" id="section-skills"><div class="card-title">Skills</div><div id="skills-editor"></div></div>'
    +'<div class="card" style="margin-bottom:14px" id="section-certifications"><div class="topbar" style="margin-bottom:10px"><div class="card-title" style="margin-bottom:0">Certifications</div><button class="btn btn-secondary btn-sm" onclick="addCertEntry()">+ Add</button></div><div id="cert-entries"></div></div>'

    +'<div class="card"><div class="card-title">ATS Optimization</div>'
    +'<label>Paste a job description to check keyword match (optional)</label>'
    +'<textarea id="jd-text" rows="3" oninput="recomputeATS()" placeholder="Paste the job description here…"></textarea>'
    +'<div style="display:flex;align-items:center;gap:16px;margin-top:12px"><div style="font-size:28px;font-weight:700;color:var(--accent)" id="ats-num">0</div><div style="font-size:12px;color:var(--text-secondary)">ATS readiness score<br/>Computed from real factors below — never a fixed or random number.</div></div>'
    +'<div style="font-size:11.5px;color:var(--text-secondary);margin-top:10px" id="ats-factors"></div>'
    +'<div id="missing-keywords"></div>'
    +'</div>'
    +'</div>'

    +'<div style="position:sticky;top:20px"><div class="card-title" style="margin-bottom:10px">Live Preview</div>'
    +'<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:36px 40px;min-height:600px;font-size:12.5px;line-height:1.5;color:#111" id="preview-paper"></div></div>'

async function loadResumes(){
  try{
    var r=await sb.from('resumes').select('id,title,target_job_title,template_id,is_default,updated_at').eq('user_id',_user.id).order('updated_at',{ascending:false});
    _resumes=r.data||[];
  }catch(e){_resumes=[];}
}
function showList(){
  document.getElementById('view-editor').classList.add('hidden');
  document.getElementById('view-list').classList.remove('hidden');
  renderList();
}
function renderList(){
  var grid=document.getElementById('resume-grid');
  if(!_resumes.length){grid.innerHTML='<p style="color:var(--muted);grid-column:1/-1">No resumes yet. Create your first one.</p>';return;}
  grid.innerHTML=_resumes.map(function(r){
    return '<div class="resume-card" onclick="openResume(\''+r.id+'\')">'
      +'<div class="rc-title">'+esc(r.title)+(r.is_default?'<span class="rc-default">Default</span>':'')+'</div>'
      +'<div class="rc-sub">'+esc(r.target_job_title||'No target role set')+'</div>'
      +'<div class="rc-meta">'+esc(r.template_id)+' · edited '+new Date(r.updated_at).toLocaleDateString()+'</div>'
      +'<div class="rc-actions">'
      +'<button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();duplicateResume(\''+r.id+'\')">Duplicate</button>'
      +'<button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();setDefault(\''+r.id+'\')">Set default</button>'
      +'<button class="btn btn-danger" onclick="event.stopPropagation();deleteResume(\''+r.id+'\')">Delete</button>'
      +'</div></div>';
  }).join('');
}

async function createResume(){
  var content={contact:{},summary:'',sections:[
    {type:'work_experience',visible:true,order:0,items:[]},
    {type:'education',visible:true,order:1,items:[]},
    {type:'skills',visible:true,order:2,items:{technical:[],soft:[],tools:[]}},
    {type:'certifications',visible:true,order:3,items:[]}
  ]};
  try{
    var cp=await sb.from('career_profiles').select('*').eq('user_id',_user.id).maybeSingle();
    if(cp.data){
      content.contact={full_name:cp.data.full_name,email:cp.data.email,phone:cp.data.phone,
        location:[cp.data.city,cp.data.state].filter(Boolean).join(', '),
        linkedin_url:cp.data.linkedin_url,portfolio_url:cp.data.portfolio_url};
      content.summary=cp.data.professional_summary||'';
      content.sections[2].items={technical:cp.data.technical_skills||[],soft:cp.data.soft_skills||[],tools:cp.data.tools_and_platforms||[]};
    }
    var wx=await sb.from('career_work_experience').select('*').eq('user_id',_user.id).order('order_index');
    if(wx.data&&wx.data.length){
      content.sections[0].items=wx.data.map(function(w){
        return {job_title:w.job_title,company_name:w.company_name,location:w.location,
          start_date:w.start_date,end_date:w.end_date,is_current:w.is_current,
          bullets:(w.achievements&&w.achievements.length)?w.achievements.slice():(w.description?[w.description]:[])};
      });
    }
    var ed=await sb.from('career_education').select('*').eq('user_id',_user.id).order('order_index');
    if(ed.data&&ed.data.length){
      content.sections[1].items=ed.data.map(function(e){
        return {institution_name:e.institution_name,degree:e.degree,field_of_study:e.field_of_study,start_date:e.start_date,end_date:e.end_date};
      });
    }
  }catch(e){console.error('Auto-populate from Career Profile failed (continuing with blank resume):',e);}

  try{
    var r=await sb.from('resumes').insert({user_id:_user.id,title:'Untitled Resume',content:content}).select().single();
    if(r.error)throw r.error;
    await loadResumes();
    openResume(r.data.id);
  }catch(e){console.error(e);showToast('⚠️ Could not create resume');}
}

async function duplicateResume(id){
  try{
    var r=await sb.from('resumes').select('*').eq('id',id).eq('user_id',_user.id).single();
    if(r.error)throw r.error;
    var copy={user_id:_user.id,title:r.data.title+' (Copy)',target_job_title:r.data.target_job_title,
      target_company:r.data.target_company,template_id:r.data.template_id,content:r.data.content,is_default:false};
    var ins=await sb.from('resumes').insert(copy);
    if(ins.error)throw ins.error;
    await loadResumes();renderList();showToast('Resume duplicated');
  }catch(e){console.error(e);showToast('⚠️ Could not duplicate resume');}
}
async function deleteResume(id){
  if(!confirm('Delete this resume? This cannot be undone.'))return;
  try{
    var r=await sb.from('resumes').delete().eq('id',id).eq('user_id',_user.id);
    if(r.error)throw r.error;
    await loadResumes();renderList();showToast('Deleted');
  }catch(e){console.error(e);showToast('⚠️ Could not delete resume');}
}
async function setDefault(id){
  try{
    await sb.from('resumes').update({is_default:false}).eq('user_id',_user.id);
    var r=await sb.from('resumes').update({is_default:true}).eq('id',id).eq('user_id',_user.id);
    if(r.error)throw r.error;
    await loadResumes();renderList();showToast('Default resume updated');
  }catch(e){console.error(e);showToast('⚠️ Could not set default');}
}

async function openResume(id){
  try{
    var r=await sb.from('resumes').select('*').eq('id',id).eq('user_id',_user.id).single();
    if(r.error)throw r.error;
    _current=r.data;
    if(!_current.content||!_current.content.sections)_current.content={contact:{},summary:'',sections:[
      {type:'work_experience',visible:true,order:0,items:[]},{type:'education',visible:true,order:1,items:[]},
      {type:'skills',visible:true,order:2,items:{technical:[],soft:[],tools:[]}},{type:'certifications',visible:true,order:3,items:[]}
    ]};
    document.getElementById('view-list').classList.add('hidden');
    document.getElementById('view-editor').classList.remove('hidden');
    renderEditor();
  }catch(e){console.error(e);showToast('⚠️ Could not open resume');}
}

function sectionByType(type){return _current.content.sections.find(function(s){return s.type===type;});}

function renderEditor(){
  var c=_current.content;
  setv('edit-title',_current.title);
  document.getElementById('template-select').value=_current.template_id||'classic';
  var ct=c.contact||{};
  setv('c-full_name',ct.full_name);setv('c-email',ct.email);setv('c-phone',ct.phone);
  setv('c-location',ct.location);setv('c-linkedin_url',ct.linkedin_url);setv('c-portfolio_url',ct.portfolio_url);
  setv('c-summary',c.summary);

  renderWorkEntries();renderEduEntries();renderSkillsEditor();renderCertEntries();
  recomputeATS();
  renderPreview();
}

function updateTitle(){_current.title=gv('edit-title');scheduleSave();}
function setTemplate(t){_current.template_id=t;scheduleSave();renderPreview();}
function onFieldChange(){
  _current.content.contact={full_name:gv('c-full_name'),email:gv('c-email'),phone:gv('c-phone'),
    location:gv('c-location'),linkedin_url:gv('c-linkedin_url'),portfolio_url:gv('c-portfolio_url')};
  _current.content.summary=gv('c-summary');
  scheduleSave();renderPreview();recomputeATS();
}
function scheduleSave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(saveResume,900);
}
async function saveResume(){
  try{
    var r=await sb.from('resumes').update({title:_current.title,template_id:_current.template_id,content:_current.content}).eq('id',_current.id).eq('user_id',_user.id);
    if(r.error)throw r.error;
  }catch(e){console.error('Save failed:',e);showToast('⚠️ Could not save — check your connection');}
}

function renderWorkEntries(){
  var sec=sectionByType('work_experience');
  document.getElementById('work-entries').innerHTML=sec.items.map(function(w,i){
    var bullets=(w.bullets||[]).map(function(b,bi){
      return '<div class="bullet-row"><textarea oninput="updateBullet('+i+','+bi+',this.value)">'+esc(b)+'</textarea>'
        +'<button class="btn btn-ai btn-xs" onclick="improveBullet('+i+','+bi+')" title="Improve with AI">✨</button>'
        +'<button class="btn btn-danger btn-xs" onclick="removeBullet('+i+','+bi+')">×</button></div>'
        +'<div id="bullet-ai-'+i+'-'+bi+'"></div>';
    }).join('');
    return '<div class="entry-block">'
      +'<div class="field-row"><div class="field"><label>Job title</label><input value="'+esc(w.job_title)+'" oninput="updateWorkField('+i+',\'job_title\',this.value)"/></div><div class="field"><label>Company</label><input value="'+esc(w.company_name)+'" oninput="updateWorkField('+i+',\'company_name\',this.value)"/></div></div>'
      +'<div class="field-row"><div class="field"><label>Start</label><input type="date" value="'+esc(w.start_date)+'" oninput="updateWorkField('+i+',\'start_date\',this.value)"/></div><div class="field"><label>End</label><input type="date" value="'+esc(w.end_date)+'" oninput="updateWorkField('+i+',\'end_date\',this.value)" '+(w.is_current?'disabled':'')+'/></div></div>'
      +'<label>Bullet points</label>'+bullets
      +'<button class="btn btn-ghost btn-xs" onclick="addBullet('+i+')">+ Add bullet</button>'
      +'<div style="margin-top:8px"><button class="btn btn-danger" onclick="removeWorkEntry('+i+')">Remove this role</button></div>'
      +'</div>';
  }).join('')||'<p style="color:var(--muted);font-size:12.5px">No work experience yet.</p>';
}
function addWorkEntry(){sectionByType('work_experience').items.push({job_title:'',company_name:'',start_date:'',end_date:'',bullets:[]});renderWorkEntries();renderPreview();}
function removeWorkEntry(i){sectionByType('work_experience').items.splice(i,1);renderWorkEntries();scheduleSave();renderPreview();recomputeATS();}
function updateWorkField(i,field,val){sectionByType('work_experience').items[i][field]=val;scheduleSave();renderPreview();}
function addBullet(i){sectionByType('work_experience').items[i].bullets.push('');renderWorkEntries();}
function removeBullet(i,bi){sectionByType('work_experience').items[i].bullets.splice(bi,1);renderWorkEntries();scheduleSave();renderPreview();recomputeATS();}
function updateBullet(i,bi,val){sectionByType('work_experience').items[i].bullets[bi]=val;scheduleSave();renderPreview();recomputeATS();}

function renderEduEntries(){
  var sec=sectionByType('education');
  document.getElementById('edu-entries').innerHTML=sec.items.map(function(e,i){
    return '<div class="entry-block">'
      +'<div class="field"><label>Institution</label><input value="'+esc(e.institution_name)+'" oninput="updateEduField('+i+',\'institution_name\',this.value)"/></div>'
      +'<div class="field-row"><div class="field"><label>Degree</label><input value="'+esc(e.degree)+'" oninput="updateEduField('+i+',\'degree\',this.value)"/></div><div class="field"><label>Field of study</label><input value="'+esc(e.field_of_study)+'" oninput="updateEduField('+i+',\'field_of_study\',this.value)"/></div></div>'
      +'<button class="btn btn-danger" onclick="removeEduEntry('+i+')">Remove</button></div>';
  }).join('')||'<p style="color:var(--muted);font-size:12.5px">No education yet.</p>';
}
function addEduEntry(){sectionByType('education').items.push({institution_name:'',degree:'',field_of_study:''});renderEduEntries();renderPreview();}
function removeEduEntry(i){sectionByType('education').items.splice(i,1);renderEduEntries();scheduleSave();renderPreview();}
function updateEduField(i,field,val){sectionByType('education').items[i][field]=val;scheduleSave();renderPreview();}

function renderSkillsEditor(){
  var sec=sectionByType('skills');
  var html='';
  ['technical','soft','tools'].forEach(function(cat){
    var label=cat==='technical'?'Technical skills':cat==='soft'?'Soft skills':'Tools & platforms';
    html+='<div class="field"><label>'+label+'</label>'
      +'<div style="display:flex;gap:6px"><input id="skill-input-'+cat+'" placeholder="Type and press Enter" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addSkill(\''+cat+'\')}"/></div>'
      +'<div class="chips" id="skill-chips-'+cat+'">'+renderSkillChips(cat)+'</div></div>';
  });
  document.getElementById('skills-editor').innerHTML=html;
}
function renderSkillChips(cat){
  var vals=sectionByType('skills').items[cat]||[];
  return vals.map(function(v,i){return '<span class="chip">'+esc(v)+'<button onclick="removeSkill(\''+cat+'\','+i+')">×</button></span>';}).join('');
}
function addSkill(cat){
  var input=document.getElementById('skill-input-'+cat);var val=input.value.trim();if(!val)return;
  var items=sectionByType('skills').items;items[cat]=items[cat]||[];
  if(items[cat].indexOf(val)===-1)items[cat].push(val);
  input.value='';
  document.getElementById('skill-chips-'+cat).innerHTML=renderSkillChips(cat);
  scheduleSave();renderPreview();recomputeATS();
}
function removeSkill(cat,i){sectionByType('skills').items[cat].splice(i,1);document.getElementById('skill-chips-'+cat).innerHTML=renderSkillChips(cat);scheduleSave();renderPreview();}

function renderCertEntries(){
  var sec=sectionByType('certifications');
  document.getElementById('cert-entries').innerHTML=sec.items.map(function(c,i){
    return '<div class="entry-block field-row">'
      +'<div class="field"><label>Certification</label><input value="'+esc(c.name)+'" oninput="updateCertField('+i+',\'name\',this.value)"/></div>'
      +'<div class="field"><label>Issuer</label><input value="'+esc(c.issuer)+'" oninput="updateCertField('+i+',\'issuer\',this.value)"/></div>'
      +'<button class="btn btn-danger" style="align-self:flex-end" onclick="removeCertEntry('+i+')">×</button></div>';
  }).join('')||'<p style="color:var(--muted);font-size:12.5px">None added.</p>';
}
function addCertEntry(){sectionByType('certifications').items.push({name:'',issuer:'',date:''});renderCertEntries();renderPreview();}
function removeCertEntry(i){sectionByType('certifications').items.splice(i,1);renderCertEntries();scheduleSave();renderPreview();}
function updateCertField(i,field,val){sectionByType('certifications').items[i][field]=val;scheduleSave();renderPreview();}

async function callAI(action,payload){
  var session=await sb.auth.getSession();
  var token=session.data.session.access_token;
  var r=await fetch(SB_URL+'/functions/v1/resume-ai-generate',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({action:action,resume_id:_current?_current.id:null,payload:payload})
  });
  var d=await r.json();
  if(!r.ok)throw new Error(d.error||'AI request failed');
  return d;
}

async function generateSummary(){
  var box=document.getElementById('summary-ai-box');
  box.innerHTML='<div class="ai-suggestion">Generating…</div>';
  try{
    var cp=await sb.from('career_profiles').select('target_role,target_industry,years_of_experience,current_title,current_company,technical_skills').eq('user_id',_user.id).maybeSingle();
    var payload=cp.data||{};
    payload.target_job_title=payload.target_role||_current.target_job_title||'';
    var d=await callAI('generate_summary',payload);
    var safe=d.result.replace(/'/g,"\\'").replace(/\n/g,' ');
    box.innerHTML='<div class="ai-suggestion"><div class="ai-suggestion-label">AI suggestion</div>'+esc(d.result)
      +'<div class="ai-suggestion-actions">'
      +'<button class="btn btn-primary btn-xs" onclick="acceptSummary(\''+d.log_id+'\',\''+safe+'\')">Accept</button>'
      +'<button class="btn btn-ghost btn-xs" onclick="rejectSuggestion(\''+d.log_id+'\',this)">Reject</button>'
      +'</div></div>';
  }catch(e){console.error(e);box.innerHTML='<div class="ai-suggestion" style="color:var(--danger)">⚠️ '+esc(e.message)+'</div>';}
}
async function acceptSummary(logId,text){
  setv('c-summary',text);onFieldChange();
  if(logId&&logId!=='null')await sb.from('ai_generation_history').update({accepted:true}).eq('id',logId);
  document.getElementById('summary-ai-box').innerHTML='';
  showToast('Summary updated ✓');
}
async function rejectSuggestion(logId,btn){
  if(logId&&logId!=='null')await sb.from('ai_generation_history').update({accepted:false}).eq('id',logId);
  var box=btn.closest('.ai-suggestion');if(box)box.remove();
}

async function improveBullet(wi,bi){
  var box=document.getElementById('bullet-ai-'+wi+'-'+bi);
  var original=sectionByType('work_experience').items[wi].bullets[bi];
  if(!original){showToast('Write the bullet first, then improve it with AI');return;}
  box.innerHTML='<div class="ai-suggestion">Generating…</div>';
  try{
    var d=await callAI('improve_bullet',{original_text:original});
    var safe=d.result.replace(/'/g,"\\'").replace(/\n/g,' ');
    box.innerHTML='<div class="ai-suggestion"><div class="ai-suggestion-label">AI suggestion</div>'+esc(d.result)
      +'<div class="ai-suggestion-actions">'
      +'<button class="btn btn-primary btn-xs" onclick="acceptBullet('+wi+','+bi+',\''+d.log_id+'\',\''+safe+'\')">Accept</button>'
      +'<button class="btn btn-ghost btn-xs" onclick="rejectSuggestion(\''+d.log_id+'\',this)">Reject</button>'
      +'</div></div>';
  }catch(e){console.error(e);box.innerHTML='<div class="ai-suggestion" style="color:var(--danger)">⚠️ '+esc(e.message)+'</div>';}
}
async function acceptBullet(wi,bi,logId,text){
  sectionByType('work_experience').items[wi].bullets[bi]=text;
  renderWorkEntries();scheduleSave();renderPreview();recomputeATS();
  if(logId&&logId!=='null')await sb.from('ai_generation_history').update({accepted:true}).eq('id',logId);
  showToast('Bullet updated ✓');
}

async function suggestKeywords(){
  var jd=gv('jd-text');
  if(!jd.trim()){showToast('Paste a job description first');return;}
  try{
    var d=await callAI('suggest_keywords',{resume_text:getResumeText(),job_description:jd});
    var kws=[];try{kws=JSON.parse(d.result);}catch(e){}
    document.getElementById('missing-keywords').innerHTML=kws.length
      ?'<div class="ai-suggestion" style="margin-top:10px"><div class="ai-suggestion-label">Missing keywords (AI-suggested from the job description)</div>'+kws.map(function(k){return '<span class="chip" style="margin:4px 4px 0 0">'+esc(k)+'</span>';}).join('')+'</div>'
      :'';
  }catch(e){console.error(e);showToast('⚠️ '+e.message);}
}

var STRONG_VERBS=['led','built','launched','improved','reduced','increased','managed','designed','implemented','created','delivered','optimized','drove','developed','achieved','negotiated','architected','scaled','automated','shipped'];
function getResumeText(){
  var c=_current.content;var parts=[c.summary||''];
  sectionByType('work_experience').items.forEach(function(w){parts.push(w.job_title,w.company_name);(w.bullets||[]).forEach(function(b){parts.push(b);});});
  var sk=sectionByType('skills').items;parts=parts.concat(sk.technical||[],sk.soft||[],sk.tools||[]);
  return parts.join(' ');
}
function calculateATS(){
  var c=_current.content;var factors=[];
  var allBullets=[];sectionByType('work_experience').items.forEach(function(w){allBullets=allBullets.concat(w.bullets||[]);});
  var fullText=getResumeText();
  var wordCount=fullText.split(/\s+/).filter(Boolean).length;

  factors.push({label:'Word count (400–800 ideal)',earned:(wordCount>=200&&wordCount<=900)?15:Math.round(15*Math.min(wordCount,200)/200),max:15});

  var quantBullets=allBullets.filter(function(b){return /\d/.test(b);}).length;
  factors.push({label:'Quantifiable achievements',earned:allBullets.length?Math.round(quantBullets/allBullets.length*20):0,max:20});

  var sectionsPresent=['work_experience','education','skills'].filter(function(t){var s=sectionByType(t);return s.visible&&((Array.isArray(s.items)?s.items.length:Object.keys(s.items||{}).some(function(k){return (s.items[k]||[]).length;})));}).length;
  factors.push({label:'Standard sections present',earned:Math.round(sectionsPresent/3*20),max:20});

  var contactComplete=(c.contact&&c.contact.email?1:0)+(c.contact&&c.contact.phone?1:0);
  factors.push({label:'Contact info complete',earned:Math.round(contactComplete/2*10),max:10});

  var actionVerbBullets=allBullets.filter(function(b){var first=(b.trim().split(/\s+/)[0]||'').toLowerCase().replace(/[^a-z]/g,'');return STRONG_VERBS.indexOf(first)!==-1;}).length;
  factors.push({label:'Bullets start with strong action verbs',earned:allBullets.length?Math.round(actionVerbBullets/allBullets.length*15):0,max:15});

  var jd=gv('jd-text').trim();
  if(jd){
    var stop=['the','and','for','with','a','an','to','of','in','on','is','are','as','be','this','that','will','you','your'];
    var jdWords=jd.toLowerCase().match(/[a-z]{3,}/g)||[];
    var jdSet=Array.from(new Set(jdWords.filter(function(w){return stop.indexOf(w)===-1;})));
    var resumeLower=fullText.toLowerCase();
    var matched=jdSet.filter(function(w){return resumeLower.indexOf(w)!==-1;}).length;
    factors.push({label:'Keyword match vs. job description',earned:jdSet.length?Math.round(matched/jdSet.length*20):0,max:20});
  }

  var earnedTotal=factors.reduce(function(s,f){return s+f.earned;},0);
  var maxTotal=factors.reduce(function(s,f){return s+f.max;},0);
  return {score:maxTotal?Math.round(earnedTotal/maxTotal*100):0,factors:factors};
}
function recomputeATS(){
  if(!_current)return;
  var r=calculateATS();
  document.getElementById('ats-num').textContent=r.score;
  document.getElementById('ats-factors').innerHTML=r.factors.map(function(f){return '<div class="ats-factor-row"><span>'+esc(f.label)+'</span><span>'+f.earned+'/'+f.max+'</span></div>';}).join('')
    +'<button class="btn btn-ai btn-xs" style="margin-top:10px" onclick="suggestKeywords()">✨ AI: Suggest missing keywords</button>';
}

function renderPreview(){
  var c=_current.content;var tpl=_current.template_id||'classic';
  var paper=document.getElementById('preview-paper');
  var nameSize=tpl==='minimal'?'26px':tpl==='modern'?'24px':'22px';
  var accent=tpl==='modern'?'#2D1B69':'#111';
  paper.style.fontFamily=tpl==='classic'?'Georgia, serif':'Arial, sans-serif';
  var html='<div class="pv-name" style="font-size:'+nameSize+';color:'+accent+'">'+esc((c.contact&&c.contact.full_name)||'Your Name')+'</div>';
  var contactBits=[c.contact&&c.contact.email,c.contact&&c.contact.phone,c.contact&&c.contact.location,c.contact&&c.contact.linkedin_url].filter(Boolean);
  html+='<div class="pv-contact">'+esc(contactBits.join(' · '))+'</div>';
  if(c.summary)html+='<p>'+esc(c.summary)+'</p>';

  var we=sectionByType('work_experience');
  if(we.visible&&we.items.length){
    html+='<div class="pv-section-title" style="'+(tpl==='modern'?'color:'+accent+';border-color:'+accent:'')+'">Experience</div>';
    we.items.forEach(function(w){
      html+='<div class="pv-entry-title">'+esc(w.job_title)+' — '+esc(w.company_name)+'</div>';
      html+='<div class="pv-entry-sub">'+esc(w.start_date||'')+' – '+(w.is_current?'Present':esc(w.end_date||''))+'</div>';
      (w.bullets||[]).forEach(function(b){if(b)html+='<div class="pv-bullet">• '+esc(b)+'</div>';});
    });
  }
  var ed=sectionByType('education');
  if(ed.visible&&ed.items.length){
    html+='<div class="pv-section-title" style="'+(tpl==='modern'?'color:'+accent+';border-color:'+accent:'')+'">Education</div>';
    ed.items.forEach(function(e){html+='<div class="pv-entry-title">'+esc(e.degree||'')+(e.field_of_study?' in '+esc(e.field_of_study):'')+'</div><div class="pv-entry-sub">'+esc(e.institution_name)+'</div>';});
  }
  var sk=sectionByType('skills');
  if(sk.visible&&(sk.items.technical.length||sk.items.soft.length||sk.items.tools.length)){
    html+='<div class="pv-section-title" style="'+(tpl==='modern'?'color:'+accent+';border-color:'+accent:'')+'">Skills</div>';
    html+='<p>'+esc([].concat(sk.items.technical,sk.items.tools,sk.items.soft).join(' · '))+'</p>';
  }
  var ce=sectionByType('certifications');
  if(ce.visible&&ce.items.length){
    html+='<div class="pv-section-title" style="'+(tpl==='modern'?'color:'+accent+';border-color:'+accent:'')+'">Certifications</div>';
    ce.items.forEach(function(cert){if(cert.name)html+='<div class="pv-bullet">'+esc(cert.name)+(cert.issuer?' — '+esc(cert.issuer):'')+'</div>';});
  }
  paper.innerHTML=html;
}

function exportPDF(){
  var doc=new jspdf.jsPDF({unit:'pt',format:'letter'});
  var tpl=_current.template_id||'classic';
  var c=_current.content;
  var margin=54,y=margin,pageWidth=612-margin*2;
  var font=tpl==='classic'?'times':'helvetica';
  var accentRGB=tpl==='modern'?[45,27,105]:[17,17,17];

  function line(text,size,style,color,spacing){
    doc.setFont(font,style||'normal');doc.setFontSize(size);
    doc.setTextColor(color?color[0]:17,color?color[1]:17,color?color[2]:17);
    var lines=doc.splitTextToSize(text,pageWidth);
    lines.forEach(function(l){
      if(y>720){doc.addPage();y=margin;}
      doc.text(l,margin,y);y+=(size*1.25);
    });
    y+=spacing||0;
  }
  function heading(text){
    y+=6;
    doc.setDrawColor(accentRGB[0],accentRGB[1],accentRGB[2]);
    line(text.toUpperCase(),11,'bold',accentRGB,2);
    if(tpl!=='minimal'){doc.line(margin,y-8,margin+pageWidth,y-8);}
    y+=4;
  }

  line((c.contact&&c.contact.full_name)||'Your Name',tpl==='minimal'?20:18,'bold',accentRGB,2);
  var contactBits=[c.contact&&c.contact.email,c.contact&&c.contact.phone,c.contact&&c.contact.location,c.contact&&c.contact.linkedin_url].filter(Boolean);
  if(contactBits.length)line(contactBits.join('  ·  '),9.5,'normal',[85,85,85],10);

  if(c.summary){line(c.summary,10,'normal',[17,17,17],8);}

  var we=sectionByType('work_experience');
  if(we.visible&&we.items.length){
    heading('Experience');
    we.items.forEach(function(w){
      line(w.job_title+' — '+w.company_name,11,'bold',[17,17,17],0);
      line((w.start_date||'')+' – '+(w.is_current?'Present':(w.end_date||'')),9,'italic',[100,100,100],4);
      (w.bullets||[]).forEach(function(b){if(b)line('•  '+b,9.5,'normal',[30,30,30],2);});
      y+=4;
    });
  }
  var ed=sectionByType('education');
  if(ed.visible&&ed.items.length){
    heading('Education');
    ed.items.forEach(function(e){
      line((e.degree||'')+(e.field_of_study?' in '+e.field_of_study:''),10.5,'bold',[17,17,17],0);
      line(e.institution_name,9.5,'normal',[85,85,85],6);
    });
  }
  var sk=sectionByType('skills');
  if(sk.visible&&(sk.items.technical.length||sk.items.soft.length||sk.items.tools.length)){
    heading('Skills');
    line([].concat(sk.items.technical,sk.items.tools,sk.items.soft).join('  ·  '),9.5,'normal',[30,30,30],6);
  }
  var ce=sectionByType('certifications');
  if(ce.visible&&ce.items.length){
    heading('Certifications');
    ce.items.forEach(function(cert){if(cert.name)line(cert.name+(cert.issuer?' — '+cert.issuer:''),9.5,'normal',[30,30,30],2);});
  }

  doc.save((_current.title||'resume').replace(/[^a-z0-9]/gi,'_')+'.pdf');
  showToast('PDF downloaded');
}
</script>
